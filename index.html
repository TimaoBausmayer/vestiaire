      <div class="wrap">
        ${allScorers.map(s=>s.name).map(n=>{
          const votedByMe = this.me && m.goalVotes && m.goalVotes[n] && m.goalVotes[n][slugify(this.me)];
          return `<span class="chip ${votedByMe?'active':''}" onclick="App.voteBeautifulGoal('${m.id}','${jsa(n)}')">${esc(n)}</span>`;
        }).join("")}
      </div>
      ${beautifulGoal.length ? `<div style="margin-top:10px;">
        ${beautifulGoal.map((w,i)=>`<div class="kv"><span>${['🥇','🥈','🥉'][i]} ${esc(w.name)}</span><span class="muted">${w.count} vote${w.count>1?'s':''}</span></div>`).join("")}
      </div>` : `<p class="muted" style="font-size:12.5px;">Aucun vote pour l'instant.</p>`}
      ` : ""}
    `;
  },
  MATCH_VOTE_BEST_SIZE: 10,
  MATCH_VOTE_WORST_SIZE: 3,
  matchVotePoints(matchVotes, field, rankSize){
    const tally = {};
    let raterCount = 0;
    Object.values(matchVotes||{}).forEach(ballot=>{
      const list = ballot && ballot[field];
      if(!list || !list.some(Boolean)) return;
      raterCount++;
      list.forEach((name,i)=>{
        if(!name) return;
        const pts = rankSize - i;
        if(pts>0) tally[name] = (tally[name]||0) + pts;
      });
    });
    return {tally, raterCount};
  },
  // Le MVP d'un match n'est PLUS simplement celui qui a la meilleure note moyenne individuelle : c'est
  // celui qui est 1er du "classement du match" (le vote de toute l'équipe, top 10 meilleurs — voir
  // renderMatchRankVote/openMatchRankBallot). Typiquement, quelqu'un peut avoir une bonne note perso mais
  // ne pas être le mieux classé par ses coéquipiers, et inversement — c'est ce classement voté qui décide
  // du MVP maintenant, pas la note brute. S'il n'y a encore aucun vote pour ce match (aucun classement),
  // on retombe sur l'ancien comportement (meilleure note moyenne) pour ne pas perdre le MVP des matchs
  // déjà notés avant l'existence du classement du match.
  matchMVP(m){
    if(!m) return null;
    const bestInfo = this.matchVotePoints(m.matchVotes, 'best', this.MATCH_VOTE_BEST_SIZE);
    if(bestInfo.raterCount>0){
      const ranked = Object.entries(bestInfo.tally).sort((a,b)=>b[1]-a[1]);
      if(ranked.length) return {name:ranked[0][0], source:'vote', points:ranked[0][1]};
    }
    if(m.ratings){
      let best=null, bestAvg=-1;
      Object.keys(m.ratings).forEach(p=>{
        const vals = Object.values(m.ratings[p]||{});
        if(!vals.length) return;
        const a = avg(vals);
        if(a>bestAvg){ bestAvg=a; best=p; }
      });
      if(best) return {name:best, source:'rating', avg:bestAvg};
    }
    return null;
  },
  renderMatchRankVote(m){
    const bestInfo = this.matchVotePoints(m.matchVotes, 'best', this.MATCH_VOTE_BEST_SIZE);
    const worstInfo = this.matchVotePoints(m.matchVotes, 'worst', this.MATCH_VOTE_WORST_SIZE);
    const bestRanking = Object.entries(bestInfo.tally).sort((a,b)=>b[1]-a[1]).slice(0,this.MATCH_VOTE_BEST_SIZE);
    const worstRanking = Object.entries(worstInfo.tally).sort((a,b)=>b[1]-a[1]).slice(0,this.MATCH_VOTE_WORST_SIZE);
    const raterKey = this.me ? slugify(this.me) : null;
    const mine = raterKey && m.matchVotes && m.matchVotes[raterKey];
    return `
      <hr class="sep">
      <h3 style="font-size:15px;">🗳️ Classement du match : top 10 meilleurs & top 3 pires</h3>
      <p class="muted" style="font-size:12px;margin-top:-4px;">Ce classement joue directement sur la note du match (bonus pour le top 10, malus pour le top 3 pires).</p>
      <button class="btn btn-soft btn-block" onclick="App.openMatchRankBallot('${m.id}')">${mine?"✏️ Modifier mon classement":"🗳️ Voter"}</button>
      ${bestRanking.length ? `
        <p class="muted" style="font-size:11.5px;margin:10px 0 4px;">🏅 Top meilleurs (voix pondérées) :</p>
        ${bestRanking.map(([n,pts],i)=>`<div class="kv" style="border:none;"><span>${this.rankMedal(i)} ${esc(n)}</span><b>${pts} pts</b></div>`).join("")}
      `:""}
      ${worstRanking.length ? `
        <p class="muted" style="font-size:11.5px;margin:10px 0 4px;">🙈 Top pires (voix pondérées) :</p>
        ${worstRanking.map(([n,pts],i)=>`<div class="kv" style="border:none;"><span>${this.rankMedal(i)} ${esc(n)}</span><b>${pts} pts</b></div>`).join("")}
      `:""}
    `;
  },
  openMatchRankBallot(matchId){
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const convoked = m.convoked && m.convoked.length ? m.convoked : this.state.players.map(p=>p.name);
    const raterKey = this.me ? slugify(this.me) : null;
    const mine = (raterKey && m.matchVotes && m.matchVotes[raterKey]) || {};
    const opt = (selectedName) => `<option value="">—</option>` + convoked.map(n=>`<option value="${esc(n)}" ${selectedName===n?'selected':''}>${esc(n)}</option>`).join("");
    const bestRows = []; for(let i=0;i<this.MATCH_VOTE_BEST_SIZE;i++) bestRows.push(`<label class="field">${this.rankMedal(i)} ${i+1}${i<3?'':'e'} <select id="mvb${i}">${opt(mine.best&&mine.best[i])}</select></label>`);
    const worstRows = []; for(let i=0;i<this.MATCH_VOTE_WORST_SIZE;i++) worstRows.push(`<label class="field">${this.rankMedal(i)} ${i+1}${i<3?'':'e'} pire <select id="mvw${i}">${opt(mine.worst&&mine.worst[i])}</select></label>`);
    this.modal(`
      <h3>🗳️ Mon classement du match</h3>
      <p class="muted" style="font-size:12px;margin-top:-4px;">${m.opponent?"vs "+esc(m.opponent):""} · classe jusqu'à ${this.MATCH_VOTE_BEST_SIZE} meilleurs et ${this.MATCH_VOTE_WORST_SIZE} pires (tu peux laisser des cases vides).</p>
      <h4 style="margin:10px 0 4px;font-size:13px;">🏅 Meilleurs</h4>
      ${bestRows.join("")}
      <h4 style="margin:10px 0 4px;font-size:13px;">🙈 Pires</h4>
      ${worstRows.join("")}
      <button class="btn btn-accent btn-block" onclick="App.submitMatchRankBallot('${matchId}')">Enregistrer mon classement</button>
    `);
  },
  submitMatchRankBallot(matchId){
    const best = []; for(let i=0;i<this.MATCH_VOTE_BEST_SIZE;i++) best.push(document.getElementById("mvb"+i).value || null);
    const worst = []; for(let i=0;i<this.MATCH_VOTE_WORST_SIZE;i++) worst.push(document.getElementById("mvw"+i).value || null);
    const bestFilled = best.filter(Boolean), worstFilled = worst.filter(Boolean);
    if(bestFilled.length===0 && worstFilled.length===0){ toast("Choisis au moins un joueur"); return; }
    if(new Set(bestFilled).size !== bestFilled.length){ toast("Le top meilleurs doit contenir des joueurs différents"); return; }
    if(new Set(worstFilled).size !== worstFilled.length){ toast("Le top pires doit contenir des joueurs différents"); return; }
    const overlap = bestFilled.filter(n=>worstFilled.includes(n));
    if(overlap.length){ toast("Un joueur ne peut pas être à la fois meilleur et pire : "+overlap.join(", ")); return; }
    this.ensureMe(async (me)=>{
      const raterKey = slugify(me);
      try{
        await this.db.collection("matches").doc(matchId).update({matchVotes:{[raterKey]:{best, worst}}});
        this.closeModal();
        toast("Classement enregistré");
      }catch(e){
        toast("❌ Échec de l'enregistrement (réseau ?) — réessaie");
      }
    });
  },
  openRatePlayer(matchId, name){
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const p = this.state.players.find(x=>x.name===name);
    const critList = this.ratingCriteriaFor(p && p.position);
    const raterKey = this.me ? slugify(this.me) : null;
    const mine = (raterKey && m.detailedRatings && m.detailedRatings[name] && m.detailedRatings[name][raterKey]) || {};
    this.modal(`
      <h3>📝 Noter ${esc(name)}${p&&p.position==='Gardien'?' 🧤 (gardien)':''}</h3>
      <p class="muted" style="font-size:12px;margin-top:-4px;">${fmtDate(m.date)}${m.opponent?" · vs "+esc(m.opponent):""}</p>
      <p class="muted" style="font-size:11.5px;margin-bottom:8px;">La note retenue pour la moyenne du joueur est la moyenne de toutes les notes remplies ci-dessous.</p>
      ${critList.map(c=>`<label class="field">${c.label} <input type="number" min="0" max="10" step="0.5" id="rc-${c.key}" value="${mine[c.key]!=null?mine[c.key]:''}" placeholder="–"></label>`).join("")}
      <button class="btn btn-accent btn-block" onclick="App.submitPlayerRating('${matchId}','${jsa(name)}')">Enregistrer ma note</button>
    `);
  },
  async submitPlayerRating(matchId, name){
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const p = this.state.players.find(x=>x.name===name);
    const critList = this.ratingCriteriaFor(p && p.position);
    const entry = {};
    let sum=0, count=0;
    critList.forEach(c=>{
      const el = document.getElementById("rc-"+c.key);
      const v = el ? parseFloat(el.value) : NaN;
      if(!isNaN(v)){ const clamped = Math.max(0,Math.min(10,v)); entry[c.key]=clamped; sum+=clamped; count++; }
    });
    if(count===0){ toast("Renseigne au moins une note"); return; }
    const avgVal = sum/count;
    this.ensureMe(async (me)=>{
      const raterKey = slugify(me);
      // Écrit uniquement la feuille "ratings.<joueur>.<toi>" (jamais tout le champ ratings) : voir le
      // commentaire sur flattenForUpdate plus haut — c'est ce qui permet à ta note et à celle d'un(e)
      // coéquipier(ère) de coexister et de se moyenner, au lieu que la 2e écrase la 1ère.
      // Si la sauvegarde échoue (mauvais réseau, typiquement en plein match), on le dit clairement plutôt
      // que d'afficher "Note enregistrée" alors que ta note n'est en fait jamais arrivée jusqu'au serveur —
      // c'est ce qui s'est produit pour au moins un joueur avant ce correctif : note perdue en silence.
      try{
        await this.db.collection("matches").doc(matchId).update({
          detailedRatings:{[name]:{[raterKey]: entry}},
          ratings:{[name]:{[raterKey]: Math.round(avgVal*10)/10}},
        });
        this.closeModal();
        toast("Note enregistrée pour "+name);
      }catch(e){
        toast("❌ Échec de l'enregistrement (réseau ?) — réessaie");
      }
    });
  },
  async voteWorst(matchId, name){
    this.ensureMe(async (me)=>{
      const raterKey = slugify(me);
      const m = this.state.matches.find(x=>x.id===matchId);
      const already = m.worstVotes && m.worstVotes[name] && m.worstVotes[name][raterKey];
      try{
        await this.db.collection("matches").doc(matchId).update({worstVotes:{[name]:{[raterKey]: already? false : true}}});
      }catch(e){
        toast("❌ Échec de l'enregistrement (réseau ?) — réessaie");
      }
    });
  },
  async voteBeautifulGoal(matchId, name){
    this.ensureMe(async (me)=>{
      const raterKey = slugify(me);
      const m = this.state.matches.find(x=>x.id===matchId);
      const already = m.goalVotes && m.goalVotes[name] && m.goalVotes[name][raterKey];
      try{
        await this.db.collection("matches").doc(matchId).update({goalVotes:{[name]:{[raterKey]: already? false : true}}});
      }catch(e){
        toast("❌ Échec de l'enregistrement (réseau ?) — réessaie");
      }
    });
  },

  matchStatTotals(m){
    const arrFor = {
      minutes:m.minutesPlayed, goals:m.scorers, freekick:m.freekickScored, freekickTaken:m.freekickTaken, assists:m.assists, penScored:m.penaltiesScored, penMissed:m.penaltiesMissed,
      penCaused:m.penaltiesCaused,
      cornersScored:m.cornersScored, cornersTaken:m.cornersTaken, shots:m.shotsOnTarget, tackles:m.tacklesWon,
      saves:m.saves, penSaved:m.penaltiesSaved, penConceded:m.penaltiesConceded,
      yellow:m.cardsYellow, red:m.cardsRed,
    };
    const out = {};
    this.STAT_COLS.forEach(c=>{ out[c.key] = (arrFor[c.key]||[]).reduce((sum,x)=>sum+(x.count||0),0); });
    // Le total "Buts" du match doit compter tous les types de buts (jeu, coup franc, corner, penalty),
    // pas seulement les buts "classiques" (m.scorers) — sinon un but sur coup franc ou penalty semblait
    // ne jamais être compté dans ce résumé, alors qu'il était bien enregistré.
    out.goals = ['scorers','freekickScored','cornersScored','penaltiesScored'].reduce(
      (sum,key)=> sum + ((m[key]||[]).reduce((s,x)=>s+(x.count||0),0)), 0
    );
    return out;
  },

      <div class="kv"><span>⛳ Coufrans marq. / tirés</span><b>${t.cornersScored} / ${t.cornersTaken}</b></div>

  },

  // Envoi d'une photo dans le chat : on la redimensionne/compresse (comme les autres photos de l'appli)

  // Compo d'équipe envoyée directement dans le chat, sans passer par le "Meilleur 11" ni la composition
  // d'un match précis — une compo entièrement libre/personnalisée, composée sur place puis postée comme un
  // message spécial (type:'lineup') qui s'affiche comme un petit terrain plutôt qu'un simple texte.
  renderChatLineupCard(m){
    const baseSlots = this.FORMATIONS[m.formation] || this.FORMATIONS["4-3-3"];
    const positions = m.positions || {};
    const slots = baseSlots.map(s=> positions[s.k] ? {...s, t:positions[s.k].t, l:positions[s.k].l} : s);
    const assignments = m.assignments || {};
    const filled = slots.filter(s=>assignments[s.k]);
    return `
      <div style="font-weight:700;font-size:12.5px;margin-bottom:2px;">🧠 Composition — ${esc(m.formation||"4-3-3")}</div>
      <div class="pitch chat-pitch">
        ${slots.map(s=>{
          const assigned = assignments[s.k];
          return `<div class="slot ${assigned?'':'empty'}" style="top:${s.t}%;left:${s.l}%;">
            <div class="dot">${assigned? initials(assigned) : s.k.replace(/[0-9]/g,'')}</div>
            ${assigned? `<div class="lb">${esc(assigned).split(' ')[0]}</div>` : ""}
          </div>`;
        }).join("")}
      </div>
      ${filled.length===0 ? `<p class="muted" style="font-size:11px;margin-top:2px;">Composition vide</p>` : ""}
    `;
  },
  openChatLineupComposer(){
    const formation = this.state.chatLineupFormation || "4-3-3";
    const assignments = this.state.chatLineupAssignments || {};
    const positions = this.state.chatLineupPositions || {};
    const baseSlots = this.FORMATIONS[formation];
    const slots = baseSlots.map(s=> positions[s.k] ? {...s, t:positions[s.k].t, l:positions[s.k].l} : s);
    const roster = this.state.players.map(p=>p.name);
    const tn = this.teamNames();
    const ch = this.state.chatChannel;
    const chLabel = ch==='general' ? 'Général' : (ch==='A' ? tn.a : tn.b);
    const hasCustomPositions = Object.keys(positions).length>0;
    this.modal(`
      <h3>🧠 Composition d'équipe</h3>
      <p class="muted" style="font-size:12px;margin-top:-4px;">Choisis une formation, place qui tu veux à chaque poste, puis envoie — elle sera postée dans le chat (canal "${esc(chLabel)}"). Fais glisser un petit rond pour le placer où tu veux — touche-le sans le bouger pour changer le joueur.</p>
      <label class="field">Formation
        <select onchange="App.setChatLineupFormation(this.value)">
          ${Object.keys(this.FORMATIONS).map(f=>`<option value="${f}" ${f===formation?'selected':''}>${f}</option>`).join("")}
        </select>
      </label>
      <div class="pitch">
        ${slots.map(s=>{
          const assigned = assignments[s.k];
          return `<div class="slot ${assigned?'':'empty'}" style="top:${s.t}%;left:${s.l}%;touch-action:none;" onpointerdown="App.startChatLineupSlotDrag(event,'${s.k}')">
            <div class="dot">${assigned? initials(assigned) : s.k.replace(/[0-9]/g,'')}</div>
            <div class="lb">${assigned? esc(assigned).split(' ')[0] : s.k}</div>
          </div>`;
        }).join("")}
      </div>
      ${hasCustomPositions ? `<button class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="App.resetChatLineupPositions()">↩️ Remettre les postes par défaut</button>` : ""}
      ${roster.length===0 ? `<p class="muted" style="font-size:12px;">Ajoute des joueurs dans l'onglet Recrues d'abord.</p>` : ""}
      <button class="btn btn-accent btn-block" style="margin-top:10px;" onclick="App.sendChatLineup()">📤 Envoyer dans le chat</button>
    `);
  },
  setChatLineupFormation(formation){
    this.state.chatLineupFormation = formation;
    this.state.chatLineupAssignments = {};
    this.state.chatLineupPositions = {};
    this.openChatLineupComposer();
  },
  // Glisser-déposer un poste dans le composeur de compo du chat — même mécanique que sur le terrain
  // tactique d'un match (seuil de 6px pour distinguer un tap d'un glissé), mais tout reste en mémoire
  // locale (pas de sauvegarde Firestore ici : cette compo n'existe que le temps de la composer, jusqu'à
  // l'envoi dans le chat).
  startChatLineupSlotDrag(evt, slotKey){
    evt.preventDefault();
    const slotEl = evt.currentTarget;
    const pitchEl = slotEl.closest('.pitch');
    if(!pitchEl){ this.openChatLineupSlotPicker(slotKey); return; }
    const rect = pitchEl.getBoundingClientRect();
    const startX = evt.clientX, startY = evt.clientY;
    let moved = false, lastL = null, lastT = null;
    const onMove = (e)=>{
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(Math.abs(dx)>6 || Math.abs(dy)>6) moved = true;
      if(!moved) return;
      let l = ((e.clientX - rect.left)/rect.width)*100;
      let t = ((e.clientY - rect.top)/rect.height)*100;
      l = Math.max(3, Math.min(97, l));
      t = Math.max(4, Math.min(97, t));
      slotEl.style.left = l+'%';
      slotEl.style.top = t+'%';
      lastL = l; lastT = t;
    };
    const onUp = ()=>{
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      if(moved && lastL!=null){
        this.state.chatLineupPositions = {...(this.state.chatLineupPositions||{}), [slotKey]: {t: Math.round(lastT*10)/10, l: Math.round(lastL*10)/10}};
        this.openChatLineupComposer();
      } else {
        this.openChatLineupSlotPicker(slotKey);
      }
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, {once:true});
  },
  resetChatLineupPositions(){
    this.state.chatLineupPositions = {};
    this.openChatLineupComposer();
  },
  openChatLineupSlotPicker(slotKey){
    const roster = this.state.players.map(p=>p.name);
    this.modal(`
      <h3>Poste : ${esc(slotKey)}</h3>
      <div class="wrap">
        <span class="chip" onclick="App.assignChatLineupSlot('${slotKey}','')">Vider</span>
        ${roster.map(n=>`<span class="chip" onclick="App.assignChatLineupSlot('${slotKey}','${jsa(n)}')">${esc(n)}</span>`).join("") || "<p class='muted'>Ajoute des joueurs dans l'onglet Recrues.</p>"}
      </div>
    `);
  },
  assignChatLineupSlot(slotKey, name){
    this.state.chatLineupAssignments = this.state.chatLineupAssignments || {};
    if(name) this.state.chatLineupAssignments[slotKey] = name; else delete this.state.chatLineupAssignments[slotKey];
    this.openChatLineupComposer();
  },
  async sendChatLineup(){
    const formation = this.state.chatLineupFormation || "4-3-3";
    const assignments = this.state.chatLineupAssignments || {};
    const positions = this.state.chatLineupPositions || {};
    const hasAny = Object.values(assignments).some(Boolean);
    if(!hasAny){ toast("Place au moins un joueur avant d'envoyer"); return; }
    this.ensureMe(async (me)=>{
      await this.db.collection("messages").add({
        channel:this.state.chatChannel, author:me, type:'lineup', formation, assignments, positions,
        createdAt:new Date().toISOString()
      });
      this.state.chatLineupAssignments = {};
      this.state.chatLineupPositions = {};
      this.closeModal();
      toast("Composition envoyée dans le chat");
    });
  },

  /* ============================= TAB 7 : Planning (entraînements & compétitions) ============================= */
  sortedEvents(){
    return this.state.events.slice().sort((a,b)=>((a.date||"")+(a.time||"")).localeCompare((b.date||"")+(b.time||"")));
  },
  upcomingEvents(){
    const today = todayISO();
    return this.sortedEvents().filter(e=>(e.date||"")>=today);
  },
  pastEventsList(){
    const today = todayISO();
    return this.sortedEvents().filter(e=>(e.date||"")<today).reverse();
  },
  eventIcon(type){ return type==='competition' ? '🏆' : type==='match' ? '⚽' : '🏋️'; },
  eventLabel(type){ return type==='competition' ? 'Gros match' : type==='match' ? 'Match' : 'Entraînement'; },
  renderPlanningTab(){
    const upcoming = this.upcomingEvents();
    const past = this.pastEventsList();
    const expanded = this.state.expandedPastEvents;
    return `
    ${this.renderCalendarMonth()}
    <div class="card">
      <div class="section-title">
        <h2 style="margin:0;">📅 Planning</h2>
        ${this.admin? `<button class="btn btn-ghost btn-sm" onclick="App.openNewEvent()">+ Nouvel événement</button>`:""}
      </div>
      <p class="muted" style="font-size:12.5px;margin-top:-4px;">Entraînements, matchs et gros matchs à venir. Indique si tu es présent(e), en retard, absent(e) ou si tu ne sais pas encore (🤷) pour aider le capitaine à s'organiser — tu peux aussi laisser une petite note (🗨️).</p>
      ${upcoming.length===0 ? `<div class="empty"><span class="e-ic">🗓️</span>Aucun événement à venir.${this.admin? "" : " Demande à ton capitaine d'en programmer un."}</div>` :
        upcoming.map(ev=>this.renderEventCard(ev,false)).join("")}
    </div>
    ${past.length ? `
    <div class="card">
      <div class="section-title">
        <h2 style="margin:0;">🗂️ Historique</h2>
        <button class="btn btn-ghost btn-sm" onclick="App.togglePastEvents()">${expanded? '✕ Fermer':'Voir ('+past.length+')'}</button>
      </div>
      ${expanded ? past.map(ev=>this.renderEventCard(ev,true)).join("") : ""}
    </div>` : ""}
    `;
  },
  togglePastEvents(){ this.state.expandedPastEvents = !this.state.expandedPastEvents; this.render(); },
  renderCalendarMonth(){
    const monthStr = this.state.calendarMonth || todayISO().slice(0,7);
    const [y,mo] = monthStr.split('-').map(Number);
    const first = new Date(y, mo-1, 1);
    const startWeekday = (first.getDay()+6)%7; // Lundi = 0
    const daysInMonth = new Date(y, mo, 0).getDate();
    const todayStr = todayISO();
    const byDate = {};
    this.state.events.forEach(e=>{ if(!e.date) return; (byDate[e.date] = byDate[e.date]||{events:[],matches:[]}).events.push(e); });
    this.state.matches.forEach(m=>{ if(!m.date) return; (byDate[m.date] = byDate[m.date]||{events:[],matches:[]}).matches.push(m); });
    const cells = [];
    for(let i=0;i<startWeekday;i++) cells.push(`<div class="cal-cell empty"></div>`);
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const info = byDate[dateStr];
      const isToday = dateStr===todayStr;
      const dots = info ? `<div class="cal-dots">${info.matches.map(()=>`<span class="cal-dot match"></span>`).join("")}${info.events.map(e=>`<span class="cal-dot ${e.type==='competition'?'competition':e.type==='match'?'match-event':'entrainement'}"></span>`).join("")}</div>` : "";
      cells.push(`<div class="cal-cell ${isToday?'today':''} ${info?'has-events':''}" ${info?`onclick="App.openCalendarDay('${dateStr}')"`:''}>
        <span class="cal-daynum">${d}</span>${dots}
      </div>`);
    }
    const monthLabel = first.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
    return `
    <div class="card">
      <div class="section-title">
        <h2 style="margin:0;">🗓️ Calendrier</h2>
        <div class="row" style="gap:2px;">
          <button class="btn btn-ghost btn-sm" style="padding:6px 10px;" onclick="App.shiftCalendarMonth(-1)">‹</button>
          <button class="btn btn-ghost btn-sm" style="padding:6px 8px;font-size:11px;" onclick="App.shiftCalendarMonth(0)">Auj.</button>
          <button class="btn btn-ghost btn-sm" style="padding:6px 10px;" onclick="App.shiftCalendarMonth(1)">›</button>
        </div>
      </div>
      <p class="muted" style="font-size:12.5px;margin-top:-6px;text-transform:capitalize;">${esc(monthLabel)}</p>
      <div class="cal-grid">
        ${['L','M','M','J','V','S','D'].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
        ${cells.join("")}
      </div>
      <div class="row" style="gap:12px;margin-top:10px;flex-wrap:wrap;">
        <span class="muted" style="font-size:11px;display:flex;align-items:center;gap:4px;"><span class="cal-dot entrainement"></span>Entraînement</span>
        <span class="muted" style="font-size:11px;display:flex;align-items:center;gap:4px;"><span class="cal-dot match"></span>Match</span>
        <span class="muted" style="font-size:11px;display:flex;align-items:center;gap:4px;"><span class="cal-dot competition"></span>Gros match</span>
      </div>
      <p class="muted" style="font-size:11px;margin-top:6px;">Touche un jour marqué pour voir le détail. Chaque nouvel événement ou match s'affiche ici automatiquement.</p>
    </div>`;
  },
  shiftCalendarMonth(delta){
    if(delta===0){ this.state.calendarMonth = todayISO().slice(0,7); this.render(); return; }
    const cur = this.state.calendarMonth || todayISO().slice(0,7);
    const [y,m] = cur.split('-').map(Number);
    const d = new Date(y, m-1+delta, 1);
    this.state.calendarMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    this.render();
  },
  openCalendarDay(dateStr){
    const evs = this.state.events.filter(e=>e.date===dateStr);
    const ms = this.state.matches.filter(m=>m.date===dateStr);
    this.modal(`
      <h3>🗓️ ${fmtDate(dateStr)}</h3>
      ${ms.length===0 && evs.length===0 ? `<p class="muted" style="font-size:12.5px;">Rien de prévu ce jour-là.</p>` : ""}
      ${ms.map(m=>`<div class="kv"><span>⚽ Match${m.opponent?' vs '+esc(m.opponent):''}</span><b>${esc(m.time||'')}</b></div>`).join("")}
      ${evs.map(e=>`<div class="kv"><span>${this.eventIcon(e.type)} ${esc(e.title||this.eventLabel(e.type))}</span><b>${esc(e.time||'')}</b></div>`).join("")}
      <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="App.closeModal()">Fermer</button>
    `);
  },
  renderEventCard(ev, isPast){
    const players = this.state.players;
    const responses = ev.responses || {};
    const counts = {present:0, late:0, unsure:0, absent:0};
    players.forEach(p=>{ const st = presenceStatus(responses[p.name]); if(st && counts[st]!==undefined) counts[st]++; });
    const noResponse = Math.max(0, players.length - counts.present - counts.late - counts.unsure - counts.absent);
    return `
    <div class="card tight" style="margin-bottom:10px;">
      <div class="section-title">
        <h3 style="margin:0;font-size:15px;">${this.eventIcon(ev.type)} ${esc(ev.title || this.eventLabel(ev.type))}</h3>
        ${this.admin? `<button class="btn btn-ghost btn-sm" onclick="App.openEditEvent('${ev.id}')">✏️</button>`:""}
      </div>
      <div class="muted" style="font-size:12px;margin-bottom:6px;">${this.eventLabel(ev.type)} · ${fmtDate(ev.date)}${ev.time?" à "+esc(ev.time):""}${ev.location?" · "+esc(ev.location):""}</div>
      ${ev.notes? `<p style="font-size:13px;margin:4px 0 8px;">${esc(ev.notes)}</p>`:""}
      <div class="kv" style="border:none;"><span>Réponses</span><b>✅ ${counts.present} · ⏰ ${counts.late} · 🤷 ${counts.unsure} · ❌ ${counts.absent} · ❔ ${noResponse}</b></div>
      <button class="btn btn-ghost btn-sm" onclick="App.viewMediaFor('event','${ev.id}')">📸 Photos / vidéos</button>
      <hr class="sep">
      ${isPast ? `<p class="muted" style="font-size:11.5px;margin:0 0 6px;">Qui était présent ce jour-là ? Tu peux corriger même après coup.</p>` : ""}
      ${players.length===0 ? `<p class="muted">Ajoute des joueurs dans l'onglet Recrues.</p>` : players.map(p=>{
        const entry = responses[p.name];
        const st = presenceStatus(entry);
        const note = presenceNote(entry);
        return `<div class="presence-row">
          <span class="nm">${esc(p.name)}</span>
          ${this.renderPresenceButtons('setEventPresence', ev.id, p.name, st)}
          <button class="pbtn ${note?'has-note':''}" onclick="App.openPresenceNote('event','${ev.id}','${jsa(p.name)}')" title="Ajouter une note">🗨️</button>
        </div>
        ${note ? `<p class="presence-note-preview">🗨️ ${esc(p.name)} : « ${esc(note)} »</p>` : ""}`;
      }).join("")}
    </div>`;
  },
  openNewEvent(){
    this.modal(`
      <h3>🆕 Nouvel événement</h3>
      <label class="field">Type
        <select id="evType">
          <option value="training">🏋️ Entraînement</option>
          <option value="match">⚽ Match</option>
          <option value="competition">🏆 Gros match</option>
        </select>
      </label>
      <label class="field">Titre <input type="text" id="evTitle" placeholder="ex: FC Rivals, ou Entraînement tactique"></label>
      <div class="grid2">
        <label class="field">Date <input type="date" id="evDate" value="${todayISO()}"></label>
        <label class="field">Heure <input type="time" id="evTime" value="19:00"></label>
      </div>
      <label class="field">Lieu <input type="text" id="evLoc" placeholder="Stade municipal"></label>
      <label class="field">Notes <textarea id="evNotes" rows="2" placeholder="Optionnel"></textarea></label>
      <button class="btn btn-accent btn-block" onclick="App.saveNewEvent()">Créer l'événement</button>
    `);
  },
  async saveNewEvent(){
    const type = document.getElementById("evType").value;
    const title = document.getElementById("evTitle").value.trim();
    const date = document.getElementById("evDate").value;
    const time = document.getElementById("evTime").value;
    const location = document.getElementById("evLoc").value.trim();
    const notes = document.getElementById("evNotes").value.trim();
    await this.db.collection("events").add({type, title, date, time, location, notes, responses:{}, createdAt:new Date().toISOString()});
    this.closeModal();
    toast("Événement créé");
  },
  openEditEvent(id){
    const ev = this.state.events.find(x=>x.id===id);
    if(!ev) return;
    this.modal(`
      <h3>✏️ Modifier l'événement</h3>
      <label class="field">Type
        <select id="evType">
          <option value="training" ${(ev.type!=='competition'&&ev.type!=='match')?'selected':''}>🏋️ Entraînement</option>
          <option value="match" ${ev.type==='match'?'selected':''}>⚽ Match</option>
          <option value="competition" ${ev.type==='competition'?'selected':''}>🏆 Gros match</option>
        </select>
      </label>
      <label class="field">Titre <input type="text" id="evTitle" value="${esc(ev.title||"")}" placeholder="ex: FC Rivals, ou Entraînement tactique"></label>
      <div class="grid2">
        <label class="field">Date <input type="date" id="evDate" value="${esc(ev.date||todayISO())}"></label>
        <label class="field">Heure <input type="time" id="evTime" value="${esc(ev.time||"19:00")}"></label>
      </div>
      <label class="field">Lieu <input type="text" id="evLoc" value="${esc(ev.location||"")}"></label>
      <label class="field">Notes <textarea id="evNotes" rows="2">${esc(ev.notes||"")}</textarea></label>
      <button class="btn btn-accent btn-block" onclick="App.saveEditEvent('${id}')">Enregistrer</button>
      ${this.admin? `<button class="btn btn-ghost btn-block" style="margin-top:8px;color:var(--danger);" onclick="App.deleteEvent('${id}')">🗑️ Supprimer cet événement</button>`:""}
    `);
  },
  async saveEditEvent(id){
    const type = document.getElementById("evType").value;
    const title = document.getElementById("evTitle").value.trim();
    const date = document.getElementById("evDate").value;
    const time = document.getElementById("evTime").value;
    const location = document.getElementById("evLoc").value.trim();
    const notes = document.getElementById("evNotes").value.trim();
    await this.db.collection("events").doc(id).update({type, title, date, time, location, notes});
    this.closeModal();
    toast("Événement mis à jour");
  },
  async deleteEvent(id){
    await this.db.collection("events").doc(id).delete();
    this.closeModal();
    toast("Événement supprimé");
  },
  async setEventPresence(eventId, name, status){
    this.ensureMe(async ()=>{
      // Écrit uniquement la feuille "status" pour ne pas effacer une éventuelle note déjà enregistrée
      // (voir flattenForUpdate plus haut dans le fichier, et le même choix dans setPresence()).
      await this.db.collection("events").doc(eventId).update({responses:{[name]:{status}}});
    });
  },
};

window.App = App;
document.addEventListener("DOMContentLoaded", ()=>App.init());
if(document.readyState !== "loading") App.init();
// PWA : enregistre le service worker pour que l'appli soit installable ("Ajouter à l'écran
// d'accueil") sur Android (et affichée en plein écran sans barre de navigateur une fois installée).
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
})();
</script>

</body>
