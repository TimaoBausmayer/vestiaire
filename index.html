  },
  computeTeamSplitStats(key){
    const players = this.state.players.filter(p=>p.team===key);
    const names = new Set(players.map(p=>p.name));
    let goals=0, assists=0, yellow=0, red=0, cornersScored=0, cornersTaken=0, freekickScored=0, freekickTaken=0, penaltiesScored=0, penaltiesMissed=0, penaltiesCaused=0,
        shotsOnTarget=0, tacklesWon=0, saves=0, penaltiesSaved=0, penaltiesConceded=0, minutesPlayed=0, ratingSum=0, ratingCount=0, mvp=0;
    // Stats manuelles (import, sans match associé) : rattachées au club permanent du joueur (player.team),
    // puisqu'elles ne sont liées à aucun match précis donc il n'y a pas d'équipe "de ce match" à utiliser.
    players.forEach(p=>{
      const manual = p.manualStats || {};
      goals += (manual.goals||0)+(manual.freekickScored||0)+(manual.cornersScored||0)+(manual.penaltiesScored||0);
      assists += manual.assists||0; yellow += manual.yellow||0; red += manual.red||0;
      cornersScored += manual.cornersScored||0; cornersTaken += manual.cornersTaken||0;
      freekickScored += manual.freekickScored||0; freekickTaken += manual.freekickTaken||0;
      penaltiesScored += manual.penaltiesScored||0; penaltiesMissed += manual.penaltiesMissed||0; penaltiesCaused += manual.penaltiesCaused||0;
      shotsOnTarget += manual.shotsOnTarget||0; tacklesWon += manual.tacklesWon||0;
      saves += manual.saves||0; penaltiesSaved += manual.penaltiesSaved||0; penaltiesConceded += manual.penaltiesConceded||0;
      minutesPlayed += manual.minutesPlayed||0;
    });
    // Le nombre de "matchs joués" ET le bilan V-N-D de l'équipe doivent compter les MATCHS réellement
    // disputés (un match compte pour 1, même si plusieurs joueurs de l'équipe y ont participé) — PAS la
    // somme des matchs joués / victoires-nuls-défaites individuels de chaque joueur (l'ancien calcul :
    // `matchesPlayed += s.matchesPlayed` et `W += s.W` etc. pour chaque joueur). Avec cet ancien calcul, un
    // seul match où 7 joueurs de l'équipe étaient convoqués comptait pour 7 "matchs joués" (écrasant "buts
    // par match" vers ~1.0 au lieu du vrai total marqué dans ce match) ET pour 7 victoires/défaites au lieu
    // d'1 seule (ex : un match 7-10 doit afficher 7.00 but/match et un bilan 0V-0N-1D pour nous, pas
    // 0V-0N-7D). m.score.us/them est toujours du point de vue de l'équipe A ("nous") : pour l'équipe B
    // (adverse, ex. FC Nulos) il faut inverser, sinon elle hérite de NOS résultats.
    let matchesPlayed = 0, W = 0, D = 0, L = 0;
    this.state.matches.forEach(m=>{
      if(!m.played) return;
      const roster = (m.convoked||[]).length ? m.convoked : uniq([...(m.teamA||[]), ...(m.teamB||[])]);
      if(!roster.some(n=>names.has(n))) return;
      matchesPlayed++;
      if(!m.score) return;
      const forTeam = key==='B' ? (m.score.them||0) : (m.score.us||0);
      const against = key==='B' ? (m.score.us||0) : (m.score.them||0);
      if(forTeam>against) W++; else if(forTeam===against) D++; else L++;
    });
    // Un joueur peut être tagué en fiche sur un club (player.team, permanent) mais avoir été placé sur
    // l'AUTRE équipe pour un match donné (erreur de saisie, joueur invité, équipes recomposées pour un match
    // amical...). Pour que les stats DE CE MATCH (buts, passes, cartons, penaltys, coups francs...)
    // reflètent vraiment ce qui s'est passé sur le terrain ce jour-là, on les additionne selon l'équipe où
    // le joueur était RÉELLEMENT placé POUR CE MATCH (m.teamA/m.teamB) — jamais sa fiche permanente. Sinon
    // un joueur mal placé/mal tagué fait gonfler le total de son club permanent au lieu de celui de
    // l'équipe où il a vraiment joué ce jour-là (ex : un match 7-10 affichait 12-5 au lieu de 7-10, un but
    // marqué contre nous comptant quand même pour notre propre total).
    this.state.matches.forEach(m=>{
      if(!m.played) return;
      const matchRoster = key==='B' ? (m.teamB||[]) : (m.teamA||[]);
      if(!matchRoster.length) return;
      const inRoster = new Set(matchRoster);
      const sumArr = (arr)=> (arr||[]).reduce((t,s)=> t + (inRoster.has(s.name) ? (s.count||0) : 0), 0);
      goals += sumArr(m.scorers) + sumArr(m.freekickScored) + sumArr(m.cornersScored) + sumArr(m.penaltiesScored);
      assists += sumArr(m.assists);
      yellow += sumArr(m.cardsYellow);
      red += sumArr(m.cardsRed);
      cornersScored += sumArr(m.cornersScored);
      cornersTaken += sumArr(m.cornersTaken);
      freekickScored += sumArr(m.freekickScored);
      freekickTaken += sumArr(m.freekickTaken);
      penaltiesScored += sumArr(m.penaltiesScored);
      penaltiesMissed += sumArr(m.penaltiesMissed);
      penaltiesCaused += sumArr(m.penaltiesCaused);
      shotsOnTarget += sumArr(m.shotsOnTarget);
      tacklesWon += sumArr(m.tacklesWon);
      saves += sumArr(m.saves);
      penaltiesSaved += sumArr(m.penaltiesSaved);
      penaltiesConceded += sumArr(m.penaltiesConceded);
      minutesPlayed += sumArr(m.minutesPlayed);
      if(m.ratings){
        matchRoster.forEach(n=>{
          const r = m.ratings[n];
          if(r){ const vals = Object.values(r); if(vals.length){ ratingSum += avg(vals); ratingCount++; } }
        });
      }
      const mvpInfo = this.matchMVP(m);
      if(mvpInfo && inRoster.has(mvpInfo.name)) mvp++;
    });
    const avgRating = ratingCount? ratingSum/ratingCount : 0;
    return {count:players.length, goals, assists, yellow, red, cornersScored, cornersTaken, freekickScored, freekickTaken, penaltiesScored, penaltiesMissed, penaltiesCaused, shotsOnTarget, tacklesWon, saves, penaltiesSaved, penaltiesConceded, minutesPlayed, avgRating, mvp, matchesPlayed, W, D, L};
  },
  teamWinStrength(s){
    // Petit indice "forme" maison — pas une vraie stat pro, juste pour comparer les deux équipes du club.
    const winRate = (s.W+s.D+s.L)>0 ? s.W/(s.W+s.D+s.L) : 0;
    const goalsPerMatch = s.matchesPlayed>0 ? s.goals/s.matchesPlayed : 0;
    return Math.max(0.1, winRate*60 + goalsPerMatch*15 + (s.avgRating||0)*4 - (s.yellow+s.red*2)*0.5);
  },

  // dans globalRankings() : avant ce correctif ces totaux ne portaient jamais que sur l'équipe A.
  computeClubTotals(teamKey){
    const key = teamKey || this.currentStatsTeam();
    let goals=0, assists=0, yellow=0, red=0, cornersScored=0, cornersTaken=0, freekickScored=0, freekickTaken=0, penaltiesScored=0, penaltiesMissed=0, penaltiesCaused=0,
        shotsOnTarget=0, tacklesWon=0, saves=0, penaltiesSaved=0, penaltiesConceded=0;
    this.state.players.filter(p=> key==='B' ? p.team==='B' : p.team!=='B').forEach(p=>{
      const s = this.computePlayerStats(p.name);
      goals+=s.goals; assists+=s.assists; yellow+=s.yellow; red+=s.red;
      cornersScored+=s.cornersScored; cornersTaken+=s.cornersTaken; freekickScored+=s.freekickScored; freekickTaken+=s.freekickTaken;
      penaltiesScored+=s.penaltiesScored; penaltiesMissed+=s.penaltiesMissed; penaltiesCaused+=s.penaltiesCaused;
      shotsOnTarget+=s.shotsOnTarget; tacklesWon+=s.tacklesWon; saves+=s.saves; penaltiesSaved+=s.penaltiesSaved; penaltiesConceded+=s.penaltiesConceded;
    });
    return {goals, assists, yellow, red, cornersScored, cornersTaken, freekickScored, freekickTaken, penaltiesScored, penaltiesMissed, penaltiesCaused, shotsOnTarget, tacklesWon, saves, penaltiesSaved, penaltiesConceded};
  },
  /* ---------- Tableau de bord équipe (série en cours + compte à rebours du prochain match) ---------- */
  // Série actuelle du club : on part du match le plus récent et on remonte tant que le résultat est le
  // même (victoire, nul ou défaite). Ça donne un vrai "3 victoires d'affilée" ou "2 défaites d'affilée"
  // plutôt qu'un simple total sur la saison.
  // `teamKey` ('A' ou 'B') dit de quelle équipe on regarde la série — par défaut celle actuellement
  // affichée dans l'onglet Stats (currentStatsTeam()). m.score.us/them est toujours du point de vue de
  // l'équipe A : pour l'équipe B il faut inverser, sinon FC Nulos hérite de la série de Mot'eau.
  computeCurrentStreak(teamKey){
    const key = teamKey || this.currentStatsTeam();
    const past = this.pastMatches(); // le plus récent en premier
    if(!past.length) return {type:null, count:0};
    const resultOf = m => {
      if(!m.score) return null;
      const forTeam = key==='B' ? (m.score.them||0) : (m.score.us||0);
      const against = key==='B' ? (m.score.us||0) : (m.score.them||0);
      if(forTeam>against) return 'victoire';
      if(forTeam===against) return 'nul';
      return 'défaite';
    };
    const firstResult = resultOf(past[0]);
    if(!firstResult) return {type:null, count:0};
    let count = 0;
    for(const m of past){
      if(resultOf(m)===firstResult) count++; else break;
    }
    return {type:firstResult, count};
  },
  // Texte du compte à rebours avant le prochain match : "Aujourd'hui !", "Demain !", "Dans X jours"...
  formatCountdown(nm){
    if(!nm || !nm.date) return null;
    const target = new Date(nm.date+"T"+(nm.time||"00:00")+":00");
    if(isNaN(target)) return null;
    const now = new Date();
    const oneDay = 24*3600*1000;
    const dKey = new Date(target.getFullYear(),target.getMonth(),target.getDate()).getTime();
    const nKey = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
    const diffDays = Math.round((dKey-nKey)/oneDay);
    if(diffDays<0) return "Match passé";
    if(diffDays===0) return nm.time ? `Aujourd'hui à ${esc(nm.time)} !` : "Aujourd'hui !";
    if(diffDays===1) return "Demain !";
    return `Dans ${diffDays} jours`;
  },
  renderTeamDashboard(){
    const tn = this.teamNames();
    const key = this.currentStatsTeam();
    const rk = this.globalRankings(key);
    const streak = this.computeCurrentStreak(key);
    const nm = this.nextMatch();
    const countdown = this.formatCountdown(nm);
    const streakLabel = streak.count>=2
      ? (streak.type==='victoire' ? `🔥 ${streak.count} victoires d'affilée`
        : streak.type==='défaite' ? `😬 ${streak.count} défaites d'affilée`
        : `🤝 ${streak.count} nuls d'affilée`)
      : (streak.type ? `Dernier match : ${streak.type}` : "Pas encore de match joué");
    const topScorer = rk.byGoals[0];
    const topPasser = rk.byAssists[0];
    return `
    <div class="card" style="background:linear-gradient(135deg,var(--surface-2),var(--surface));">
      <div class="section-title">
        <h2 style="margin:0;">📊 Tableau de bord — ${this.teamLogoTag(key,16)} ${esc(key==='A'?tn.a:tn.b)}</h2>
      </div>
      <div class="wrap" style="margin-bottom:8px;">
        <span class="chip ${key==='A'?'active':''}" onclick="App.setStatsTeamView('A')">${this.teamLogoTag('A',13)} ${esc(tn.a)}</span>
        <span class="chip ${key==='B'?'active':''}" onclick="App.setStatsTeamView('B')">${this.teamLogoTag('B',13)} ${esc(tn.b)}</span>
      </div>
      <div class="grid2" style="margin-bottom:10px;">
        <div class="card tight" style="margin:0;text-align:center;">
          <div class="fut-rating" style="font-size:22px;color:var(--accent2);">${rk.W}-${rk.N}-${rk.D}</div>
          <div class="muted" style="font-size:11px;">V-N-D (${rk.played} match${rk.played>1?'s':''})</div>
        </div>
        <div class="card tight" style="margin:0;text-align:center;">
          <div class="fut-rating" style="font-size:22px;color:var(--gold);">${rk.gf}-${rk.ga}</div>
          <div class="muted" style="font-size:11px;">Buts marqués-encaissés</div>
        </div>
      </div>
      <div class="kv" style="border:none;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-bottom:6px;">
        <span>📈 Série en cours</span><b>${streakLabel}</b>
      </div>
      <div class="kv" style="border:none;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-bottom:6px;">
        <span>⏳ Prochain match</span>
        <b style="text-align:right;">${nm ? `${countdown}${nm.opponent?' vs '+esc(nm.opponent):''}` : "Aucun match prévu"}</b>
      </div>
      ${topScorer||topPasser ? `<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:4px;">
        ${topScorer && topScorer.goals>0 ? `<span class="trophy-chip">⚽ ${esc(topScorer.name)} (${topScorer.goals})</span>`:""}
        ${topPasser && topPasser.assists>0 ? `<span class="trophy-chip">🎯 ${esc(topPasser.name)} (${topPasser.assists})</span>`:""}
      </div>` : ""}
    </div>`;
  },
  /* ---------- Comparateur de joueurs ---------- */
  setCompareA(name){ this.state.compareA = name||null; this.render(); },
  setCompareB(name){ this.state.compareB = name||null; this.render(); },
  renderPlayerComparator(){
    const players = this.state.players;
    if(players.length<2) return "";
    const nameA = this.state.compareA || players[0].name;
    const nameB = this.state.compareB || (players[1] ? players[1].name : players[0].name);
    const pA = players.find(p=>p.name===nameA);
    const pB = players.find(p=>p.name===nameB);
    const options = sel => players.map(p=>`<option value="${esc(p.name)}" ${p.name===sel?'selected':''}>${esc(p.name)}</option>`).join("");
    if(!pA || !pB) return "";
    const sA = this.computePlayerStats(pA.name), sB = this.computePlayerStats(pB.name);
    const ratingA = this.cardRating(sA), ratingB = this.cardRating(sB);
    // Si les deux joueurs comparés sont gardiens, on remplace les stats de joueur de champ (buts, passes,
    // tacles...) qui n'ont pas de sens pour eux par leurs stats spécifiques de gardien (arrêts, penaltys
    // arrêtés/pris, taux d'arrêt, buts encaissés) — sinon la comparaison "n'est pas vraiment bien comprise".
    const bothGK = pA.position==='Gardien' && pB.position==='Gardien';
    const rows = bothGK ? [
      {label:"⭐ Général", a:ratingA, b:ratingB, fmt:v=>v.toFixed(1)},
      {label:"🧤 Arrêts", a:sA.saves, b:sB.saves},
      {label:"🧤 Penaltys attrapés", a:sA.penaltiesSaved, b:sB.penaltiesSaved},
      {label:"🥅 Penaltys pris", a:sA.penaltiesConceded, b:sB.penaltiesConceded},
      {label:"🎯 Taux d'arrêt penalty", a:(sA.penaltiesSaved+sA.penaltiesConceded)>0?sA.penaltiesSaved/(sA.penaltiesSaved+sA.penaltiesConceded):-1, b:(sB.penaltiesSaved+sB.penaltiesConceded)>0?sB.penaltiesSaved/(sB.penaltiesSaved+sB.penaltiesConceded):-1, fmt:v=>v<0?'–':Math.round(v*100)+'%'},
      {label:"Buts encaissés", a:sA.goalsConceded, b:sB.goalsConceded, lowerIsBetter:true},
      {label:"Note moyenne", a:sA.avgRating, b:sB.avgRating, fmt:v=>v?v.toFixed(1):"–"},
      {label:"Matchs joués", a:sA.matchesPlayed, b:sB.matchesPlayed},
      {label:"🏆 MVP", a:sA.mvp, b:sB.mvp},
    ] : [
      {label:"⭐ Général", a:ratingA, b:ratingB, fmt:v=>v.toFixed(1)},
      {label:"⚽ Buts", a:sA.goals, b:sB.goals},
      {label:"🎯 Passes décisives", a:sA.assists, b:sB.assists},
      {label:"Note moyenne", a:sA.avgRating, b:sB.avgRating, fmt:v=>v?v.toFixed(1):"–"},
      {label:"🛡️ Tacles réussis", a:sA.tacklesWon, b:sB.tacklesWon},
      {label:"Tirs cadrés", a:sA.shotsOnTarget, b:sB.shotsOnTarget},
      {label:"Matchs joués", a:sA.matchesPlayed, b:sB.matchesPlayed},
      {label:"🏆 MVP", a:sA.mvp, b:sB.mvp},
    ];
    const cell = (v, isBest, fmt) => `<span style="${isBest?'color:var(--accent2);font-weight:700;':''}">${fmt?fmt(v):v}</span>`;
    return `
    <div class="card">
      <h2>⚖️ Comparateur de joueurs</h2>
      <div class="grid2" style="margin-bottom:10px;">
        <select onchange="App.setCompareA(this.value)" style="width:100%;">${options(nameA)}</select>
        <select onchange="App.setCompareB(this.value)" style="width:100%;">${options(nameB)}</select>
      </div>
      <div class="grid2" style="margin-bottom:8px;text-align:center;">
        <div>${pA.photo?`<img class="avatar" src="${pA.photo}">`:`<div class="avatar">${initials(pA.name)}</div>`}<div style="font-weight:600;font-size:13px;margin-top:4px;">${esc(pA.name)}</div></div>
        <div>${pB.photo?`<img class="avatar" src="${pB.photo}">`:`<div class="avatar">${initials(pB.name)}</div>`}<div style="font-weight:600;font-size:13px;margin-top:4px;">${esc(pB.name)}</div></div>
      </div>
      ${rows.map(r=>{
        const bestA = r.lowerIsBetter ? r.a<r.b : r.a>r.b, bestB = r.lowerIsBetter ? r.b<r.a : r.b>r.a;
        return `<div class="kv"><span style="flex:1;text-align:left;">${cell(r.a,bestA,r.fmt)}</span><span class="muted" style="flex:1.4;text-align:center;font-size:11.5px;">${r.label}</span><span style="flex:1;text-align:right;">${cell(r.b,bestB,r.fmt)}</span></div>`;
      }).join("")}
    </div>`;
  },
  /* ---------- Courbe de progression du général (même principe que l'évolution de la valeur marchande) ---------- */
  playerRatingHistory(name){
    const played = this.state.matches.filter(m=>m.played).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const ids = [];
    return played.map(m=>{
      ids.push(m.id);
      const stats = this.computePlayerStats(name, {includeIds:[...ids]});
      const rating = this.cardRating(stats);
      return {date:m.date, opponent:m.opponent, value:rating};
    });
  },
  toggleRatingChart(name){
    this.state.expandedRatingChart = this.state.expandedRatingChart || {};
    this.state.expandedRatingChart[name] = !this.state.expandedRatingChart[name];
    this.render();
  },
  renderRatingHistoryChart(name){
    const points = this.playerRatingHistory(name);
    if(points.length<2) return `<p class="muted" style="font-size:11.5px;">Pas encore assez de matchs joués pour tracer une évolution.</p>`;
    const values = points.map(p=>p.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max-min) || 1;
    const W=100, H=40;
    const stepX = points.length>1 ? W/(points.length-1) : 0;
    const coords = points.map((p,i)=>({x:i*stepX, y:H-((p.value-min)/range)*H, ...p}));
    const path = coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
    const last = coords[coords.length-1];
    return `
    <div style="margin-top:6px;">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:70px;background:var(--surface-2);border-radius:8px;">
        <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
        <circle cx="${last.x}" cy="${last.y}" r="1.6" fill="var(--gold)"></circle>
      </svg>
      <div class="row" style="justify-content:space-between;">
        <span class="muted" style="font-size:10px;">${fmtDate(points[0].date)} · ${points[0].value.toFixed(1)}</span>
        <span class="muted" style="font-size:10px;">${fmtDate(points[points.length-1].date)} · ${points[points.length-1].value.toFixed(1)}</span>
      </div>
    </div>`;
  },
  /* ---------- Badges & records ---------- */
  // Contribution d'UN SEUL match pour un joueur (pas cumulé, contrairement à computePlayerStats) — sert de
  // brique de base pour calculer des séries "d'affilée" (ex : buts marqués sur plusieurs matchs consécutifs).
  matchContribution(name, m){
    const player = this.state.players.find(p=>p.name===name);
    const countIn = (arr) => (arr||[]).reduce((s,x)=> x && x.name===name ? s+(x.count||0) : s, 0);
    const freekick = countIn(m.freekickScored);
    const goals = countIn(m.scorers) + freekick + countIn(m.cornersScored) + countIn(m.penaltiesScored);
    const assists = countIn(m.assists);
    const yellow = countIn(m.cardsYellow);
    const red = countIn(m.cardsRed);
    const tacklesWon = countIn(m.tacklesWon);
    const r = m.ratings && m.ratings[name];
    const ratingVals = r ? Object.values(r) : [];
    const rating = ratingVals.length ? avg(ratingVals) : null;
    const mvpInfo = this.matchMVP(m);
    const isMVP = !!(mvpInfo && mvpInfo.name===name);
    const wasGK = [m.tactic, m.tacticA, m.tacticB].some(t=>t && t.assignments && t.assignments.GK===name);
    // Même principe que dans computePlayerStats : le côté où le joueur a joué CE match précis (pas sa
    // fiche permanente, qui peut avoir changé depuis via un transfert).
    const sideInMatch = (m.teamA||[]).includes(name) ? 'A' : ((m.teamB||[]).includes(name) ? 'B' : (player && player.team));
    const concededAsGK = wasGK && m.score ? ((sideInMatch==='B') ? (m.score.us||0) : (m.score.them||0)) : null;
    const wasInvolved = (m.convoked||[]).length ? (m.convoked||[]).includes(name) : ((m.teamA||[]).includes(name) || (m.teamB||[]).includes(name));
    return {goals, freekick, assists, yellow, red, tacklesWon, rating, isMVP, wasGK, concededAsGK, wasInvolved};
  },
  // Plus longue série de matchs JOUÉS consécutifs (les matchs où le joueur n'était pas convoqué sont
  // simplement ignorés — ils ne cassent pas la série, sinon une simple absence ferait perdre une série de
  // plusieurs semaines sans lien avec la performance) où `predicate` est vrai.
  longestStreak(name, predicate){
    const played = this.state.matches.filter(m=>m.played).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    let best=0, cur=0;
    played.forEach(m=>{
      const c = this.matchContribution(name, m);
      if(!c.wasInvolved) return;
      if(predicate(c)){ cur++; best=Math.max(best,cur); } else { cur=0; }
    });
    return best;
  },
  computeBadges(name){
    const player = this.state.players.find(p=>p.name===name);
    if(!player) return [];
    const stats = this.computePlayerStats(name);
    const played = this.state.matches.filter(m=>m.played).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const badges = [];
    // Triplé (ou plus) sur un seul match
    const hatTrick = played.some(m=>this.matchContribution(name,m).goals>=3);
    if(hatTrick) badges.push({icon:'🎩', label:'Triplé', desc:'Au moins 3 buts marqués dans un même match.'});
    // Série de buts sur plusieurs matchs d'affilée
    const goalStreak = this.longestStreak(name, c=>c.goals>=1);
    if(goalStreak>=2) badges.push({icon:'🔥', label:`Série de buts ×${goalStreak}`, desc:`A marqué au moins un but sur ${goalStreak} matchs joués d'affilée.`});
    // Série de coups francs marqués d'affilée
    const freekickStreak = this.longestStreak(name, c=>c.freekick>=1);
    if(freekickStreak>=2) badges.push({icon:'🦵', label:`Série de coups francs ×${freekickStreak}`, desc:`A marqué au moins un coup franc sur ${freekickStreak} matchs joués d'affilée.`});
    // Série de passes décisives d'affilée
    const assistStreak = this.longestStreak(name, c=>c.assists>=1);
    if(assistStreak>=2) badges.push({icon:'🎯', label:`Série de passes ×${assistStreak}`, desc:`Au moins une passe décisive sur ${assistStreak} matchs joués d'affilée.`});
    // Série de MVP d'affilée
    const mvpStreak = this.longestStreak(name, c=>c.isMVP);
    if(mvpStreak>=2) badges.push({icon:'🏅', label:`MVP ×${mvpStreak} d'affilée`, desc:`Meilleure note de l'équipe sur ${mvpStreak} matchs joués d'affilée.`});
    // Grosse performance : une note individuelle >= 9/10 sur un match
    const bigPerf = played.some(m=>{ const c=this.matchContribution(name,m); return c.rating!=null && c.rating>=9; });
    if(bigPerf) badges.push({icon:'⭐', label:'Performance 9+', desc:'Note moyenne d\'au moins 9/10 sur un match.'});
    // Séries de "clean sheets" pour les gardiens
    if(player.position==='Gardien'){
      const cleanSheetStreak = this.longestStreak(name, c=>c.wasGK && c.concededAsGK===0);
      if(cleanSheetStreak>=2) badges.push({icon:'🧤', label:`Cage inviolée ×${cleanSheetStreak}`, desc:`Aucun but encaissé sur ${cleanSheetStreak} matchs gardés d'affilée.`});
    }
    // Fair-play : au moins 5 matchs joués, aucun carton
    if(stats.matchesPlayed>=5 && (stats.yellow||0)===0 && (stats.red||0)===0){
      badges.push({icon:'🕊️', label:'Fair-play', desc:`Aucun carton en ${stats.matchesPlayed} matchs joués.`});
    }
    // Paliers de buts en carrière (le plus haut palier atteint)
    const goalMilestones = [20,10,5];
    const goalMilestone = goalMilestones.find(n=>stats.goals>=n);
    if(goalMilestone) badges.push({icon:'💯', label:`${goalMilestone} buts en carrière`, desc:`A dépassé les ${goalMilestone} buts marqués au total.`});
    // Muraille défensive : beaucoup de tacles réussis au total
    if((stats.tacklesWon||0)>=20) badges.push({icon:'🧱', label:'Muraille', desc:`Au moins 20 tacles réussis au total (${stats.tacklesWon}).`});
    // Grimpeur : le général a nettement progressé sur les 3 derniers matchs
    const lastThree = played.slice(-3);
    if(lastThree.length===3){
      const idsBefore = played.slice(0,-3).map(m=>m.id);
      const before = idsBefore.length ? this.cardRating(this.computePlayerStats(name, {includeIds:idsBefore})) : null;
      const now = this.cardRating(stats);
      if(before!=null && now-before>=8) badges.push({icon:'📈', label:'En pleine progression', desc:`Général en hausse de +${(now-before).toFixed(1)} sur les 3 derniers matchs.`});
    }
    return badges;
  },
  renderTeamStats(){
    const tn = this.teamNames();
    const key = this.currentStatsTeam();
    const rk = this.globalRankings(key);
    const ct = this.computeClubTotals(key);
    const medal = i => ['🥇','🥈','🥉'][i] || (i+1)+".";
    const table = (rows, valueKey, label, fmt) => rows.length===0 ? `<p class="muted" style="font-size:12.5px;">Pas encore de données.</p>` : `
      <table class="stats"><thead><tr><th></th><th>Joueur</th><th style="text-align:right;">${label}</th></tr></thead>
      <tbody>${rows.slice(0,10).map((p,i)=>`<tr><td class="rank-medal">${medal(i)}</td><td>${esc(p.name)}</td><td class="num">${fmt?fmt(p[valueKey]):p[valueKey]}</td></tr>`).join("")}</tbody></table>`;
    return `
    <div class="card">
      <h2>📈 Stats de l'équipe — ${this.teamLogoTag(key,16)} ${esc(key==='A'?tn.a:tn.b)}</h2>
      <div class="wrap" style="margin-bottom:8px;">
        <span class="chip ${key==='A'?'active':''}" onclick="App.setStatsTeamView('A')">${this.teamLogoTag('A',13)} ${esc(tn.a)}</span>
        <span class="chip ${key==='B'?'active':''}" onclick="App.setStatsTeamView('B')">${this.teamLogoTag('B',13)} ${esc(tn.b)}</span>
      </div>
      <div class="grid2" style="margin-bottom:14px;">
        <div class="card tight" style="margin:0;text-align:center;"><div class="fut-rating" style="font-size:26px;color:var(--accent2);">${rk.W}</div><div class="muted" style="font-size:11px;">Victoires</div></div>
        <div class="card tight" style="margin:0;text-align:center;"><div class="fut-rating" style="font-size:26px;color:var(--gold);">${rk.N}</div><div class="muted" style="font-size:11px;">Nuls</div></div>
      </div>
      <div class="kv"><span>Défaites</span><b>${rk.D}</b></div>
      <div class="kv"><span>Matchs joués</span><b>${rk.played}</b></div>
      <div class="kv"><span>Buts marqués / encaissés</span><b>${rk.gf} / ${rk.ga}</b></div>
      <div class="kv"><span>⚽ Buts marqués / match (moy.)</span><b>${perMatchStr(rk.gf, rk.played)}</b></div>
      <div class="kv"><span>🥅 Buts encaissés / match (moy.)</span><b>${perMatchStr(rk.ga, rk.played)}</b></div>

  /* ============================= TAB 5 : Matchs & Convocations ============================= */
  nextMatch(){
    const upcoming = this.state.matches.filter(m=>!m.played).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    return upcoming[0] || null;
  },
  pastMatches(){
    return this.state.matches.filter(m=>m.played).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  },
  renderMatchesTab(){
    const nm = this.nextMatch();
    const past = this.pastMatches();
    return `
      ${this.renderNextMatchCard(nm)}
      ${this.renderOtherUpcomingMatches()}

      ${nm ? this.renderTeamCompare(nm) : ""}
      ${nm ? this.renderTacticSection(nm) : ""}
      ${this.renderResultsSection()}
      ${this.renderHistory(past)}
      ${this.renderPaymentSummarySection()}
    `;

  // Le tout prochain match a déjà sa grande carte de présence ci-dessus (renderNextMatchCard).
  // Mais si le capitaine programme plusieurs matchs à l'avance, les suivants doivent AUSSI avoir
  // leur propre zone où chacun peut cocher présent/en retard/pas sûr/absent, indépendamment du
  // prochain match — sinon ces matchs-là restent invisibles pour répondre. C'est ce que fait cette
  // section : une petite carte par match "à venir" (hors le tout prochain), chacune avec sa propre
  // liste de présence.
  renderOtherUpcomingMatches(){
    const upcoming = this.state.matches.filter(m=>!m.played).sort((a,b)=>(a.date||"").localeCompare(b.date||""));

      <h2>📅 Autres matchs à venir</h2>
      <p class="muted" style="font-size:12px;margin-top:-6px;">Indique ta présence pour chaque match programmé, pas seulement le tout prochain — ✅ présent(e), ⏰ en retard, 🤷 tu ne sais pas encore, ❌ absent(e).</p>

    </div>`;

  renderUpcomingMatchPresence(m){

        const note = presenceNote(entry);
        return `<div class="presence-row">

  },

      ${!nm ? `<div class="empty"><span class="e-ic">🗓️</span>Aucun match programmé.${this.admin? "" : " Demande à ton capitaine d'en créer un."}</div>` : `

          const entry = (nm.presence||{})[p.name];
          const st = presenceStatus(entry);
          const note = presenceNote(entry);
          return `<div class="presence-row">
            <span class="nm">${esc(p.name)}</span>
            ${this.renderPresenceButtons('setPresence', nm.id, p.name, st)}
            <button class="pbtn ${note?'has-note':''}" onclick="App.openPresenceNote('match','${nm.id}','${jsa(p.name)}')" title="Ajouter une note">🗨️</button>
          </div>
          ${note ? `<p class="presence-note-preview">🗨️ ${esc(p.name)} : « ${esc(note)} »</p>` : ""}`;
        }).join("")}
        ${this.admin ? `<button class="btn btn-outline btn-block" style="margin-top:12px;" onclick="App.openMatchResult('${nm.id}')">📝 Saisir le résultat</button>` : ""}
      `}

  },
  // Petit résumé "qui vient / qui ne vient pas / qui ne sait pas / qui n'a pas répondu", pour que le
  // capitaine puisse voir d'un coup d'œil où en sont les présences sans avoir à parcourir toute la liste.
  renderPresenceSummary(presenceMap, players){
    const counts = {present:0, late:0, unsure:0, absent:0};
    (players||[]).forEach(p=>{ const st = presenceStatus((presenceMap||{})[p.name]); if(st && counts[st]!==undefined) counts[st]++; });
    const noResponse = Math.max(0, (players||[]).length - counts.present - counts.late - counts.unsure - counts.absent);
    return `<div class="kv" style="border:none;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-bottom:6px;">
      <span>Réponses</span><b>✅ ${counts.present} · ⏰ ${counts.late} · 🤷 ${counts.unsure} · ❌ ${counts.absent} · ❔ ${noResponse}</b>
    </div>`;
  },
  // Modale pour ajouter/modifier la petite note (optionnelle) attachée à une réponse de présence — visible
  // par toute l'équipe ("wasGK" etc. laissé de côté ici : ce n'est qu'un mot laissé libre par le joueur, ex.
  // "je serai en retard de 10 min" ou "absent, je suis malade"). "kind" vaut 'match' ou 'event'.
  openPresenceNote(kind, id, name){
    const list = kind==='event' ? this.state.events : this.state.matches;
    const item = list.find(x=>x.id===id);
    const responseMap = kind==='event' ? (item&&item.responses) : (item&&item.presence);
    const note = presenceNote((responseMap||{})[name]);
    this.modal(`
      <h3>🗨️ Petite note — ${esc(name)}</h3>
      <p class="muted" style="font-size:12px;margin-top:-6px;">Visible par toute l'équipe. Ex : « en retard de 10 min », « absent, je suis malade »…</p>
      <label class="field"><textarea id="presenceNoteInput" rows="3" placeholder="Optionnel">${esc(note)}</textarea></label>
      <button class="btn btn-accent btn-block" onclick="App.savePresenceNote('${kind}','${id}','${jsa(name)}')">Enregistrer</button>
    `);
  },
  async savePresenceNote(kind, id, name){
    const val = document.getElementById("presenceNoteInput").value.trim();
    const field = kind==='event' ? 'responses' : 'presence';
    const coll = kind==='event' ? 'events' : 'matches';
    const list = kind==='event' ? this.state.events : this.state.matches;
    const item = list.find(x=>x.id===id);
    // Les anciennes réponses (avant cette fonctionnalité) sont stockées comme une simple chaîne
    // ("present"/"late"/"absent"), sans place pour une note. Pour ne pas perdre ce statut au premier
    // ajout d'une note sur une telle réponse, on le réécrit explicitement en même temps que la note —
    // sinon la valeur (simple chaîne) serait remplacée par un objet ne contenant que la note.
    const currentStatus = presenceStatus((item && item[field] && item[field][name]) || null);
    const patch = {note: val};
    if(currentStatus) patch.status = currentStatus;
    await this.db.collection(coll).doc(id).update({[field]:{[name]:patch}});
    this.closeModal();
    toast("Note enregistrée");
  },
  renderPaymentSection(m){
    const pay = m.payment || {enabled:false, amount:0, paid:{}};
    const roster = uniq([...(m.convoked||[]), ...Object.keys(pay.paid||{})]);
    const paidCount = roster.filter(n=>pay.paid && pay.paid[n]).length;
    const total = roster.length;
    const expected = total * (pay.amount||0);
    const received = paidCount * (pay.amount||0);
    return `
    <div class="card tight" style="margin:10px 0;background:var(--surface-2);">
      <h3 style="font-size:14px;margin-top:0;">💰 Paiement — ${(pay.amount||0)}€ / joueur</h3>
      ${roster.length===0 ? `<p class="muted" style="font-size:12.5px;">Convoque des joueurs pour suivre les paiements.</p>` : `
        <div class="kv"><span>Reçu / attendu</span><b>${received.toFixed(2)}€ / ${expected.toFixed(2)}€</b></div>
        <div class="kv"><span>Ont payé</span><b>${paidCount} / ${total}</b></div>
        <hr class="sep" style="margin:8px 0;">
        ${roster.map(n=>{
          const isPaid = pay.paid && pay.paid[n];
          return `<div class="presence-row">
            <span class="nm">${esc(n)}</span>
            <button class="pbtn ${isPaid?'on-present':''}" ${this.admin?`onclick="App.togglePlayerPaid('${m.id}','${jsa(n)}')"`:'disabled'}>${isPaid?'✅ Payé':'❌ Pas payé'}</button>
          </div>`;
        }).join("")}
        ${!this.admin? `<p class="muted" style="font-size:11px;margin-top:6px;">Seul le capitaine peut valider un paiement.</p>`:""}
      `}
    </div>`;
  },
  async togglePlayerPaid(matchId, name){
    if(!this.admin){ toast("Réservé aux capitaines"); return; }
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const already = m.payment && m.payment.paid && m.payment.paid[name];
    await this.db.collection("matches").doc(matchId).update({payment:{paid:{[name]: !already}}});
  },
  computePaymentSummary(){
    const byPlayer = {};
    let totalExpected=0, totalReceived=0;
    this.state.matches.forEach(m=>{
      const pay = m.payment;
      if(!pay || !pay.enabled) return;
      const roster = uniq([...(m.convoked||[]), ...Object.keys(pay.paid||{})]);
      roster.forEach(n=>{
        if(!byPlayer[n]) byPlayer[n] = {owed:0, paidCount:0, unpaidCount:0};
        const isPaid = pay.paid && pay.paid[n];
        totalExpected += pay.amount||0;
        if(isPaid){ byPlayer[n].paidCount++; totalReceived += pay.amount||0; }
        else { byPlayer[n].unpaidCount++; byPlayer[n].owed += pay.amount||0; }
      });
    });
    const unpaidList = Object.entries(byPlayer).filter(([n,v])=>v.owed>0).map(([name,v])=>({name, ...v})).sort((a,b)=>b.owed-a.owed);
    return {byPlayer, unpaidList, totalExpected, totalReceived};
  },
  renderPaymentSummarySection(){
    if(!this.admin) return "";
    const sum = this.computePaymentSummary();
    if(sum.totalExpected===0) return "";
    return `
    <div class="card">
      <h2>💰 Bilan des paiements</h2>
      <div class="kv"><span>Reçu / attendu (saison)</span><b>${sum.totalReceived.toFixed(2)}€ / ${sum.totalExpected.toFixed(2)}€</b></div>
      ${sum.unpaidList.length===0 ? `<p class="muted" style="font-size:12.5px;">Tout le monde est à jour ! 🎉</p>` : `
        <hr class="sep">
        <h3 style="font-size:14px;">💸 À relancer</h3>
        ${sum.unpaidList.map(u=>`<div class="kv"><span>${esc(u.name)}</span><b>${u.owed.toFixed(2)}€ (${u.unpaidCount} match${u.unpaidCount>1?'s':''})</b></div>`).join("")}
      `}
    </div>`;
  },

  async setPresence(matchId, name, status){
    this.ensureMe(async ()=>{
      const ref = this.db.collection("matches").doc(matchId);
      // Écrit uniquement la feuille "status" (jamais l'objet entier) pour ne pas effacer une éventuelle
      // note déjà enregistrée pour ce joueur sur ce match (voir flattenForUpdate plus haut dans le fichier).
      await ref.update({presence:{[name]:{status}}});
    });
  },
  teamNames(){
    const info = this.state.info || this.defaultInfo();
    return {a: info.teamAName||"Équipe A", b: info.teamBName||"Équipe B"};
  },
  // Nom du compte "média" utilisé pour les publications automatiques (résumé de match, nouvelle recrue)
  // et proposé comme identité de publication dans les Actus — façon compte de transferts/actu foot.
  mediaName(){
    const info = this.state.info || this.defaultInfo();
    return info.mediaName || "Vestiaire Direct";
  },
  myTeamKey(){
    if(!this.me) return null;
    const acc = this.state.accounts.find(a=>a.username===this.me);
    if(acc && (acc.team==='A' || acc.team==='B')) return acc.team;
    const p = this.state.players.find(p=>p.name===this.me);
    return (p && p.team) ? p.team : null;
  },
  // Nom du joueur "revendiqué" (claimPlayer) par le compte connecté, s'il y en a un — sinon le pseudo du
  // compte lui-même, au cas où il correspond directement à un nom de joueur (anciens comptes créés avant
  // l'ajout de la revendication).
  myLinkedPlayerName(){
    if(!this.me) return null;
    const acc = this.state.accounts.find(a=>a.username===this.me);
    return (acc && acc.linkedPlayer) || null;
  },
  // Un capitaine (mode admin) peut toujours cocher la présence de n'importe qui, pour organiser l'équipe.
  // Un compte normal ne peut cocher QUE sa propre présence (celle du joueur qu'il a revendiqué, ou dont le
  // pseudo correspond) — pas celle des autres, pour éviter qu'un joueur ne coche par erreur (ou exprès) la
  // présence de quelqu'un d'autre.
  canSetPresenceFor(playerName){
    if(this.admin) return true;
    const linkedName = this.myLinkedPlayerName() || this.me;
    return !!linkedName && linkedName === playerName;
  },
  // Rendu commun des 4 boutons de statut de présence (✅⏰🤷❌), utilisé pour un match ou un événement. Pour
  // quelqu'un qui n'a pas le droit de modifier CETTE ligne (cf. canSetPresenceFor), les boutons restent
  // visibles (on voit toujours le statut actuel) mais sont désactivés, grisés, et sans clic.
  renderPresenceButtons(setterFn, id, playerName, status){
    const editable = this.canSetPresenceFor(playerName);
    const btn = (val, onClass, title, icon)=> editable
      ? `<button class="pbtn ${status===val?onClass:''}" onclick="App.${setterFn}('${id}','${jsa(playerName)}','${val}')" title="${title}">${icon}</button>`
      : `<button class="pbtn ${status===val?onClass:''}" disabled title="Seul(e) ${esc(playerName)} (ou un capitaine) peut modifier ça" style="opacity:.4;cursor:default;">${icon}</button>`;
    return btn('present','on-present','Présent(e)','✅')
      + btn('late','on-late','En retard','⏰')
      + btn('unsure','on-unsure','Je ne sais pas encore','🤷')
      + btn('absent','on-absent','Absent(e)','❌');
  },
  // Équipe actuellement affichée dans le Tableau de bord / les Classements / les Stats de l'équipe (onglet
  // Stats) : celle choisie explicitement via les puces 🟠/🟢, sinon celle du compte connecté (myTeamKey()),
  // sinon l'équipe A par défaut. Avant l'ajout de ce sélecteur, ces sections ne montraient TOUJOURS que
  // l'équipe A (Mot'eau) — un supporter de FC Nulos y voyait le bilan et les classements de l'autre équipe.
  currentStatsTeam(){
    const t = this.state.statsTeamView;
    return (t==='A' || t==='B') ? t : (this.myTeamKey() || 'A');
  },
  setStatsTeamView(key){ this.state.statsTeamView = key; this.render(); },
  // Sélecteur d'équipe séparé, utilisé UNIQUEMENT par les Classements (renderClassementsSection), pour
  // pouvoir proposer un 3e choix "Tout le monde mélangé" (les deux équipes ensemble) sans que ce choix ne
  // "fuite" vers le Tableau de bord ou les Stats d'équipe — ces deux sections-là n'affichent que le bilan
  // d'UNE équipe (V-N-D, buts marqués/encaissés) et "ALL" n'aurait pas de sens propre là-bas (une victoire
  // de Mot'eau est une défaite de FC Nulos quand elles se rencontrent, donc pas de bilan "mélangé" cohérent).
  currentClassementsTeam(){
    const t = this.state.classementsTeamView;
    return (t==='A' || t==='B' || t==='ALL') ? t : (this.myTeamKey() || 'A');
  },
  setClassementsTeamView(key){ this.state.classementsTeamView = key; this.render(); },
  teamLogo(key){
    const info = this.state.info || this.defaultInfo();
    return key==='B' ? (info.teamBLogo||null) : (info.teamALogo||null);
  },
  teamLogoTag(key, size){
    size = size||16;
    const logo = this.teamLogo(key);
    const emoji = key==='B' ? '🟢' : '🟠';
    if(logo) return `<img src="${logo}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;vertical-align:middle;display:inline-block;border:1px solid var(--line);">`;
    return `<span style="display:inline-block;">${emoji}</span>`;
  },
  isSupporter(name){
    if(!name) return false;
    return !this.state.players.some(p=>slugify(p.name)===slugify(name));
  },
  roleBadge(name){
    return this.isSupporter(name) ? `<span class="chip" style="padding:1px 7px;font-size:10.5px;margin-left:5px;cursor:default;">🎉 Supporter</span>` : "";
  },
  // Options d'identité de publication proposées dans les Actus : en son nom perso, au nom d'un des deux
  // clubs (logo + nom d'équipe), ou au nom du compte média (façon compte d'actu transferts). Réutilisé
  // pour une nouvelle publication ET pour compléter/éditer une publication automatique (résumé de match,
  // nouvelle recrue).
  // Comptes "événement" : des identités fictives et amusantes (pas de vraie personne) pour annoncer des
  // récompenses/compétitions façon grand média sportif — distinctes du compte club et du compte média
  // général (Vestiaire Direct).
  AWARD_IDENTITIES:{
    'award-ballonDor':{icon:'🏆', name:"Ballon d'Or"},
    'award-ucl':{icon:'🏆', name:"Ligue des Champions"},
    'award-wc':{icon:'🌍', name:"Coupe du Monde"},
  },
  postIdentityOptions(){
    const tn = this.teamNames();
    const awards = Object.entries(this.AWARD_IDENTITIES).map(([value,a])=>({value, label:`${a.icon} ${a.name}`}));
    return [
      {value:'personal', label:`👤 Moi (${this.me||'toi'})`},
      {value:'club-A', label:`🟠 Club ${tn.a}`},
      {value:'club-B', label:`🟢 Club ${tn.b}`},
      {value:'media', label:`📰 ${this.mediaName()} (compte média)`},
      ...awards,
    ];
  },
  renderPostIdentitySelect(id, selected){
    selected = selected || 'personal';
    return `<label class="field">Publier en tant que
      <select id="${id}">
        ${this.postIdentityOptions().map(o=>`<option value="${o.value}" ${o.value===selected?'selected':''}>${esc(o.label)}</option>`).join("")}
      </select>
    </label>`;
  },
  // Dédier une publication à un joueur précis (optionnel, cumulable avec n'importe quelle identité
  // ci-dessus) : sert par exemple pour "Ballon d'Or" décerné à quelqu'un, ou un petit mot "pour" un joueur
  // en particulier — sans jamais faire dire quoi que ce soit à sa place (l'auteur affiché reste
  // l'identité choisie plus haut, pas le joueur).
  renderPostTagPlayerSelect(id, selected){
    selected = selected || '';
    const roster = this.state.players.map(p=>p.name);
    return `<label class="field">Dédier à un joueur (optionnel)
      <select id="${id}">
        <option value="">— Personne en particulier —</option>
        ${roster.map(n=>`<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join("")}
      </select>
    </label>`;
  },
  // Transforme la valeur du sélecteur d'identité en {authorKind, author} à enregistrer sur la publication.
  // `me` est le compte réellement connecté (toujours conservé à part dans `postedBy`, pour les droits de
  // modification), indépendamment du nom affiché choisi ici.
  resolvePostIdentity(value, me){
    const tn = this.teamNames();
    if(value==='club-A') return {authorKind:'club-A', author: tn.a};
    if(value==='club-B') return {authorKind:'club-B', author: tn.b};
    if(value==='media') return {authorKind:'media', author: this.mediaName()};
    if(this.AWARD_IDENTITIES[value]) return {authorKind:value, author: this.AWARD_IDENTITIES[value].name};
    return {authorKind:'personal', author: me||this.me||'Capitaine'};
  },
  // Ligne d'auteur affichée sur une publication (Actus) : nom perso + badge habituel (roleBadge), ou
  // logo de club / bandeau "Média" pour les publications faites au nom du club ou du compte média — dans
  // ce cas on n'appelle PAS roleBadge (il chercherait "Mot'eau" ou "Vestiaire Direct" parmi les joueurs et
  // afficherait à tort "🎉 Supporter").
  postAuthorLine(p){
    const kind = p.authorKind || 'personal';
    if(kind==='club-A' || kind==='club-B'){
      const key = kind==='club-B' ? 'B' : 'A';
      return `<b>${this.teamLogoTag(key,16)} ${esc(p.author||'Club')}</b> <span class="chip" style="padding:1px 7px;font-size:10.5px;margin-left:3px;cursor:default;">🏟️ Compte du club</span>`;
    }
    if(kind==='media'){
      return `<b>📰 ${esc(p.author||this.mediaName())}</b> <span class="chip" style="padding:1px 7px;font-size:10.5px;margin-left:3px;cursor:default;">✅ Média</span>`;
    }
    if(this.AWARD_IDENTITIES[kind]){
      const a = this.AWARD_IDENTITIES[kind];
      return `<b>${a.icon} ${esc(p.author||a.name)}</b> <span class="chip" style="padding:1px 7px;font-size:10.5px;margin-left:3px;cursor:default;">🎖️ Compte événement</span>`;
    }
    return `<b>${esc(p.author||"Capitaine")}</b>${this.roleBadge(p.author)}`;
  },
  // Petit bandeau "dédié à" sous la ligne d'auteur, si la publication a été rattachée à un joueur précis.
  renderPostTaggedPlayerLine(p){
    if(!p.taggedPlayer) return "";
    return `<div class="chip" style="margin-top:4px;padding:2px 8px;font-size:11px;cursor:default;">🎯 Pour ${esc(p.taggedPlayer)}</div>`;
  },
  renderConvocations(nm){

    const tn = this.teamNames();
    return `
    <div class="card">
      <h2>👥 Convocations & équipes</h2>
      ${this.admin ? `

          <label class="field">${this.teamLogoTag('A',14)} Nom équipe 1 <input type="text" id="teamAName" value="${esc(tn.a)}" placeholder="Mot'eau"></label>
          <label class="field">${this.teamLogoTag('B',14)} Nom équipe 2 <input type="text" id="teamBName" value="${esc(tn.b)}" placeholder="FC Nulos"></label>
        </div>
        <div class="grid2" style="margin-bottom:10px;">
          <label class="field">${this.teamLogoTag('A',14)} Logo équipe 1 <input type="file" id="teamALogoFile" accept="image/*"></label>

          return `<div class="presence-row">
            <span class="nm">${esc(p.name)}</span>

            <button class="pbtn ${inA?'on-present':''}" onclick="App.assignTeam('${nm.id}','${jsa(p.name)}','A')" title="${esc(tn.a)}">${this.teamLogoTag('A',14)} ${esc(tn.a)}</button>
            <button class="pbtn ${inB?'on-late':''}" onclick="App.assignTeam('${nm.id}','${jsa(p.name)}','B')" title="${esc(tn.b)}">${this.teamLogoTag('B',14)} ${esc(tn.b)}</button>

  async saveTeamNames(){
    const a = document.getElementById("teamAName").value.trim();
    const b = document.getElementById("teamBName").value.trim();
    const info = this.state.info || this.defaultInfo();
    const patch = {teamAName: a||"Équipe A", teamBName: b||"Équipe B"};
    const fileA = document.getElementById("teamALogoFile").files[0];
    const fileB = document.getElementById("teamBLogoFile").files[0];
    if(fileA) patch.teamALogo = await resizeImage(fileA, 300, 0.85);
    if(fileB) patch.teamBLogo = await resizeImage(fileB, 300, 0.85);
    const mediaNameEl = document.getElementById("mediaNameInput");
    if(mediaNameEl) patch.mediaName = mediaNameEl.value.trim() || "Vestiaire Direct";
    await this.db.doc("team/info").set({...info, ...patch});
    toast("Équipes mises à jour");
  },
  async toggleConvoked(matchId, name){
    const m = this.state.matches.find(x=>x.id===matchId);
    let convoked = (m.convoked||[]).slice();
    if(convoked.includes(name)) convoked = convoked.filter(n=>n!==name);
    else convoked.push(name);
    await this.db.collection("matches").doc(matchId).update({convoked});
  },
  renderTeamCompare(nm){
    const teamA = nm.teamA||[], teamB = nm.teamB||[];
    if(teamA.length===0 && teamB.length===0) return "";
    const matchGoals = this.matchGoalScorers(nm); // fusionne jeu + coup franc + corner + penalty
    const statFor = (roster)=>{
      let ratingsAll=[], goals=0;
      roster.forEach(n=>{
        const r = nm.ratings && nm.ratings[n];
        if(r) ratingsAll = ratingsAll.concat(Object.values(r));
        matchGoals.forEach(s=>{ if(s.name===n) goals += (s.count||0); });
      });
      return {count:roster.length, avg: ratingsAll.length?avg(ratingsAll):null, goals};
    };
    const a = statFor(teamA), b = statFor(teamB);
    const tn = this.teamNames();
    return `
    <div class="card">
      <h2>📊 ${esc(tn.a)} vs ${esc(tn.b)}</h2>
      <div class="team-compare">
        <div class="tc-card">
          <span class="muted" style="font-size:11px;">${this.teamLogoTag('A',14)} ${esc(tn.a.toUpperCase())}</span>
          <b>${a.count}</b>
          <span class="muted" style="font-size:11px;">joueur${a.count>1?'s':''}</span>
          <hr class="sep" style="margin:8px 0;">
          <div class="kv" style="border:none;"><span>Buts</span><b>${a.goals}</b></div>
          <div class="kv" style="border:none;"><span>Note moy.</span><b>${a.avg!=null?a.avg.toFixed(1):'–'}</b></div>
        </div>
        <div class="tc-card">
          <span class="muted" style="font-size:11px;">${this.teamLogoTag('B',14)} ${esc(tn.b.toUpperCase())}</span>
          <b>${b.count}</b>
          <span class="muted" style="font-size:11px;">joueur${b.count>1?'s':''}</span>
          <hr class="sep" style="margin:8px 0;">
          <div class="kv" style="border:none;"><span>Buts</span><b>${b.goals}</b></div>
          <div class="kv" style="border:none;"><span>Note moy.</span><b>${b.avg!=null?b.avg.toFixed(1):'–'}</b></div>
        </div>
      </div>
    </div>`;
  },
  async assignTeam(matchId, name, team){
    const m = this.state.matches.find(x=>x.id===matchId);
    let teamA = (m.teamA||[]).filter(n=>n!==name);
    let teamB = (m.teamB||[]).filter(n=>n!==name);
    if(team==='A') teamA.push(name); else teamB.push(name);
    let convoked = uniq([...(m.convoked||[]), name]);
    // .update() (pas .set()) : ne touche que teamA/teamB/convoked. Un .set() aurait réécrit TOUT le
    // document avec la copie locale de "m", donc si un autre champ (ex: des notes) avait été modifié par
    // quelqu'un d'autre entre-temps et pas encore reçu sur cet appareil, ce .set() l'aurait effacé.
    await this.db.collection("matches").doc(matchId).update({teamA, teamB, convoked});
  },

  renderTacticSection(nm, opts){
    opts = opts||{};

    const view = (this.state.tacticViewByMatch||{})[nm.id] || "general";
    const myKey = this.myTeamKey();
    const advKey = myKey==='A' ? 'B' : myKey==='B' ? 'A' : null;
    const boardFor = (key)=>{
      if(key==='general') return this.renderTacticBoard(nm, 'tactic', uniq([...(nm.teamA||[]), ...(nm.teamB||[]), ...(nm.convoked||[])]), null, opts);
      if(key==='A') return this.renderTacticBoard(nm, 'tacticA', nm.teamA||[], tn.a, opts);
      if(key==='B') return this.renderTacticBoard(nm, 'tacticB', nm.teamB||[], tn.b, opts);
      return "";
    };
    return `
    <div class="card">
      <h2>🧠 ${opts.title||"Compositions"}</h2>
      ${opts.subtitle? `<p class="muted" style="font-size:12.5px;margin-top:-6px;">${opts.subtitle}</p>`:""}

        <span class="chip ${view==='adverse'?'active':''}" onclick="App.setTacticView('${nm.id}','adverse')">${this.teamLogoTag(advKey==='B'?'B':'A',14)} Adverse${advKey? ' ('+esc(advKey==='A'?tn.a:tn.b)+')':''}</span>
      </div>
      ${view==='general' ? boardFor('general') : ""}
      ${view==='mine' ? (myKey? boardFor(myKey) : `<p class="muted" style="font-size:12.5px;">Ton profil joueur n'a pas encore d'équipe assignée — demande à ton capitaine de te l'attribuer dans l'onglet Recrues.</p>`) : ""}
      ${view==='adverse' ? (advKey? boardFor(advKey) : `<p class="muted" style="font-size:12.5px;">Équipe adverse non déterminée (attribue d'abord ton équipe dans l'onglet Recrues).</p>`) : ""}
    </div>`;
  },
  setTacticView(matchId, view){
    this.state.tacticViewByMatch = this.state.tacticViewByMatch || {};
    this.state.tacticViewByMatch[matchId] = view;
    this.render();
  },
  domSafe(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,'_'); },
  renderMovesSvg(slots, moves, targetId){
    const safeT = this.domSafe(targetId);
    if(!moves || !moves.length) return `<svg class="pitch-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>`;
    const byKey = {}; slots.forEach(s=>byKey[s.k]=s);
    const parts = moves.map((mv,i)=>{
      const from = byKey[mv.from], to = byKey[mv.to];
      if(!from || !to) return "";
      return `
        <line x1="${from.l}" y1="${from.t}" x2="${to.l}" y2="${to.t}" stroke="#FFD84A" stroke-width="1" marker-end="url(#arrowhead-${safeT})" opacity="0.9"></line>
        <circle class="mv-marker" r="2" fill="#FF5A5A" cx="${from.l}" cy="${from.t}" opacity="0">
          <animateMotion id="anim-${safeT}-${i}" begin="indefinite" dur="1.1s" fill="freeze" path="M${from.l},${from.t} L${to.l},${to.t}"></animateMotion>
          <animate attributeName="opacity" begin="anim-${safeT}-${i}.begin" dur="0.05s" to="1" fill="freeze"></animate>
        </circle>`;
    }).join("");
    return `<svg class="pitch-svg" data-target="${esc(targetId)}" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><marker id="arrowhead-${safeT}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#FFD84A"></path></marker></defs>
      ${parts}
    </svg>`;
  },
  toggleDrawMode(target){
    if(this.draw.target === target){ this.draw.target = null; this.draw.pending = null; }
    else { this.draw.target = target; this.draw.pending = null; }
    this.render();
  },
  handleDrawTap(target, slotKey){
    if(this.draw.pending === slotKey){ this.draw.pending = null; this.render(); return; }
    if(!this.draw.pending){ this.draw.pending = slotKey; this.render(); return; }
    const from = this.draw.pending, to = slotKey;
    this.draw.pending = null;
    this.render();
    this.commitMove(target, from, to);
  },
  async commitMove(target, from, to){
    const parts = target.split("|");
    if(parts[0]==='match'){
      const matchId = parts[1], tacticKey = parts[2];
      const m = this.state.matches.find(x=>x.id===matchId);
      if(!m) return;
      const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}, moves:[]};
      const moves = [...(tactic.moves||[]), {from, to}];
      await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, moves}});
    } else if(parts[0]==='bestxi'){
      const view = parts[1];
      const data = this.getBestXIData(view);
      const v = data.variants.find(x=>x.id===data.activeId);
      if(v){ v.moves = [...(v.moves||[]), {from, to}]; await this.saveBestXIData(view, data); }
    }
  },
  async clearMoves(target){
    const parts = target.split("|");
    if(parts[0]==='match'){
      const matchId = parts[1], tacticKey = parts[2];
      const m = this.state.matches.find(x=>x.id===matchId);
      if(!m) return;
      const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}, moves:[]};
      await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, moves:[]}});
    } else if(parts[0]==='bestxi'){
      const view = parts[1];
      const data = this.getBestXIData(view);
      const v = data.variants.find(x=>x.id===data.activeId);
      if(v){ v.moves = []; await this.saveBestXIData(view, data); }
    }
  },
  async removeMove(target, idx){
    const parts = target.split("|");
    if(parts[0]==='match'){
      const matchId = parts[1], tacticKey = parts[2];
      const m = this.state.matches.find(x=>x.id===matchId);
      if(!m) return;
      const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}, moves:[]};
      const moves = (tactic.moves||[]).filter((_,i)=>i!==idx);
      await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, moves}});
    } else if(parts[0]==='bestxi'){
      const view = parts[1];
      const data = this.getBestXIData(view);
      const v = data.variants.find(x=>x.id===data.activeId);
      if(v){ v.moves = (v.moves||[]).filter((_,i)=>i!==idx); await this.saveBestXIData(view, data); }
    }
  },
  animateMoves(target){
    const svgs = document.querySelectorAll(`svg[data-target="${target}"]`);
    if(!svgs.length){ toast("Aucune flèche à animer"); return; }
    svgs.forEach(svg=>{
      const anims = svg.querySelectorAll('animateMotion');
      anims.forEach((a,i)=>{
        const circle = a.closest('circle');
        if(circle) circle.setAttribute('opacity','0');
        setTimeout(()=>{ try{ a.beginElement(); }catch(e){} }, i*260);
      });
    });
    toast("▶️ Animation des déplacements");
  },
  renderDrawTools(target, moves){
    const drawing = this.draw.target === target;
    if(!this.admin) return "";
    return `
      <div class="draw-tools">
        <button class="btn btn-ghost btn-sm" onclick="App.toggleDrawMode('${target}')">${drawing? '✅ Terminer le dessin' : '✏️ Dessiner un déplacement'}</button>
        ${moves.length? `<button class="btn btn-ghost btn-sm" onclick="App.animateMoves('${target}')">▶️ Animer</button>
        <button class="btn btn-ghost btn-sm" onclick="App.clearMoves('${target}')">🗑️ Effacer les flèches</button>` : ""}
      </div>
      ${drawing? `<p class="muted" style="font-size:11px;margin-top:6px;">Touche un poste de départ puis un poste d'arrivée pour tracer une flèche de déplacement.</p>` : ""}
      ${moves.length? `<div class="moves-list">${moves.map((mv,i)=>`<div class="kv"><span>➡️ ${esc(mv.from)} → ${esc(mv.to)}</span><span class="mini-x" onclick="App.removeMove('${target}', ${i})">✕</span></div>`).join("")}</div>` : ""}
    `;
  },
  renderTacticBoard(nm, tacticKey, pool, label, opts){
    opts = opts||{};
    const tactic = nm[tacticKey];
    const formation = (tactic&&tactic.formation) || "4-3-3";
    const assignments = (tactic&&tactic.assignments) || {};
    const moves = (tactic&&tactic.moves) || [];
    const bench = (tactic&&tactic.bench) || [];
    // `positions` : positions custom d'un ou plusieurs postes, déplacés à la main sur le terrain (voir
    // startSlotDrag) — remplace la position par défaut de la formation pour ce poste-là uniquement. Permet
    // de "faire tac tac" (ajuster librement où se trouve chaque petit rond), sans devoir tout redéfinir.
    const positions = (tactic&&tactic.positions) || {};
    const baseSlots = this.FORMATIONS[formation];
    const slots = baseSlots.map(s=> positions[s.k] ? {...s, t:positions[s.k].t, l:positions[s.k].l} : s);
    const target = `match|${nm.id}|${tacticKey}`;
    const drawing = this.draw.target === target;
    const pending = drawing ? this.draw.pending : null;
    const hasCustomPositions = Object.keys(positions).length>0;
    return `
    <div>
      ${label? `<p class="muted" style="font-size:12.5px;font-weight:700;margin:0 0 6px;">${label}</p>`:""}
      ${this.admin ? `
        <label class="field">Formation
          <select onchange="App.setFormation('${nm.id}','${tacticKey}', this.value)">
            ${Object.keys(this.FORMATIONS).map(f=>`<option value="${f}" ${f===formation?'selected':''}>${f}</option>`).join("")}
          </select>
        </label>
        <p class="muted" style="font-size:11px;margin-top:-6px;">💡 Fais glisser un petit rond sur le terrain pour le placer exactement où tu veux — touche-le sans le bouger pour changer le joueur.</p>` : `<p class="muted" style="font-size:13px;">Formation : <b>${formation}</b></p>`}
      <div class="pitch ${drawing?'drawmode':''}">
        ${this.renderMovesSvg(slots, moves, target)}
        ${slots.map(s=>{
          const assigned = assignments[s.k];
          const isPending = pending===s.k;
          return `<div class="slot ${assigned?'':'empty'} ${isPending?'pending':''}" style="top:${s.t}%;left:${s.l}%;touch-action:none;" ${this.admin?`onpointerdown="App.startSlotDrag(event,'${nm.id}','${tacticKey}','${s.k}')"`:''}>
            <div class="dot">${assigned? initials(assigned) : s.k.replace(/[0-9]/g,'')}</div>
            <div class="lb">${assigned? esc(assigned).split(' ')[0] : s.k}</div>
          </div>`;
        }).join("")}
      </div>
      ${this.admin && hasCustomPositions ? `<button class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="App.resetSlotPositions('${nm.id}','${tacticKey}')">↩️ Remettre les postes par défaut</button>` : ""}
      ${!this.admin && pool.length===0 ? `<p class="muted" style="margin-top:8px;">Composition à venir.</p>` : ""}
      ${this.renderBenchSection(nm.id, tacticKey, pool, assignments, bench)}
      ${this.renderDrawTools(target, moves)}
      <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="App.shareMatchTacticToChat('${nm.id}','${tacticKey}')">📤 Partager dans le chat</button>
    </div>`;
  },
  // Fait glisser librement un poste sur le terrain ("tac tac", comme un vrai tableau tactique) : un simple
  // appui sans mouvement garde l'ancien comportement (ouvrir le choix du joueur, ou pointer une flèche en
  // mode dessin) ; un vrai glissement déplace le petit rond et enregistre sa nouvelle position (en % du
  // terrain, donc ça reste correct quelle que soit la taille de l'écran). On manipule le DOM directement
  // pendant le glissement (pas de re-render à chaque pixel, ce serait lent) et on n'enregistre qu'au lâcher.
  startSlotDrag(evt, matchId, tacticKey, slotKey){
    if(!this.admin) return;
    const target = `match|${matchId}|${tacticKey}`;
    const drawModeActive = this.draw.target === target;
    evt.preventDefault();
    const slotEl = evt.currentTarget;
    const pitchEl = slotEl.closest('.pitch');
    if(!pitchEl){ if(drawModeActive) this.tacticSlotClick(matchId, tacticKey, slotKey); return; }
    const rect = pitchEl.getBoundingClientRect();
    const startX = evt.clientX, startY = evt.clientY;
    let moved = false, lastL = null, lastT = null;
    const onMove = (e)=>{
      if(drawModeActive) return; // en mode dessin, on garde le simple appui pour pointer les flèches
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(Math.abs(dx)>6 || Math.abs(dy)>6) moved = true;
      if(!moved) return;
      let l = ((e.clientX - rect.left)/rect.width)*100;
      let t = ((e.clientY - rect.top)/rect.height)*100;
      l = Math.max(3, Math.min(97, l));
      t = Math.max(4, Math.min(97, t));
      slotEl.style.left = l+'%';
      slotEl.style.top = t+'%';
      lastL = l; lastT = t;
    };
    const onUp = async ()=>{
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      if(moved && !drawModeActive && lastL!=null){
        await this.saveSlotPosition(matchId, tacticKey, slotKey, lastT, lastL);
      } else {
        this.tacticSlotClick(matchId, tacticKey, slotKey);
      }
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, {once:true});
  },
  async saveSlotPosition(matchId, tacticKey, slotKey, t, l){
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}};
    const positions = {...(tactic.positions||{}), [slotKey]: {t: Math.round(t*10)/10, l: Math.round(l*10)/10}};
    await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, positions}});
  },
  async resetSlotPositions(matchId, tacticKey){
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}};
    await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, positions:{}}});
    toast("Postes remis par défaut");
  },
  // Liste des remplaçants pour une composition : indépendante des postes du terrain (une formation à 5
  // joueurs peut très bien avoir 3 remplaçants sur le banc). Un capitaine touche un nom pour le
  // basculer sur le banc ou l'en retirer ; seuls les joueurs du groupe PAS déjà titulaires sont proposés.
  renderBenchSection(matchId, tacticKey, pool, assignments, bench){
    const starters = new Set(Object.values(assignments));
    const available = pool.filter(n=>!starters.has(n));
    return `
    <div style="margin-top:10px;">
      <p class="muted" style="font-size:12px;font-weight:700;margin:0 0 4px;">🔁 Remplaçants${bench.length? ` (${bench.length})`:""}</p>
      ${this.admin ? `
        ${available.length===0 ? `<p class="muted" style="font-size:12px;">Personne de disponible (convoque des joueurs, ou vide un poste).</p>` : `
          <div class="row" style="flex-wrap:wrap;gap:4px;">
            ${available.map(n=>{
              const onBench = bench.includes(n);
              return `<button class="pbtn ${onBench?'on-present':''}" onclick="App.toggleBench('${matchId}','${tacticKey}','${jsa(n)}')">${esc(n)}</button>`;
            }).join("")}
          </div>`}
      ` : (bench.length? `<div class="row" style="flex-wrap:wrap;gap:4px;">${bench.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div>` : `<p class="muted" style="font-size:12px;">Aucun remplaçant précisé.</p>`)}
    </div>`;
  },
  async toggleBench(matchId, tacticKey, name){
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}, moves:[], bench:[]};
    let bench = (tactic.bench||[]).slice();
    if(bench.includes(name)) bench = bench.filter(n=>n!==name); else bench.push(name);
    await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, bench}});
  },
  async shareMatchTacticToChat(matchId, tacticKey){
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}};
    const formation = tactic.formation || "4-3-3";
    const slots = this.FORMATIONS[formation];
    const assignments = tactic.assignments || {};
    const tn = this.teamNames();
    const label = tacticKey==='tacticA' ? tn.a : tacticKey==='tacticB' ? tn.b : "Général";
    const channel = tacticKey==='tacticA' ? 'A' : tacticKey==='tacticB' ? 'B' : 'general';
    const bench = tactic.bench || [];
    const lines = slots.filter(s=>assignments[s.k]).map(s=>`${s.k} — ${assignments[s.k]}`);
    const header = `🧠 Composition${m.opponent? ' vs '+m.opponent:''} (${label}) — ${formation}`;
    const benchLine = bench.length? "\n🔁 Remplaçants : "+bench.join(", ") : "";
    const text = header + "\n" + (lines.length? lines.join("\n") : "(pas encore remplie)") + benchLine;
    this.ensureMe(async (me)=>{
      await this.db.collection("messages").add({channel, author:me, text, createdAt:new Date().toISOString()});
      toast("Composition partagée dans le chat ("+(channel==='general'?'Général':label)+")");
    });
  },
  async setFormation(matchId, tacticKey, formation){
    const m = this.state.matches.find(x=>x.id===matchId);
    const tactic = (m && m[tacticKey]) || {};
    // On garde le banc de remplaçants tel quel en changeant de formation (il n'est pas lié aux postes du
    // terrain) — seuls les postes/titulaires, les flèches et les positions déplacées à la main sont remis à
    // zéro (les clés de postes d'une formation ne correspondent pas forcément à celles d'une autre).
    await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation, assignments:{}, moves:[], positions:{}, bench: tactic.bench||[]}});
  },
  tacticSlotClick(matchId, tacticKey, slotKey){
    const target = `match|${matchId}|${tacticKey}`;
    if(this.draw.target === target){ this.handleDrawTap(target, slotKey); return; }
    this.openSlotPicker(matchId, tacticKey, slotKey);
  },
  openSlotPicker(matchId, tacticKey, slotKey){
    const m = this.state.matches.find(x=>x.id===matchId);
    let pool;
    if(tacticKey==='tacticA' || tacticKey==='tacticB'){
      // any convoked player can be placed here — doing so assigns them to this team
      pool = uniq([...(m.convoked||[]), ...(m.teamA||[]), ...(m.teamB||[])]);
    } else {
      pool = uniq([...(m.teamA||[]), ...(m.teamB||[]), ...(m.convoked||[])]);
    }
    const teamHint = (tacticKey==='tacticA' || tacticKey==='tacticB') ? "Placer un nom ici l'ajoute automatiquement à cette équipe." : "";
    this.modal(`
      <h3>Poste : ${slotKey}</h3>
      ${teamHint? `<p class="muted" style="font-size:11.5px;margin-top:-4px;">${teamHint}</p>`:""}
      <div class="wrap">
        <span class="chip" onclick="App.assignSlot('${matchId}','${tacticKey}','${slotKey}','')">Vider</span>
        ${pool.map(n=>`<span class="chip" onclick="App.assignSlot('${matchId}','${tacticKey}','${slotKey}','${jsa(n)}')">${esc(n)}</span>`).join("") || "<p class='muted'>Convoque des joueurs d'abord.</p>"}
      </div>
    `);
  },
  async assignSlot(matchId, tacticKey, slotKey, name){
    const m = this.state.matches.find(x=>x.id===matchId);
    const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}};
    const assignments = {...(tactic.assignments||{})};
    if(name) assignments[slotKey]=name; else delete assignments[slotKey];
    const patch = {[tacticKey]:{formation:tactic.formation, assignments}};
    // Un joueur qu'on vient de titulariser ne peut plus être sur le banc en même temps — on l'en retire
    // automatiquement s'il y était.
    if(name && (tactic.bench||[]).includes(name)){
      patch[tacticKey].bench = (tactic.bench||[]).filter(n=>n!==name);
    }
    if(name && (tacticKey==='tacticA' || tacticKey==='tacticB')){
      const teamA = (m.teamA||[]).filter(n=>n!==name);
      const teamB = (m.teamB||[]).filter(n=>n!==name);
      if(tacticKey==='tacticA') teamA.push(name); else teamB.push(name);
      patch.teamA = teamA; patch.teamB = teamB;
    }
    await this.db.collection("matches").doc(matchId).update(patch);
    this.closeModal();
  },

  /* ---------- Meilleur 11 : global + par équipe (composition évolutive, indépendante d'un match, avec variantes) ---------- */
  bestXIField(view){ return view==='A' ? 'bestXI_A' : view==='B' ? 'bestXI_B' : 'bestXI_general'; },
  bestXIRoster(view){
    if(view==='general') return this.state.players.map(p=>p.name);
    return this.state.players.filter(p=>p.team===view).map(p=>p.name);
  },
  getBestXIData(view){
    const info = this.state.info || this.defaultInfo();
    const field = this.bestXIField(view);
    const raw = info[field];
    if(raw && Array.isArray(raw.variants) && raw.variants.length){
      const activeId = (raw.activeId && raw.variants.some(v=>v.id===raw.activeId)) ? raw.activeId : raw.variants[0].id;
      return {variants: raw.variants.map(v=>({moves:[], ...v})), activeId};
    }
    const legacy = raw || {formation:"4-3-3", assignments:{}};
    const v = {id:"v1", name:"Variante 1", formation: legacy.formation||"4-3-3", assignments: legacy.assignments||{}, moves: legacy.moves||[]};
    return {variants:[v], activeId:"v1"};
  },
  activeBestXIVariant(view){
    const data = this.getBestXIData(view);
    return data.variants.find(v=>v.id===data.activeId) || data.variants[0];
  },
  async saveBestXIData(view, data){
    const info = this.state.info || this.defaultInfo();
    const field = this.bestXIField(view);
    await this.db.doc("team/info").set({...info, [field]: data});
  },
  async newBestXIVariant(view){
    const data = this.getBestXIData(view);
    const id = "v"+Date.now();
    data.variants.push({id, name:"Variante "+(data.variants.length+1), formation:"4-3-3", assignments:{}, moves:[]});
    data.activeId = id;
    await this.saveBestXIData(view, data);
  },
  async setActiveBestXIVariant(view, id){
    const data = this.getBestXIData(view);
    data.activeId = id;
    await this.saveBestXIData(view, data);
  },
  async renameBestXIVariant(view, id, name){
    if(!name || !name.trim()) return;
    const data = this.getBestXIData(view);
    const v = data.variants.find(x=>x.id===id);
    if(v) v.name = name.trim().slice(0,40);
    await this.saveBestXIData(view, data);
  },
  async deleteBestXIVariant(view, id){
    const data = this.getBestXIData(view);
    if(data.variants.length<=1){ toast("Il faut garder au moins une variante."); return; }
    data.variants = data.variants.filter(x=>x.id!==id);
    if(data.activeId===id) data.activeId = data.variants[0].id;
    await this.saveBestXIData(view, data);
  },
  openRenameBestXIVariant(view, id){
    const data = this.getBestXIData(view);
    const v = data.variants.find(x=>x.id===id);
    if(!v) return;
    this.modal(`
      <h3>Renommer la variante</h3>
      <label class="field">Nom
        <input type="text" id="renameVariantInput" value="${esc(v.name)}" maxlength="40">
      </label>
      <button class="btn btn-accent btn-block" onclick="App.renameBestXIVariant('${view}','${id}', document.getElementById('renameVariantInput').value); App.closeModal();">Enregistrer</button>
    `);
  },
  renderBestXISection(){
    const tn = this.teamNames();
    const view = this.state.bestXIView || "general";
    const data = this.getBestXIData(view);
    const tactic = data.variants.find(v=>v.id===data.activeId) || data.variants[0];
    const formation = tactic.formation || "4-3-3";
    const assignments = tactic.assignments || {};
    const moves = tactic.moves || [];
    const slots = this.FORMATIONS[formation];
    const roster = this.bestXIRoster(view);
    const target = `bestxi|${view}`;
    const drawing = this.draw.target === target;
    const pending = drawing ? this.draw.pending : null;

    const v = data.variants.find(x=>x.id===data.activeId);
    const assignments = {...(v.assignments||{})};

    await this.saveBestXIData(view, data);
    this.closeModal();

  async setBestXIFormation(view, formation){

      <details open style="margin-bottom:10px;">

        <div style="margin-top:8px;">
          <label class="field">Adversaire <input type="text" id="rOpp" value="${esc(m.opponent||"")}" placeholder="FC Rivals"></label>

      <div class="stat-table-wrap">

      <button class="btn btn-accent btn-block" onclick="App.saveResult('${matchId}')">Enregistrer</button>

  async saveResult(matchId){
    const m = this.state.matches.find(x=>x.id===matchId);
    const wasAlreadyPlayed = !!(m && m.played);
    const convoked = m.convoked||[];
    const roster = uniq([...convoked, ...this.state.players.map(p=>p.name)]);
    const opponent = document.getElementById("rOpp").value.trim();
    const date = document.getElementById("rDate").value;
    const time = document.getElementById("rTime").value;
    const location = document.getElementById("rLoc").value.trim();
    const jerseyHome = document.getElementById("rJh").value.trim();
    const jerseyAway = document.getElementById("rJa").value.trim();
    const us = parseInt(document.getElementById("rUs").value,10)||0;
    const them = parseInt(document.getElementById("rThem").value,10)||0;
    const importance = parseInt(document.getElementById("rImportance").value,10) || 5;
    const out = {};
    this.STAT_COLS.forEach(c=>{ out[c.key] = []; });
    roster.forEach(n=>{
      this.STAT_COLS.forEach(c=>{
        const el = document.getElementById(`rc-${c.id}-${slugify(n)}`);
        const v = el ? (parseInt(el.value,10)||0) : 0;
        if(v>0) out[c.key].push({name:n, count:v});
      });
    });
    await this.db.collection("matches").doc(matchId).update({
      opponent, date, time, location, jerseyHome, jerseyAway, importance,
      played:true, score:{us,them},
      scorers: out.goals, freekickScored: out.freekick, freekickTaken: out.freekickTaken, assists: out.assists,
      penaltiesScored: out.penScored, penaltiesMissed: out.penMissed, penaltiesCaused: out.penCaused,
      cornersScored: out.cornersScored, cornersTaken: out.cornersTaken, shotsOnTarget: out.shots, tacklesWon: out.tackles,
      saves: out.saves, penaltiesSaved: out.penSaved, penaltiesConceded: out.penConceded,
      minutesPlayed: out.minutes,
      cardsYellow: out.yellow, cardsRed: out.red,
    });
    await this.settleBetsForMatch(matchId, {us, them, scorers: out.goals, freekick: out.freekick, penScored: out.penScored, allGoals: this.matchGoalScorers({scorers: out.goals, freekickScored: out.freekick, cornersScored: out.cornersScored, penaltiesScored: out.penScored})});
    // Amende automatique sur les cartons — seulement au tout premier enregistrement du résultat (si le
    // match était déjà "joué" avant ce clic, c'est une simple correction/édition : on ne veut surtout pas
    // resanctionner deux fois pour les mêmes cartons à chaque fois que le capitaine corrige une stat).
    if(!wasAlreadyPlayed){
      await this.applyCardFines(out.yellow, out.red);
      // Résumé de match automatique (score, buteurs, passeurs) pour les Actus — seulement à la toute
      // première saisie du résultat, pas à chaque correction. Il part en brouillon : invisible tant
      // qu'un capitaine n'a pas ajouté la photo du match (cf. openPublishMatchRecap).
      const allGoals = this.matchGoalScorers({scorers: out.goals, freekickScored: out.freekick, cornersScored: out.cornersScored, penaltiesScored: out.penScored});
      await this.db.collection("posts").add({
        type:'matchrecap', matchId, opponent, date, score:{us,them},
        scorers: allGoals, assists: out.assists||[],
        draft:true, photo:null, caption:"",
        likes:{}, comments:[], createdAt:new Date().toISOString()
      });
    }
    this.closeModal();
    toast("Match enregistré");
  },

      ${(m.assists&&m.assists.length)?`<p style="font-size:13px;margin-top:-8px;" class="muted">🎯 ${m.assists.map(s=>s.name+' ('+s.count+')').join(', ')}</p>`:""}
      ${(m.penaltiesScored&&m.penaltiesScored.length)?`<p style="font-size:13px;margin-top:-8px;" class="muted">✅ Pen. ${m.penaltiesScored.map(s=>s.name+' ('+s.count+')').join(', ')}</p>`:""}

      ${(m.cornersScored&&m.cornersScored.length)?`<p style="font-size:13px;margin-top:-8px;" class="muted">⛳✅ Coufrans marqués ${m.cornersScored.map(s=>s.name+' ('+s.count+')').join(', ')}</p>`:""}
      ${(m.cornersTaken&&m.cornersTaken.length)?`<p style="font-size:13px;margin-top:-8px;" class="muted">⛳ Coufrans tirés ${m.cornersTaken.map(s=>s.name+' ('+s.count+')').join(', ')}</p>`:""}
      ${(m.shotsOnTarget&&m.shotsOnTarget.length)?`<p style="font-size:13px;margin-top:-8px;" class="muted">🎯 Tirs cadrés ${m.shotsOnTarget.map(s=>s.name+' ('+s.count+')').join(', ')}</p>`:""}

      ${mvpInfo ? `<div class="badge gold" style="margin:6px 0 10px;">🏆 MVP du match : ${esc(mvpInfo.name)}${mvpInfo.source==='vote' ? ` (1er du classement du match, ${mvpInfo.points} pts)` : ` (${mvpInfo.avg.toFixed(1)}/10 — pas encore de classement voté pour ce match)`}</div>` : ""}
      <hr class="sep">
