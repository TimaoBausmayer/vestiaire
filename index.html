<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC Nulos / Mot'eau</title>
<!-- PWA : rend l'appli installable ("Ajouter à l'écran d'accueil") sur iPhone et Android. -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FC Nulos / Mot'eau">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F7F4EC;
    --surface:#FFFFFF;
    --surface-2:#FBF7EE;
    --text:#16231C;
    --text-muted:#5C6B61;
    --accent:#FF6B35;
    --accent-strong:#E5551F;
    --accent-ink:#7A2E0E;
    --accent-soft:#FFE3D3;
    --accent2:#1B7A5B;
    --accent2-soft:#DCF0E6;
    --line:#E6E1D2;
    --gold:#C08A17;
    --gold-soft:#F6E7C2;
    --danger:#C0392B;
    --danger-soft:#F8DCD8;
    --shadow:0 2px 14px rgba(22,35,28,.09);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1712; --surface:#16211B; --surface-2:#1B2820; --text:#F1EFE5;
      --text-muted:#93A69A; --accent:#FF7A47; --accent-strong:#FF8F5C;
      --accent-ink:#FFD9C4; --accent-soft:#3A2317; --accent2:#3BCB93;
      --accent2-soft:#123324; --line:#28382F; --gold:#E8BD4E; --gold-soft:#3A2E0E;
      --danger:#E5695C; --danger-soft:#3A1D1A; --shadow:0 2px 18px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1712; --surface:#16211B; --surface-2:#1B2820; --text:#F1EFE5;
    --text-muted:#93A69A; --accent:#FF7A47; --accent-strong:#FF8F5C;
    --accent-ink:#FFD9C4; --accent-soft:#3A2317; --accent2:#3BCB93;
    --accent2-soft:#123324; --line:#28382F; --gold:#E8BD4E; --gold-soft:#3A2E0E;
    --danger:#E5695C; --danger-soft:#3A1D1A; --shadow:0 2px 18px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{margin:0;color:var(--text);font-family:"Work Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:"Teko",system-ui,sans-serif;font-weight:600;letter-spacing:.2px;text-wrap:balance;}
  h1{font-size:34px;margin:0 0 4px;}
  h2{font-size:26px;margin:0 0 10px;color:var(--text);}
  h3{font-size:20px;margin:0 0 6px;}
  p{line-height:1.55;color:var(--text);}
  .muted{color:var(--text-muted);}
  a{color:var(--accent-strong);}
  button, .btn{font-family:inherit;}
  #app{max-width:640px;margin:0 auto;padding-bottom:48px;min-height:100vh;background:var(--bg);}

  /* ---- top nav ---- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);}
  .topbar-brand{display:flex;align-items:center;gap:8px;padding:12px 16px 6px;}
  .topbar-brand .logo{font-size:24px;line-height:1;}
  .topbar-brand .name{font-family:"Teko";font-size:22px;font-weight:600;flex:1;}
  .topbar-brand .who{font-size:11.5px;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--line);padding:6px 9px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  .topbar-brand .adminbtn{font-size:15px;background:var(--surface-2);border:1px solid var(--line);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .topbar-brand .adminbtn.on{background:var(--gold-soft);border-color:transparent;}
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:2px 3px 8px;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;border-radius:12px;cursor:pointer;color:var(--text-muted);border:none;background:transparent;font-family:inherit;}
  .tab .ic{font-size:16.5px;}
  .tab .lb{font-size:8.5px;font-weight:600;line-height:1.1;text-align:center;}
  .tab.active{color:var(--accent-strong);background:var(--accent-soft);}

  .view{padding:16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card.tight{padding:12px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .row{display:flex;gap:8px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .wrap{display:flex;flex-wrap:wrap;gap:8px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid transparent;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;transition:transform .05s ease;}
  .btn:active{transform:scale(.97);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:var(--accent-strong);}
  .btn-outline{background:transparent;border-color:var(--line);color:var(--text);}
  .btn-soft{background:var(--accent-soft);color:var(--accent-ink);}
  .btn-ghost{background:transparent;color:var(--text-muted);border:none;padding:8px 10px;min-height:auto;}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-sm{padding:7px 11px;font-size:12.5px;min-height:36px;border-radius:10px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],input[type=password],textarea,select{
    width:100%;font-family:inherit;font-size:14.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  }
  textarea{resize:vertical;min-height:90px;}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:10px;}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--accent2-soft);color:var(--accent2);}
  .badge.gold{background:var(--gold-soft);color:var(--gold);}
  .empty{text-align:center;padding:28px 12px;color:var(--text-muted);}
  .empty .e-ic{font-size:34px;display:block;margin-bottom:8px;}
  hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0;}

  /* modal */
  .modal-back{position:fixed;inset:0;background:rgba(10,14,11,.5);z-index:250;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px 22px;max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25);}
  @media (min-width:660px){ .modal-back{align-items:center;} .modal{border-radius:20px;max-height:85vh;} }
  .modal-handle{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px;}
  .toast-wrap{position:fixed;bottom:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:300;pointer-events:none;}
  .toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);}

  /* tab1 rules */
  .rules-text{white-space:pre-wrap;font-size:14.5px;line-height:1.65;}
  .consent-box{border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px;}
  .checkline{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;cursor:pointer;}
  .checkline input{width:20px;height:20px;flex:none;margin-top:1px;}
  .consent-list-item{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}

  /* tab2 media & stories */
  .stories-strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 4px;margin-bottom:4px;}
  .story-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:66px;cursor:pointer;}
  .story-ring{width:58px;height:58px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;flex:none;}
  .story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--surface);display:block;}
  .story-ring.add{background:var(--surface-2);border:2px dashed var(--line);}
  .story-ring .ph{width:100%;height:100%;border-radius:50%;border:2px solid var(--surface);background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;}
  .story-name{font-size:10.5px;color:var(--text-muted);max-width:66px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;}

  .media-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .media-item{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);aspect-ratio:1/1;cursor:pointer;}
  .media-item img,.media-item .video-ph{width:100%;height:100%;object-fit:cover;display:block;}
  .video-ph{display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(160deg,var(--accent2-soft),var(--surface-2));}
  .media-fav{position:absolute;top:6px;right:6px;background:rgba(10,14,11,.45);border:none;border-radius:999px;width:30px;height:30px;color:#fff;font-size:15px;cursor:pointer;z-index:2;}
  .media-del{position:absolute;top:6px;left:6px;background:rgba(10,14,11,.45);border:none;border-radius:999px;width:26px;height:26px;color:#fff;font-size:12px;cursor:pointer;z-index:2;}
  .media-cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);color:#fff;font-size:11px;padding:16px 8px 6px;display:flex;justify-content:space-between;gap:4px;}
  .pending-banner{border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:var(--accent-ink);}
  .pending-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .pending-row:last-child{border-bottom:none;}
  .pending-thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--surface-2);flex:none;}

  /* lightbox */
  .lightbox-back{position:fixed;inset:0;background:rgba(6,10,7,.92);z-index:150;display:flex;flex-direction:column;}
  .lightbox-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;z-index:2;}
  .lightbox-media{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:22px;}
  .lightbox-media img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;}
  .lightbox-media a.openvid{color:#fff;font-size:16px;text-align:center;background:rgba(255,255,255,.12);padding:16px 22px;border-radius:14px;}
  .lightbox-panel{background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px;max-height:44vh;overflow-y:auto;flex:none;}
  .comment-item{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .comment-item:last-child{border-bottom:none;}

  /* tab3 cards */
  .fut-card{width:150px;aspect-ratio:2/3.75;border-radius:16px;position:relative;padding:12px 10px;color:#fff;display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.25);flex:none;}
  .fut-card.bronze{background:linear-gradient(160deg,#a3703f,#5b3a24);}
  .fut-card.silver{background:linear-gradient(160deg,#d7dee3,#8b939b);color:#1c2126;}
  .fut-card.gold{background:linear-gradient(160deg,#f7dd8a,#c9962a);color:#3a2900;}
  .fut-card.icon{background:linear-gradient(160deg,#a679f2,#4c1d95);}
  .fut-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .fut-rating{font-family:"Teko";font-size:34px;line-height:1;font-weight:700;}
  .fut-pos{font-family:"Teko";font-size:15px;font-weight:600;opacity:.9;}
  .fut-num{position:absolute;top:10px;left:10px;font-family:"Teko";font-size:13px;font-weight:700;background:rgba(0,0,0,.22);border-radius:6px;padding:1px 6px;}
  .fut-photo{width:48px;height:48px;border-radius:50%;object-fit:cover;margin:4px auto;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.25);}
  .fut-photo.ph{display:flex;align-items:center;justify-content:center;font-size:19px;}
  .fut-name{font-family:"Teko";font-size:15px;text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .fut-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px 8px;margin-top:auto;font-size:10px;font-weight:700;}
  .fut-stats div{display:flex;justify-content:space-between;}
  .fut-mv{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:4px 6px;border-radius:8px;background:rgba(0,0,0,.18);font-size:10px;font-weight:700;}
  .fut-mv-val{opacity:.95;}
  .fut-mv-arrow{font-weight:800;}
  .fut-mv.mv-up .fut-mv-arrow{color:#4ADE80;}
  .fut-mv.mv-down .fut-mv-arrow{color:#F87171;}
  .fut-mv.mv-flat .fut-mv-arrow{opacity:.7;}
  .cards-gallery{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}

  /* pitch */
  .pitch{position:relative;width:100%;aspect-ratio:2/3;background:repeating-linear-gradient(0deg,#2c8a4f,#2c8a4f 10%,#2f9457 10%,#2f9457 20%);border-radius:14px;border:3px solid rgba(255,255,255,.7);overflow:hidden;}
  .pitch::before{content:"";position:absolute;inset:6px;border:2px solid rgba(255,255,255,.55);border-radius:8px;}
  .pitch::after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;border:2px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%);}
  .slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
  .slot .dot{width:34px;height:34px;border-radius:50%;background:#fff;color:#16231C;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--accent);}
  .slot.empty .dot{background:rgba(255,255,255,.55);border-style:dashed;color:#fff;font-size:9px;}
  .slot .lb{font-size:9px;color:#fff;font-weight:700;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:6px;}
  .pitch.drawmode .slot{cursor:crosshair;}
  .pitch.drawmode .slot .dot{box-shadow:0 0 0 2px #FFD84A;}
  .pitch.drawmode .slot.pending .dot{box-shadow:0 0 0 3px #FF5A5A;}
  .pitch-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .chat-pitch{max-width:200px;margin:2px 0 4px;}
  .chat-pitch .slot .dot{width:22px;height:22px;font-size:8px;border-width:1.5px;}
  .chat-pitch .slot .lb{font-size:7px;padding:0 4px;}
  .variant-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  .variant-chip{display:flex;align-items:center;gap:4px;}
  .variant-chip .mini-x{font-size:10px;opacity:.6;cursor:pointer;padding:0 2px;}
  .variant-chip .mini-x:hover{opacity:1;}
  .moves-list{margin-top:8px;font-size:11.5px;}
  .moves-list .kv{border:none;padding:3px 0;}
  .draw-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

  /* Paris / wallet */
  .value-big{font-size:26px;font-weight:800;margin:4px 0;}
  .bet-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .bet-chip{flex:1;min-width:90px;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;font-weight:700;cursor:pointer;text-align:center;color:var(--text);}
  .bet-chip b{display:block;font-size:13px;margin-top:2px;color:var(--accent2);}
  .bet-chip.sm{flex:0 0 auto;min-width:64px;padding:6px 8px;font-size:10px;}
  .bet-player-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line);}
  .bet-player-row .nm{flex:1;font-weight:700;font-size:12.5px;min-width:70px;}
  .bet-match-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;}
  .bet-match-teaser{display:flex;align-items:center;gap:6px;font-size:11px;}
  .bet-match-teaser b{font-size:14px;color:var(--accent2);}
  .bet-match-teaser .chevron{color:var(--text-muted);font-size:11px;}

  /* stat table */
  table.stats{width:100%;border-collapse:collapse;font-size:13px;}
  table.stats th{text-align:left;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:4px 6px;border-bottom:1px solid var(--line);}
  table.stats td{padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  table.stats td.num{text-align:right;font-weight:700;}
  .rank-medal{display:inline-flex;width:20px;justify-content:center;}

  .presence-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
  .presence-row .nm{flex:1;font-weight:600;font-size:13.5px;}
  .pbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text-muted);}
  .pbtn.on-present{background:var(--accent2-soft);color:var(--accent2);border-color:transparent;}
  .pbtn.on-absent{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
  .pbtn.on-late{background:var(--gold-soft);color:var(--gold);border-color:transparent;}
  .pbtn.on-unsure{background:var(--surface);color:var(--text-muted);border-color:var(--text-muted);}
  .pbtn.has-note{box-shadow:0 0 0 2px var(--accent2) inset;}
  .presence-note-preview{font-size:10.5px;color:var(--text-muted);font-style:italic;margin:-4px 0 4px;}

  .stat-table-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px;}
  table.stat-table{border-collapse:collapse;width:100%;font-size:12px;}
  table.stat-table th,table.stat-table td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.stat-table th{background:var(--surface-2);color:var(--text-muted);font-size:10.5px;font-weight:700;position:sticky;top:0;}
  table.stat-table td:first-child,table.stat-table th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700;padding-left:8px;z-index:1;}
  table.stat-table input[type=number]{width:34px;padding:4px 2px;text-align:center;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);}
  .stat-legend{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.6;}

  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .kv:last-child{border-bottom:none;}

  .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;}

  /* tab4 stats */
  .search-wrap input{padding-left:34px;}
  .search-wrap{position:relative;margin-bottom:10px;}
  .search-wrap .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-muted);}
  .player-pick-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .player-pick-row:last-child{border-bottom:none;}
  .sheet-head{display:flex;gap:12px;align-items:center;margin-bottom:8px;}
  .avatar-lg{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex:none;}

<script type="module">
  // ==================================================================================

  // Remplace les valeurs ci-dessous par celles de TON propre projet Firebase (gratuit) :
  // Console Firebase > (ton projet) > icône ⚙️ Paramètres du projet > onglet "Général"

  const firebaseConfig = {
    apiKey: "AIzaSyARSuwww43esbWEiCjP4EwB6K7GDnl416A",
    authDomain: "vestiaire-de2de.firebaseapp.com",
    projectId: "vestiaire-de2de",
    storageBucket: "vestiaire-de2de.firebasestorage.app",
    messagingSenderId: "879870271321",
    appId: "1:879870271321:web:8501672636116cc5e7f648",
    measurementId: "G-6T9M2Z5PFW"
  };
  // ==================================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    initializeFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
    collection, addDoc, getDocs, query, orderBy
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Petit adaptateur qui donne à Firestore la même forme (doc/collection, get/set/update/
  // delete/onSnapshot, orderBy) que celle utilisée partout dans le code de l'appli plus bas
  // — comme ça, aucune autre ligne de l'appli n'a besoin de changer.
  function wrapDocSnap(snap){ return { exists: snap.exists(), data: ()=>snap.data(), id: snap.id }; }

  // Transforme un patch imbriqué (ex: {worstVotes:{Julien:{timao:true}}}) en chemins "à points"
  // (ex: {"worstVotes.Julien.timao": true}) avant d'appeler updateDoc(). C'est indispensable :
  // Firestore, quand on lui donne directement un objet imbriqué comme valeur, REMPLACE tout le
  // champ (donc effacerait les votes/likes/réponses des AUTRES personnes à chaque nouvelle action).
  // Avec les chemins à points, Firestore ne touche que la feuille précise concernée — exactement
  // ce dont a besoin une appli où plusieurs personnes votent/likent/répondent sur le même document.
  function flattenForUpdate(obj, prefix, out){
    out = out || {};
    Object.keys(obj).forEach(k=>{
      const v = obj[k];
      const path = prefix ? prefix + "." + k : k;
      if(v && typeof v === "object" && !Array.isArray(v) && Object.keys(v).length > 0){
        flattenForUpdate(v, path, out);
      } else {
        out[path] = v;
      }
    });
    return out;
  }
  function wrapQuerySnap(qs){ return { docs: qs.docs.map(d=>({id:d.id, data:()=>d.data()})) }; }

  class VDoc {
    constructor(fs, path){ this._ref = doc(fs, path); }
    get(){ return getDoc(this._ref).then(wrapDocSnap); }
    set(data){ return setDoc(this._ref, data); }
    update(patch){ return updateDoc(this._ref, flattenForUpdate(patch)); }
    delete(){ return deleteDoc(this._ref); }
    onSnapshot(cb, errCb){ return onSnapshot(this._ref, s=>cb(wrapDocSnap(s)), errCb||function(){}); }
  }
  class VCollection {
    constructor(fs, path, order){ this._fs=fs; this._path=path; this._ref=collection(fs, path); this._order=order||null; }
    doc(id){ return new VDoc(this._fs, this._path + "/" + id); }
    add(data){ return addDoc(this._ref, data).then(r=>({id:r.id})); }
    orderBy(field, dir){ return new VCollection(this._fs, this._path, {field, dir: dir||"asc"}); }
    _q(){ return this._order ? query(this._ref, orderBy(this._order.field, this._order.dir)) : this._ref; }
    get(){ return getDocs(this._q()).then(wrapQuerySnap); }
    onSnapshot(cb, errCb){ return onSnapshot(this._q(), s=>cb(wrapQuerySnap(s)), errCb||function(){}); }
  }
  class VDB {
    constructor(fs){ this._fs = fs; }
    doc(path){ return new VDoc(this._fs, path); }
    collection(path){ return new VCollection(this._fs, path); }
  }

  try{
    const fbApp = initializeApp(firebaseConfig);
    const fs = initializeFirestore(fbApp, { ignoreUndefinedProperties: true });
    window.__vestiaireDB = new VDB(fs);
  }catch(e){
    console.error("Firebase init a échoué :", e);
    window.__vestiaireDBError = e;
  }
</script>

<script>
(function(){
"use strict";

/* ============================= helpers ============================= */
function slugify(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || ("x"+Date.now());
}
function norm(s){ return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* Safe to embed inside a single-quoted JS string literal that itself sits inside a double-quoted HTML attribute. */
function jsa(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/\n/g," "); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"});
}
function fmtDateShort(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
function fmtDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
// Calcule l'âge en années à partir d'une date de naissance "YYYY-MM-DD".
// Recalculé à chaque affichage (jamais stocké), donc toujours juste, même longtemps après la saisie.
function computeAge(birthDate){
  if(!birthDate) return null;
  const b = new Date(birthDate+"T00:00:00");
  if(isNaN(b)) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const beforeBirthdayThisYear = (now.getMonth() < b.getMonth()) || (now.getMonth()===b.getMonth() && now.getDate() < b.getDate());
  if(beforeBirthdayThisYear) age--;
  return age>=0 ? age : null;
}
// Âge à afficher pour une recrue : priorité à la date de naissance (toujours à jour),
// sinon repli sur l'ancien champ "âge" saisi à la main (pour les fiches créées avant cette fonctionnalité).
function playerAge(p){
  if(!p) return null;
  const fromBirth = computeAge(p.birthDate);
  return fromBirth!=null ? fromBirth : (p.age || null);
}
function fmtTimeOnly(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
function chatDayLabel(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "";
  const now = new Date();
  const oneDay = 24*3600*1000;
  const dKey = new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const nKey = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const diff = Math.round((nKey-dKey)/oneDay);
  if(diff===0) return "Aujourd'hui";
  if(diff===1) return "Hier";
  return d.toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long"});
}
const CHAT_AVATAR_COLORS = ["#E67E5A","#4AA3A2","#B98BD1","#5B93D6","#D6A24A","#6BB06B","#D6688C","#7C93C9"];
function chatAvatarColor(name){
  const s = (name||"?");
  let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return CHAT_AVATAR_COLORS[h % CHAT_AVATAR_COLORS.length];
}
function initials(name){
  return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
}
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function pctStr(made, attempts){ return attempts>0 ? Math.round(made/attempts*100)+"% ("+made+"/"+attempts+")" : "–"; }
function perMatchStr(total, matches){ return matches>0 ? (total/matches).toFixed(2) : "–"; }
function fmtEuro(n){ return Math.round(n||0).toLocaleString("fr-FR") + " €"; }
function uniq(arr){ return [...new Set(arr)]; }
// Une réponse de présence (match ou entraînement/compétition) était autrefois stockée comme une simple
// chaîne ("present"/"late"/"absent"). Elle est maintenant un objet {status, note} pour pouvoir y accrocher
// une petite note visible par tous. Ces deux fonctions lisent les deux formats sans distinction, pour que
// les anciennes réponses déjà enregistrées (avant cette fonctionnalité) continuent de s'afficher correctement.
function presenceStatus(entry){ return entry && typeof entry==='object' ? (entry.status||null) : (entry||null); }
function presenceNote(entry){ return (entry && typeof entry==='object' && entry.note) ? entry.note : ""; }
function simpleHash(s){
  s = String(s==null?"":s);
  let h = 5381;
  for(let i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function getDeviceId(){
  let id = localStorage.getItem("vestiaire_device");
  if(!id){ id = "dev-"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("vestiaire_device", id); }
  return id;
}

function toast(msg){
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className="toast"; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),320); }, 2400);
}

function resizeImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality||0.62));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// L'appli stocke tout dans Firestore (pas de stockage fichier externe type Firebase Storage), et un
// document Firestore ne peut pas dépasser ~1 Mo. On ne peut donc pas accepter n'importe quelle vidéo :
// on impose une durée courte ET un poids de fichier limité (le base64 ajoute environ 33% de poids en
// plus), pour être sûr que la vidéo tienne largement dans un document. Pas de compression vidéo ici
// (ça demanderait une librairie lourde) : si le fichier est trop gros/long, on refuse avec un message
// clair plutôt que de risquer un échec silencieux d'enregistrement.
const VIDEO_MAX_DURATION_SEC = 30;
const VIDEO_MAX_BYTES = 750 * 1024; // 750 Ko bruts ≈ 1000 Ko une fois encodés en base64 (proche du max Firestore ~1 Mo, marge de sécurité gardée pour le reste du document)

function readVideoFile(file, maxDurationSec, maxBytes){
  maxDurationSec = maxDurationSec || VIDEO_MAX_DURATION_SEC;
  maxBytes = maxBytes || VIDEO_MAX_BYTES;
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith("video/")){
      reject(new Error("Ce fichier n'est pas une vidéo."));
      return;
    }
    if(file.size > maxBytes){
      reject(new Error(`Vidéo trop lourde (${Math.round(file.size/1024)} Ko, max ${Math.round(maxBytes/1024)} Ko). Filme en plus petite qualité ou raccourcis-la.`));
      return;
    }
    const url = URL.createObjectURL(file);
    const videoEl = document.createElement("video");
    videoEl.preload = "metadata";
    videoEl.onloadedmetadata = ()=>{
      const duration = videoEl.duration;
      URL.revokeObjectURL(url);
      if(duration && isFinite(duration) && duration > maxDurationSec){
        reject(new Error(`Vidéo trop longue (${Math.round(duration)}s, max ${maxDurationSec}s). Coupe-la avant de l'envoyer.`));
        return;
      }
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error("Impossible de lire cette vidéo."));
      reader.onload = ()=> resolve(reader.result);
      reader.readAsDataURL(file);
    };
    videoEl.onerror = ()=>{
      URL.revokeObjectURL(url);
      reject(new Error("Impossible de lire cette vidéo."));
    };
    videoEl.src = url;
  });
}

      this.hideSplash();
      setTimeout(()=>toast("⚠️ Connexion à la base de données impossible. Vérifie la configuration Firebase en haut du fichier, ou recharge la page."), 800);
      return;
    }
    // Téléchargements : ici (site normal, hors artefact Claude) on peut télécharger un fichier
    // directement dans le navigateur.
    this.downloads = {
      save: async ({filename, data})=>{
        const a = document.createElement("a");
        a.href = data; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
      }
    };
    this.dbReady = true;
    // Filet de sécurité : si jamais la toute première réponse de Firestore tarde
    // (réseau capricieux...), on n'affiche pas le logo de connexion indéfiniment.
    setTimeout(()=>this.hideSplash(), 6000);
    // On demande au navigateur de ne pas effacer le stockage de cet appareil (ta session de connexion,
    // le mode capitaine...) en cas de manque de place — best-effort, pas garanti partout.
    try{
      if(navigator.storage && navigator.storage.persist){
        navigator.storage.persist().catch(()=>{});
      }
    }catch(e){}

    db.doc("team/info").onSnapshot(snap=>{
      this.state.info = snap.exists ? snap.data() : this.defaultInfo();
      this.render();
      this.hideSplash();
      if(snap.exists && this.state.info.teamALogo===undefined && !this._logoMigrated){
        this._logoMigrated = true;
        db.doc("team/info").update({teamALogo: LOGO_A_DEFAULT, teamBLogo: LOGO_B_DEFAULT}).catch(()=>{});
      }
    }, ()=>{this.hideSplash();});

    db.collection("players").onSnapshot(qs=>{
      this.state.players = qs.docs.map(d=>({id:d.id, ...d.data()}));
      this.render();
    }, ()=>{});

    db.collection("competitions").orderBy("createdAt","desc").onSnapshot(qs=>{
      this.state.competitions = qs.docs.map(d=>({id:d.id, ...d.data()}));
      this.render();
    }, ()=>{});

    db.collection("media").onSnapshot(qs=>{
      this.state.media = qs.docs.map(d=>({id:d.id, ...d.data()}));
      this.render();
    }, ()=>{});

    db.collection("stories").onSnapshot(qs=>{
      this.state.stories = qs.docs.map(d=>({id:d.id, ...d.data()}));
      this.render();
    }, ()=>{});

    db.collection("matches").onSnapshot(qs=>{
      this.state.matches = qs.docs.map(d=>({id:d.id, ...d.data()}));
      this.render();
    }, ()=>{});

    db.collection("consents").onSnapshot(qs=>{
      this.state.consents = qs.docs.map(d=>({id:d.id, ...d.data()}));
      this.render();
    }, ()=>{});

    db.collection("accounts").onSnapshot(qs=>{
      this.state.accounts = qs.docs.map(d=>({id:d.id, ...d.data()}));
      this.render();
    }, ()=>{});

    db.collection("messages").orderBy("createdAt","asc").onSnapshot(qs=>{
      this.state.messages = qs.docs.map(d=>({id:d.id, ...d.data()}));

  BACKUP_COLLECTIONS: ["players","competitions","media","stories","matches","consents","accounts","messages","events","posts","bets"],
  async exportAllShared(){
    const out = {};
    const infoSnap = await this.db.doc("team/info").get();
    out["team/info"] = infoSnap.exists ? infoSnap.data() : null;
    for(const coll of this.BACKUP_COLLECTIONS){
      const qs = await this.db.collection(coll).get();
      out[coll] = {};
      qs.docs.forEach(d=>{ out[coll][d.id] = d.data(); });
    }
    return out;
  },
  async importAllShared(data){
    if(data["team/info"]){ await this.db.doc("team/info").set(data["team/info"]); }
    for(const coll of this.BACKUP_COLLECTIONS){
      const docs = data[coll] || {};
      for(const id of Object.keys(docs)){
        await this.db.collection(coll).doc(id).set(docs[id]);
      }
    }
  },
  async exportLocalData(){
    if(!this.db){ toast("Export indisponible"); return; }
    toast("Préparation de l'export...");
    const data = await this.exportAllShared();
    const json = JSON.stringify(data, null, 2);
    const filename = "vestiaire-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";
    if(this.downloads){
      try{
        const blob = "data:application/json;base64,"+btoa(unescape(encodeURIComponent(json)));
        await this.downloads.save({filename, data: blob});
        toast("Sauvegarde téléchargée");
        return;
      }catch(e){ /* bascule sur le code à copier ci-dessous */ }
    }
    this.modal(`
      <h3>📤 Exporter les données</h3>
      <p class="muted" style="font-size:12.5px;margin-top:-4px;">Copie ce code et garde-le quelque part (Notes, message à toi-même...) : il te servira à restaurer les données via "Importer une sauvegarde".</p>
      <textarea id="exportBox" readonly style="width:100%;min-height:140px;font-size:11px;font-family:monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:inherit;" onclick="this.select()">${esc(json)}</textarea>
      <button class="btn btn-accent btn-block" style="margin-top:10px;" onclick="App.copyExportBox()">📋 Copier le code</button>
    `);
    setTimeout(()=>{ const el=document.getElementById("exportBox"); if(el) el.select(); }, 50);
  },
  async copyExportBox(){
    const el = document.getElementById("exportBox");
    if(!el) return;
    el.select();
    el.setSelectionRange(0, el.value.length);
    try{
      await navigator.clipboard.writeText(el.value);
      toast("Code copié !");
    }catch(e){
      try{ document.execCommand("copy"); toast("Code copié !"); }
      catch(e2){ toast("Sélectionne le texte puis copie-le manuellement"); }
    }
  },
  openImportLocalData(){
    this.modal(`
      <h3>📥 Importer une sauvegarde</h3>
      <p class="muted" style="font-size:12.5px;margin-top:-4px;">⚠️ Ça va écraser les données correspondantes pour tout le monde (base partagée). Colle ci-dessous un code obtenu avec "Exporter les données", ou choisis un fichier.</p>
      <textarea id="importBox" placeholder="Colle ici le code de sauvegarde..." style="width:100%;min-height:140px;font-size:11px;font-family:monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:inherit;"></textarea>
      <button class="btn btn-accent btn-block" style="margin-top:10px;" onclick="App.importLocalDataFromText()">Importer ce code</button>
      <hr class="sep">
      <label class="btn btn-outline btn-block" style="text-align:center;cursor:pointer;">
        📁 Ou importer depuis un fichier .json
        <input type="file" accept="application/json" style="display:none;" onchange="App.importLocalData(this)">
      </label>
    `);
  },
  importLocalDataFromText(){
    const el = document.getElementById("importBox");
    const raw = el ? el.value.trim() : "";
    if(!raw){ toast("Colle d'abord un code de sauvegarde"); return; }
    this._applyImportedJson(raw);
  },
  importLocalData(inputEl){
    const file = inputEl.files && inputEl.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ this._applyImportedJson(reader.result); };
    reader.onerror = ()=>toast("Impossible de lire ce fichier");
    reader.readAsText(file);
  },
  async _applyImportedJson(raw){
    let data;
    try{
      data = JSON.parse(raw);
      if(!data || typeof data!=="object") throw new Error("format invalide");
    }catch(e){
      toast("Code ou fichier invalide, import annulé");
      return;
    }
    if(!confirm("Importer cette sauvegarde va écraser les données correspondantes pour tout le monde (base partagée). Continuer ?")) return;
    try{
      await this.importAllShared(data);
      this.closeModal();
      toast("Sauvegarde importée");
    }catch(e){
      toast("Échec de l'import");
    }
  },

          <div class="logo">${brandLogo? `<img src="${brandLogo}" alt="" style="width:32px;height:32px;border-radius:${myBrandTeam?'50%':'6px'};object-fit:cover;vertical-align:middle;">` : esc(info.logoEmoji||"⚽")}</div>
          <div class="name">${esc(brandName)}</div>
          ${(()=>{
            if(!this.me) return "";
            const acc = this.state.accounts.find(a=>a.username===this.me);
            if(!acc) return "";
            return `<div class="who" onclick="App.goTab(8)" title="Voir mes paris et mon salaire">💰 ${this.formatMarketValue(acc.wallet||0)}</div>`;
          })()}
          <div class="who" onclick="App.openAccountMenu()">${this.me? "👤 "+esc(this.me) : "👤 Connexion"}</div>
          <button class="adminbtn ${this.admin?'on':''}" onclick="App.openAdminGate()" title="Mode capitaine">${this.admin?'🛡️':'🔒'}</button>
        </div>
        <div class="tabs">
          ${tabs.map(t=>`
            <button class="tab ${this.tab===t.n?'active':''}" onclick="App.goTab(${t.n})">
              <span class="ic">${t.ic}</span><span class="lb">${t.lb}</span>
            </button>`).join("")}
        </div>
      </div>
      <div class="view">
        ${!this.dbReady ? this.renderNoDb() : this.renderTab(this.tab)}
      </div>
    `;
    if(this.tab===6){
      const sc = document.getElementById("chatScroll");
      if(sc) sc.scrollTop = sc.scrollHeight;
    }
  },

  renderNoDb(){
    return `<div class="card">
      <h3>⏳ Connexion à l'espace d'équipe…</h3>
      <p class="muted" style="font-size:13.5px;">Si ce message reste affiché, la connexion à la base de données Firebase a échoué. Vérifie que la configuration Firebase (tout en haut du fichier index.html) est bien complète et correcte, que la base Firestore a été créée dans la console Firebase, et que tu as bien une connexion internet, puis recharge la page.</p>
    </div>`;
  },

  renderTab(n){
    if(n===1) return this.renderRules();
    if(n===2) return this.renderMedia();
    if(n===3) return this.renderRecruits();
    if(n===4) return this.renderStatsTab();
    if(n===5) return this.renderMatchesTab();
    if(n===6) return this.renderMessages();
    if(n===7) return this.renderPlanningTab();
    if(n===8) return this.renderParisTab();
    return "";
  },

  /* ============================= TAB 1 : Règles & Consentement ============================= */
  renderRules(){
    const info = this.state.info || this.defaultInfo();
    const consents = this.state.consents;
    const mine = this.me ? consents.find(c=>c.id===slugify(this.me)) : null;
    const editing = this.state.editingRules;
    return `
      <div class="card">
        <div class="section-title">
          <h2 style="margin:0;">📜 Règlement</h2>
          ${this.admin ? `<button class="btn btn-ghost btn-sm" onclick="App.toggleEditRules()">${editing? '✕ Fermer':'✏️ Modifier'}</button>` : ""}
        </div>
        ${editing ? `
          <textarea id="reglementInput" rows="10">${esc(info.reglement)}</textarea>
          <button class="btn btn-accent btn-block" style="margin-top:10px;" onclick="App.saveRules()">Enregistrer le règlement</button>
        ` : `<div class="rules-text">${esc(info.reglement)}</div>`}
      </div>

      <div class="card">
        <h2>⚽ Règles du foot (pour nous)</h2>
        ${editing ? `
          <textarea id="reglesFootInput" rows="14">${esc(info.reglesFoot||this.defaultInfo().reglesFoot)}</textarea>
          <button class="btn btn-accent btn-block" style="margin-top:10px;" onclick="App.saveReglesFoot()">Enregistrer les règles du foot</button>
        ` : `<div class="rules-text">${esc(info.reglesFoot||this.defaultInfo().reglesFoot)}</div>`}
      </div>

      <div class="card">
        <h2>🩹 Décharge de responsabilité</h2>
        ${editing ? `
          <textarea id="dechargeInput" rows="7">${esc(info.decharge)}</textarea>
          <button class="btn btn-accent btn-block" style="margin-top:10px;" onclick="App.saveDecharge()">Enregistrer la décharge</button>
        ` : `<div class="rules-text">${esc(info.decharge)}</div>`}
      </div>

      <div class="card consent-box">
        <h3 style="margin-top:0;">✅ Consentement du joueur</h3>
        <label class="checkline">
          <input type="checkbox" id="consentCheck" ${mine? "checked":""} onchange="App.toggleConsent(this.checked)">
          <span>J'accepte le règlement et je reconnais participer sous ma propre responsabilité en cas de blessure ou d'accident.</span>
        </label>
        ${mine ? `
          <p class="muted" style="font-size:12px;">Enregistré le ${new Date(mine.acceptedAt).toLocaleDateString("fr-FR")} pour ${esc(mine.name)}.</p>
          <button class="btn btn-soft btn-block" onclick="App.exportMyDecharge()">📄 Télécharger mon attestation (PDF)</button>
        ` : `<p class="muted" style="font-size:12px;margin-bottom:0;">Connecte-toi (en haut) puis coche la case : c'est ce qui enregistre ton accord.</p>`}
      </div>

      <div class="card">
        <div class="section-title">
          <h3 style="margin:0;">Joueurs ayant validé (${consents.length})</h3>
          ${this.admin && consents.length ? `<button class="btn btn-ghost btn-sm" onclick="App.exportAllConsents()">📄 Export PDF</button>` : ""}
        </div>
        ${consents.length===0 ? `<div class="empty"><span class="e-ic">🫥</span>Personne n'a encore validé.</div>` :
          consents.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`
            <div class="consent-list-item"><span>${esc(c.name)}</span><span class="muted">${new Date(c.acceptedAt).toLocaleDateString("fr-FR")}</span></div>
          `).join("")}
      </div>
    `;
  },
  toggleEditRules(){ this.state.editingRules = !this.state.editingRules; this.render(); },
  async saveRules(){
    const v = document.getElementById("reglementInput").value;
    await this.db.doc("team/info").set({...(this.state.info||this.defaultInfo()), reglement:v});
    toast("Règlement mis à jour");
  },
  async saveDecharge(){
    const v = document.getElementById("dechargeInput").value;
    await this.db.doc("team/info").set({...(this.state.info||this.defaultInfo()), decharge:v});
    toast("Décharge mise à jour");
  },
  async saveReglesFoot(){
    const v = document.getElementById("reglesFootInput").value;
    await this.db.doc("team/info").set({...(this.state.info||this.defaultInfo()), reglesFoot:v});
    toast("Règles du foot mises à jour");
  },
  toggleConsent(checked){
    this.ensureMe(async (name)=>{
      const id = slugify(name);
      if(checked){
        await this.db.collection("consents").doc(id).set({name, acceptedAt:new Date().toISOString()});
        toast("Merci "+name+", ton accord est enregistré ✅");
      } else {
        await this.db.collection("consents").doc(id).delete();
      }
      this.render();
    });
  },
  pdfMaker(){
    if(!window.jspdf){ toast("Génération PDF indisponible"); return null; }
    const { jsPDF } = window.jspdf;
    return new jsPDF();
  },
  async exportMyDecharge(){
    const info = this.state.info || this.defaultInfo();
    const consents = this.state.consents;
    const mine = consents.find(c=>c.id===slugify(this.me||""));
    if(!mine){ toast("Coche d'abord la case de consentement"); return; }
    const doc = this.pdfMaker(); if(!doc) return;
    doc.setFontSize(18); doc.text(info.teamName||"Mon Équipe", 14, 18);
    doc.setFontSize(13); doc.text("Attestation de consentement", 14, 27);
    doc.setFontSize(10); doc.setTextColor(90);
    doc.text(doc.splitTextToSize(info.decharge||"", 180), 14, 38);
    doc.setTextColor(20); doc.setFontSize(11);
    const y = 38 + doc.splitTextToSize(info.decharge||"", 180).length*5 + 10;
    doc.text(`Joueur : ${mine.name}`, 14, y);
    doc.text(`Accepté le : ${new Date(mine.acceptedAt).toLocaleDateString("fr-FR")}`, 14, y+7);
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text("Document généré automatiquement depuis l'application d'équipe.", 14, y+20);
    try{
      const blob = doc.output("blob");
      if(this.downloads){ await this.downloads.save({filename:`decharge-${slugify(mine.name)}.pdf`, data:blob}); toast("PDF téléchargé"); }
      else toast("Téléchargement indisponible ici");
    }catch(e){ if(!(e&&e.code==="declined")) toast("Impossible de générer le PDF"); }
  },
  async exportAllConsents(){
    const info = this.state.info || this.defaultInfo();
    const consents = this.state.consents.slice().sort((a,b)=>a.name.localeCompare(b.name));
    const doc = this.pdfMaker(); if(!doc) return;
    doc.setFontSize(18); doc.text(info.teamName||"Mon Équipe", 14, 18);
    doc.setFontSize(13); doc.text("Liste des consentements", 14, 27);
    doc.setFontSize(10);
    let y = 38;
    consents.forEach((c,i)=>{
      doc.text(`${i+1}. ${c.name} — accepté le ${new Date(c.acceptedAt).toLocaleDateString("fr-FR")}`, 14, y);
      y += 7;
      if(y>280){ doc.addPage(); y=20; }
    });
    try{
      const blob = doc.output("blob");
      if(this.downloads){ await this.downloads.save({filename:"consentements.pdf", data:blob}); toast("PDF téléchargé"); }
      else toast("Téléchargement indisponible ici");
    }catch(e){ if(!(e&&e.code==="declined")) toast("Impossible de générer le PDF"); }
  },

  /* ============================= TAB 2 : Médias & Stories ============================= */
  refOptions(){
    const matchOpts = this.state.matches.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))
      .map(m=>({value:`match:${m.id}`, label:`⚽ ${m.opponent?('vs '+m.opponent):'Match'} · ${fmtDateShort(m.date)}`}));
    const eventOpts = this.state.events.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))
      .map(e=>({value:`event:${e.id}`, label:`${this.eventIcon(e.type)} ${e.title||this.eventLabel(e.type)} · ${fmtDateShort(e.date)}`}));
    return [...matchOpts, ...eventOpts];
  },
  refLabel(ref){
    if(!ref) return "";
    const [type,id] = ref.split(":");
    if(type==='match'){ const m=this.state.matches.find(x=>x.id===id); return m? `⚽ ${m.opponent?('vs '+m.opponent):'Match'} · ${fmtDateShort(m.date)}` : ""; }
    if(type==='event'){ const e=this.state.events.find(x=>x.id===id); return e? `${this.eventIcon(e.type)} ${e.title||this.eventLabel(e.type)} · ${fmtDateShort(e.date)}` : ""; }
    return "";
  },
  viewMediaFor(refType, refId){
    this.state.mediaFilter.ref = `${refType}:${refId}`;
    this.state.mediaFilter.category = "all";
    this.state.mediaFilter.comp = "all";
    this.tab = 2;
    window.scrollTo(0,0);
    this.render();
  },
  /* ---------- Récompenses de saison : Ballon d'Or (top 10), Pire Joueur (top 5), Pire Action (top 10) ---------- */
  awardConfig:{
    ballonDor:{icon:"🏆", title:"Ballon d'Or", verb:"les meilleurs joueurs de la saison", rankSize:10, theme:"gold"},
    pireJoueur:{icon:"🤡", title:"Pire Joueur", verb:"les pires joueurs de la saison", rankSize:5, theme:"danger"},
    pireAction:{icon:"🙈", title:"Pire Action de la saison", verb:"les pires actions de la saison", rankSize:10, theme:"danger"},
  },
  rankMedal(i){ return ['🥇','🥈','🥉'][i] || (i+1)+"."; },
  effectiveRankSize(key){
    // Le Ballon d'Or classe tout l'effectif de NOTRE équipe (jusqu'à 30 joueurs) pour que le ratio
    // position/effectif soit cohérent ; les autres récompenses gardent leur taille fixe (top 5, top
    // 10...). Ces récompenses ("meilleurs/pires joueurs de LA SAISON") ne concernent que notre propre
    // équipe (équipe A) — l'effectif de l'équipe adverse (équipe B, suivie pour le comparateur ⚔️) ne
    // doit pas compter dans ce total, sinon le Ballon d'Or se classait sur 30 joueurs au lieu de 17.
    if(key==='ballonDor') return Math.max(1, Math.min(30, this.state.players.filter(p=>p.team!=='B').length || 1));
    return this.awardConfig[key].rankSize;
  },
  awardPoints(votes, rankSize){
    const tally = {};
    Object.values(votes||{}).forEach(list=>{
      (list||[]).forEach((name,i)=>{
        if(!name) return;
        const pts = rankSize - i;
        if(pts>0) tally[name] = (tally[name]||0) + pts;
      });
    });
    return tally;
  },
  renderAwardSection(key){
    const cfg = this.awardConfig[key];
    const rankSize = this.effectiveRankSize(key);
    const info = this.state.info || this.defaultInfo();
    const aw = (info.awards && info.awards[key]) || {active:false, season:"", votes:{}, podium:null};
    const tally = this.awardPoints(aw.votes, rankSize);
    const ranking = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    const totalVotes = Object.values(aw.votes||{}).length;
    const myVote = this.me ? (aw.votes||{})[slugify(this.me)] : null;
    const podium = aw.podium || null;
    const grad = cfg.theme==='gold' ? 'var(--gold-soft)' : 'var(--danger-soft)';
    return `
    <div class="card" style="background:linear-gradient(135deg,${grad},transparent);">
      <div class="section-title"><h2 style="margin:0;">${cfg.icon} ${esc(cfg.title)}</h2></div>
      ${!aw.active && !podium ? `
        <p class="muted" style="font-size:12.5px;">Aucun vote en cours pour le moment.</p>
        ${this.admin? `<button class="btn btn-accent btn-block" onclick="App.openAwardLaunch('${key}')">Lancer un vote</button>` : ""}
      ` : ""}
      ${aw.active ? `
        <p class="muted" style="font-size:13px;margin-top:-4px;">${esc(aw.season||"")} · ${totalVotes} vote${totalVotes>1?'s':''}${myVote? " · Tu as voté":""}</p>
        <p class="muted" style="font-size:12px;margin:4px 0 8px;">Classe le top ${rankSize} pour ${esc(cfg.verb)}.${key==='ballonDor'? " Le classement final influence la note générale de chaque joueur : mieux classé = note qui monte, mal classé ou pas classé du tout = note qui baisse.":""}</p>
        <button class="btn btn-soft btn-block" onclick="App.openAwardBallot('${key}')">${myVote?"✏️ Modifier mon classement":"🗳️ Voter"}</button>
        ${this.admin && ranking.length ? `
          <hr class="sep">
          <p class="muted" style="font-size:11.5px;margin-bottom:4px;">Classement provisoire (visible capitaine uniquement) :</p>
          ${ranking.slice(0,rankSize).map(([n,pts],i)=>`<div class="kv" style="border:none;"><span>${this.rankMedal(i)} ${esc(n)}</span><b>${pts} pts</b></div>`).join("")}
        ` : ""}
        ${this.admin? `<button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="App.closeAward('${key}')">🔒 Clôturer le vote et afficher le classement</button>`:""}
      ` : ""}
      ${!aw.active && podium ? `
        ${esc(aw.season||"")? `<p class="muted" style="font-size:11.5px;margin-top:-4px;">${esc(aw.season)}</p>`:""}
        ${podium.map((n,i)=> n? `<div class="kv" style="border:none;"><span>${this.rankMedal(i)}</span><b>${esc(n)}</b></div>`:"").join("")}
        ${this.admin? `<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="App.openAwardLaunch('${key}')">🔄 Lancer un nouveau vote</button>`:""}
      ` : ""}
    </div>`;
  },
  openAwardLaunch(key){
    const cfg = this.awardConfig[key];
    const rankSize = this.effectiveRankSize(key);
    const info = this.state.info || this.defaultInfo();
    const aw = (info.awards && info.awards[key]) || {};
    this.modal(`
      <h3>${cfg.icon} Lancer un vote ${esc(cfg.title)}</h3>
      <label class="field">Saison / période <input type="text" id="awSeason" value="${esc(aw.season||"")}" placeholder="ex: Saison 2025-2026"></label>
      <p class="muted" style="font-size:12px;">Chaque membre classera le top ${rankSize} pour ${esc(cfg.verb)}. Un nouveau vote remplace le précédent (l'historique garde les anciens classements).</p>
      <button class="btn btn-accent btn-block" onclick="App.startAward('${key}')">Lancer le vote</button>
    `);
  },
  async startAward(key){
    const season = document.getElementById("awSeason").value.trim() || "Saison en cours";
    const info = this.state.info || this.defaultInfo();
    const awards = {...(info.awards||{}), [key]:{active:true, season, votes:{}, podium:null}};
    await this.db.doc("team/info").set({...info, awards});
    this.closeModal();
    toast("Vote lancé");
  },
  openAwardBallot(key){
    const cfg = this.awardConfig[key];
    const rankSize = this.effectiveRankSize(key);
    const info = this.state.info || this.defaultInfo();
    const aw = (info.awards && info.awards[key]) || {active:true, season:"", votes:{}, podium:null};
    const myVote = this.me ? (aw.votes||{})[slugify(this.me)] : null;
    // Ces récompenses ne portent que sur notre équipe : on ne propose pas les joueurs de l'équipe
    // adverse (équipe B) dans la liste des candidats, sinon on pourrait voter "Ballon d'Or" pour un
    // joueur de FC Nulos.
    const opt = (selectedName)=> `<option value="">—</option>` + this.state.players.filter(p=>p.team!=='B').map(p=>`<option value="${esc(p.name)}" ${selectedName===p.name?'selected':''}>${esc(p.name)}</option>`).join("");
    const rows = [];
    for(let i=0;i<rankSize;i++){
      rows.push(`<label class="field">${this.rankMedal(i)} ${i+1}${i<3?'':'e'} choix <select id="awr${i}">${opt(myVote&&myVote[i])}</select></label>`);
    }
    this.modal(`
      <h3>${cfg.icon} Mon classement — ${esc(cfg.title)}</h3>
      <p class="muted" style="font-size:12px;margin-top:-4px;">Classe jusqu'à ${rankSize} joueurs différents (tu peux en laisser certains vides).</p>
      <div style="max-height:60vh;overflow-y:auto;">${rows.join("")}</div>
      <button class="btn btn-accent btn-block" onclick="App.submitAwardBallot('${key}')">Enregistrer mon classement</button>
    `);
  },
  submitAwardBallot(key){
    const rankSize = this.effectiveRankSize(key);
    const list = [];
    for(let i=0;i<rankSize;i++){ list.push(document.getElementById("awr"+i).value || null); }
    const filled = list.filter(Boolean);
    if(filled.length===0){ toast("Choisis au moins un joueur"); return; }
    if(new Set(filled).size !== filled.length){ toast("Choisis des joueurs différents à chaque rang"); return; }
    this.ensureMe(async (me)=>{
      const info = this.state.info || this.defaultInfo();
      const aw = (info.awards && info.awards[key]) || {active:true, season:"", votes:{}, podium:null};
      const votes = {...(aw.votes||{}), [slugify(me)]: list};
      const awards = {...(info.awards||{}), [key]:{...aw, votes}};
      await this.db.doc("team/info").set({...info, awards});
      this.closeModal();
      toast("Classement enregistré");
    });
  },
  async closeAward(key){
    const rankSize = this.effectiveRankSize(key);
    const info = this.state.info || this.defaultInfo();
    const aw = (info.awards && info.awards[key]) || {active:false, season:"", votes:{}, podium:null};
    const tally = this.awardPoints(aw.votes, rankSize);
    const ranking = Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
    const podium = []; for(let i=0;i<rankSize;i++) podium.push(ranking[i]||null);
    const historyAll = info.awardsHistory || {};
    const history = (historyAll[key]||[]).slice();
    if(podium[0]) history.push({season: aw.season||"Saison", podium, date:new Date().toISOString()});
    const awards = {...(info.awards||{}), [key]:{active:false, season:aw.season, votes:aw.votes||{}, podium}};
    const awardsHistory = {...historyAll, [key]:history};
    await this.db.doc("team/info").set({...info, awards, awardsHistory});
    toast(podium[0]? "Classement désigné" : "Aucun vote reçu, pas de résultat désigné");
  },
  /* ---------- Actus : posts texte & sondages (façon fil d'actu) ---------- */
  renderPostsFeed(){
    const posts = this.state.posts.filter(p=>!p.draft).slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    // Les résumés de match auto-générés restent en brouillon (invisibles de tout le monde) tant qu'aucune
    // photo n'a été ajoutée — seuls les capitaines les voient ici, pour compléter et publier.
    const drafts = this.admin ? this.state.posts.filter(p=>p.draft) : [];
    return `
    <div class="card">
      <div class="section-title">
        <h2 style="margin:0;">📰 Actus</h2>
        ${this.admin? `<button class="btn btn-accent btn-sm" onclick="App.openNewPost()">+ Publier</button>` : ""}
      </div>
      ${drafts.length? `
        <div style="background:var(--surface-2);border-radius:10px;padding:10px;margin-bottom:12px;">
          <p style="font-size:12.5px;font-weight:700;margin:0 0 6px;">🕒 En attente d'une photo pour publier (${drafts.length})</p>
          ${drafts.map(d=>this.renderDraftMatchRecapRow(d)).join("")}
        </div>
      `:""}
      ${posts.length===0 ? `<div class="empty"><span class="e-ic">📰</span>Aucune publication pour l'instant.</div>` :
        posts.map(p=>this.renderPostCard(p)).join("")}
    </div>`;
  },
  renderDraftMatchRecapRow(d){
    return `<div class="presence-row">
      <span class="nm">⚽ ${this.teamLogoTag('A',13)}${this.teamLogoTag('B',13)} ${d.score?d.score.us:'–'} - ${d.score?d.score.them:'–'}${d.opponent?" vs "+esc(d.opponent):""}</span>
      <button class="pbtn" onclick="App.openPublishMatchRecap('${d.id}')">📸 Ajouter la photo & publier</button>
      <button class="pbtn" onclick="App.deletePost('${d.id}')">🗑️</button>
    </div>`;
  },
  renderPollOptions(p){
    const totalVotes = Object.keys(p.votes||{}).length;
    const myVoteIdx = this.me && p.votes ? p.votes[slugify(this.me)] : undefined;
    return `
      ${(p.options||[]).map((opt,i)=>{
        const votesForOpt = Object.values(p.votes||{}).filter(v=>v===i).length;
        const pct = totalVotes? Math.round(votesForOpt/totalVotes*100) : 0;
        const mine = myVoteIdx===i;
        return `<div onclick="App.votePoll('${p.id}',${i})" style="position:relative;border:1px solid ${mine?'var(--accent2)':'var(--line)'};border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;overflow:hidden;background:var(--surface-2);">
          <div style="position:absolute;top:0;left:0;bottom:0;width:${pct}%;background:${mine?'var(--accent2-soft)':'var(--surface)'};z-index:0;"></div>
          <div style="position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:${mine?'700':'500'};">
            <span>${mine?'✓ ':''}${esc(opt)}</span><span class="muted">${pct}% (${votesForOpt})</span>

  async saveNewPost(){
    if(!this.admin){ toast("Réservé aux capitaines"); return; }
    const type = document.getElementById("postType").value;
    let payload = null;
    if(type==='text'){
      const text = document.getElementById("postText").value.trim();
      if(!text){ toast("Écris un message"); return; }
      payload = {type:'text', text};
    } else if(type==='poll'){
      const question = document.getElementById("postQuestion").value.trim();
      const options = [0,1,2,3].map(i=>{
        const el = document.getElementById("postOpt"+i);
        return el ? el.value.trim() : "";
      }).filter(Boolean);
      if(!question){ toast("Écris une question"); return; }
      if(options.length<2){ toast("Ajoute au moins 2 options"); return; }
      payload = {type:'poll', question, options, votes:{}};
    } else if(type==='photo'){
      const file = document.getElementById("postPhotoFile").files[0];
      if(!file){ toast("Choisis une photo"); return; }
      const src = await resizeImage(file, 900, 0.65);
      const caption = document.getElementById("postPhotoCaption").value.trim();
      payload = {type:'photo', src, caption};
    } else if(type==='video'){
      const file = document.getElementById("postVideoFile").files[0];
      if(!file){ toast("Choisis une vidéo"); return; }
      let src;
      try{
        src = await readVideoFile(file);
      } catch(err){
        toast(err.message || "Vidéo invalide");
        return;
      }
      const caption = document.getElementById("postVideoCaption").value.trim();
      payload = {type:'video', src, caption};
    }
    this.ensureMe(async (me)=>{
      const identityValue = document.getElementById("postIdentity")?.value;
      const identity = this.resolvePostIdentity(identityValue, me);
      const taggedPlayer = document.getElementById("postTagPlayer")?.value || "";
      await this.db.collection("posts").add({
        ...payload, ...identity, taggedPlayer, postedBy: me, likes:{}, comments:[], createdAt:new Date().toISOString()
      });
      this.closeModal();
      toast("Publié !");
    });
  },
  async deletePost(id){
    await this.db.collection("posts").doc(id).delete();
    this.closeLightbox();
    toast("Publication supprimée");
  },
  // Seul l'auteur d'une publication (ou un capitaine) peut la corriger après coup — pratique en cas de
  // faute de frappe ou d'erreur. Les publications automatiques (transferts) ne sont pas éditables, et
  // pour un sondage on ne permet de corriger que la question : changer les options après coup fausserait
  // les votes déjà enregistrés (qui pointent vers une position dans la liste des options).
  openEditPost(id){
    const p = this.state.posts.find(x=>x.id===id);
    if(!p){ toast("Publication introuvable"); return; }
    if(p.type==='transfer'){ toast("Cette publication automatique ne peut pas être modifiée"); return; }
    if(!(this.admin || (this.me && (p.postedBy||p.author)===this.me))){ toast("Tu ne peux modifier que tes propres publications"); return; }
    const knownIdentityKinds = ['club-A','club-B','media', ...Object.keys(this.AWARD_IDENTITIES)];
    const currentIdentity = knownIdentityKinds.includes(p.authorKind) ? p.authorKind : 'personal';
    const currentTagPlayer = p.taggedPlayer || '';
    let fields = "";
    if(p.type==='text'){
      fields = `<label class="field">Message <textarea id="editPostText" rows="4">${esc(p.text||"")}</textarea></label>`;
    } else if(p.type==='poll'){
      fields = `<label class="field">Question <input type="text" id="editPostQuestion" value="${esc(p.question||"")}"></label>
        <p class="muted" style="font-size:11.5px;margin-top:-6px;">Les options ne peuvent pas être changées une fois publiées, pour ne pas fausser les votes déjà enregistrés.</p>`;
    } else if(p.type==='photo' || p.type==='video'){
      fields = `<label class="field">Légende <textarea id="editPostCaption" rows="3">${esc(p.caption||"")}</textarea></label>
        ${this.renderPostIdentitySelect('editPostIdentity', currentIdentity)}
        ${this.renderPostTagPlayerSelect('editPostTagPlayer', currentTagPlayer)}`;
    } else if(p.type==='matchrecap'){
      fields = `<label class="field">Photo ${p.photo?"(laisser vide pour garder l'actuelle)":"(optionnel)"} <input type="file" id="editPostPhoto" accept="image/*"></label>
        <label class="field">Légende (optionnel) <textarea id="editPostCaption" rows="2">${esc(p.caption||"")}</textarea></label>
        ${this.renderPostIdentitySelect('editPostIdentity', currentIdentity)}
        ${this.renderPostTagPlayerSelect('editPostTagPlayer', currentTagPlayer)}`;
    } else if(p.type==='recruit'){
      fields = `<label class="field">Photo ${p.photo?"(laisser vide pour garder l'actuelle)":"(optionnel)"} <input type="file" id="editPostPhoto" accept="image/*"></label>
        ${this.renderPostIdentitySelect('editPostIdentity', currentIdentity)}
        ${this.renderPostTagPlayerSelect('editPostTagPlayer', currentTagPlayer)}`;
    }
    this.modal(`
      <h3>✏️ Modifier la publication</h3>
      ${fields}
      <button class="btn btn-accent btn-block" onclick="App.saveEditPost('${id}')">Enregistrer</button>
    `);
  },
  async saveEditPost(id){
    const p = this.state.posts.find(x=>x.id===id);
    if(!p) return;
    const updates = {editedAt:new Date().toISOString()};
    if(p.type==='text'){
      const text = document.getElementById("editPostText").value.trim();
      if(!text){ toast("Écris un message"); return; }
      updates.text = text;
    } else if(p.type==='poll'){
      const question = document.getElementById("editPostQuestion").value.trim();
      if(!question){ toast("Écris une question"); return; }
      updates.question = question;
    } else if(p.type==='photo' || p.type==='video'){
      updates.caption = document.getElementById("editPostCaption").value.trim();
    } else if(p.type==='matchrecap' || p.type==='recruit'){
      const file = document.getElementById("editPostPhoto")?.files[0];
      if(file) updates.photo = await resizeImage(file, 900, 0.65);
      const capEl = document.getElementById("editPostCaption");
      if(capEl) updates.caption = capEl.value.trim();
    }
    const identityEl = document.getElementById("editPostIdentity");
    if(identityEl) Object.assign(updates, this.resolvePostIdentity(identityEl.value, p.postedBy||this.me));
    const tagEl = document.getElementById("editPostTagPlayer");
    if(tagEl) updates.taggedPlayer = tagEl.value || "";
    await this.db.collection("posts").doc(id).update(updates);
    this.closeModal();
    this.refreshPostDetailIfOpen(id);
    toast("Publication modifiée");
  },

  // Stories actives (< 1 semaine), regroupées par auteur — façon Instagram : un seul rond par personne
  // dans le bandeau, même si elle a posté plusieurs stories, et on peut défiler d'une story à l'autre de
  // la même personne sans ressortir (voir openStoryViewer). Chaque groupe est trié de la plus ancienne à
  // la plus récente (ordre de lecture), et les groupes eux-mêmes du plus récemment actif au moins récent.
  activeStoryGroups(){
    const now = Date.now();
    const STORY_LIFETIME_MS = 7*24*3600*1000;
    const active = this.state.stories.filter(s=> s.approved!==false && (now - new Date(s.createdAt).getTime()) < STORY_LIFETIME_MS);
    const byAuthor = {};
    active.forEach(s=>{
      const key = s.author||"?";
      if(!byAuthor[key]) byAuthor[key] = [];
      byAuthor[key].push(s);
    });
    const groups = Object.entries(byAuthor).map(([author,stories])=>{
      stories.sort((a,b)=> (a.createdAt||"").localeCompare(b.createdAt||""));
      return {author, stories, latest: stories[stories.length-1].createdAt};
    });
    groups.sort((a,b)=> (b.latest||"").localeCompare(a.latest||""));
    return groups;
  },

  renderMedia(){
    const f = this.state.mediaFilter;
    let items = this.state.media.filter(m=>m.approved!==false);
    if(f.comp!=="all") items = items.filter(m=>m.competitionId===f.comp);
    if(f.category && f.category!=="all") items = items.filter(m=>(m.category||"match")===f.category);
    if(f.ref && f.ref!=="all") items = items.filter(m=>m.ref===f.ref);
    if(f.favOnly) items = items.filter(m=>m.favorite);
    items.sort((a,b)=> f.sort==="desc" ? (b.date||"").localeCompare(a.date||"") : (a.date||"").localeCompare(b.date||""));

    // Les stories restent visibles 1 semaine (contre 24h avant) — les Actus, elles, ne sont jamais
    // filtrées par date : une publication reste affichée tant qu'elle n'est pas supprimée.
    const storyGroups = this.activeStoryGroups();
    const pendingMedia = this.state.media.filter(m=>m.approved===false);
    const pendingStories = this.state.stories.filter(s=>s.approved===false);

    return `
      <div class="card">
        <div class="section-title"><h2 style="margin:0;">📸 Stories</h2></div>
        <div class="stories-strip">
          <div class="story-item" onclick="App.openAddStory()">

            <div class="story-name">Ajouter</div>
          </div>
          ${storyGroups.map(g=>{
            const last = g.stories[g.stories.length-1];
            return `
            <div class="story-item" onclick="App.openStoryViewer('${jsa(g.author)}',0)">
              <div class="story-ring" style="position:relative;">
                ${last.type==='photo'?`<img src="${last.src}">`:`<div class="ph">▶️</div>`}
                ${g.stories.length>1? `<span style="position:absolute;bottom:-2px;right:-2px;background:var(--accent2);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);">${g.stories.length}</span>`:""}

            </div>
          `;}).join("")}
        </div>
      </div>

      ${this.renderPostsFeed()}

      ${this.renderAwardSection('ballonDor')}
      ${this.renderAwardSection('pireJoueur')}
      ${this.renderAwardSection('pireAction')}

      ${this.admin && (pendingMedia.length||pendingStories.length) ? `
        <div class="card">
          <h3 style="margin-top:0;">🕓 En attente de validation</h3>
          ${pendingStories.map(s=>`
            <div class="pending-row">
              ${s.type==='photo'?`<img class="pending-thumb" src="${s.src}">`:`<div class="pending-thumb" style="display:flex;align-items:center;justify-content:center;">▶️</div>`}
              <span style="flex:1;">Story de ${esc(s.author||"?")}</span>
              <button class="btn btn-sm btn-soft" onclick="App.approveItem('story','${s.id}')">✓</button>
              <button class="btn btn-sm btn-danger" onclick="App.rejectItem('story','${s.id}')">✕</button>
            </div>
          `).join("")}
          ${pendingMedia.map(m=>`
            <div class="pending-row">
              ${m.type==='photo'?`<img class="pending-thumb" src="${m.src}">`:`<div class="pending-thumb" style="display:flex;align-items:center;justify-content:center;">▶️</div>`}
              <span style="flex:1;">${esc(m.competitionName||"Média")}</span>
              <button class="btn btn-sm btn-soft" onclick="App.approveItem('media','${m.id}')">✓</button>
              <button class="btn btn-sm btn-danger" onclick="App.rejectItem('media','${m.id}')">✕</button>
            </div>
          `).join("")}
        </div>
      ` : ""}

      <div class="card">
        <div class="section-title">
          <h2 style="margin:0;">🖼️ Médias</h2>
          <button class="btn btn-accent btn-sm" onclick="App.openAddCompetition()">+ Compétition</button>
        </div>
        ${f.ref && f.ref!=="all" ? `
        <div class="kv" style="border:none;background:var(--accent2-soft);border-radius:10px;padding:8px 10px;margin-bottom:8px;">
          <span>📸 Espace : ${esc(this.refLabel(f.ref))}</span>
          <button class="btn btn-ghost btn-sm" onclick="App.setMediaFilter('ref','all')">✕ Tout voir</button>
        </div>` : ""}
        <label class="field" style="margin-bottom:8px;">Filtrer par match / entraînement
          <select onchange="App.setMediaFilter('ref', this.value)">
            <option value="all" ${(!f.ref||f.ref==='all')?'selected':''}>Tous les événements</option>
            ${this.refOptions().map(o=>`<option value="${o.value}" ${f.ref===o.value?'selected':''}>${esc(o.label)}</option>`).join("")}
          </select>
        </label>
        <div class="wrap" style="margin-bottom:8px;">
          <span class="chip ${(f.category||'all')==='all'?'active':''}" onclick="App.setMediaFilter('category','all')">Tout</span>
          <span class="chip ${f.category==='match'?'active':''}" onclick="App.setMediaFilter('category','match')">⚽ Matchs</span>

        </div>
        <div class="wrap" style="margin-bottom:10px;">
          <span class="chip ${f.comp==='all'?'active':''}" onclick="App.setMediaFilter('comp','all')">Toutes compét.</span>
          ${this.state.competitions.map(c=>`<span class="chip ${f.comp===c.id?'active':''}" onclick="App.setMediaFilter('comp','${c.id}')">${esc(c.name)}</span>`).join("")}
        </div>
        <div class="row" style="justify-content:space-between;">
          <span class="chip ${f.favOnly?'active':''}" onclick="App.toggleFavOnly()">⭐ Favoris</span>
          <span class="chip" onclick="App.toggleSort()">${f.sort==='desc'?'↓ Plus récent':'↑ Plus ancien'}</span>

        <button class="btn btn-soft btn-block" style="margin-top:12px;" onclick="App.openAddMedia()">+ Ajouter une photo / vidéo</button>

      <div class="media-grid">
        ${items.length===0 ? `<div class="empty" style="grid-column:1/-1;"><span class="e-ic">🖼️</span>Aucun média pour ce filtre.</div>` :
        items.map(m=>{
          const likeCount = Object.values(m.likes||{}).filter(Boolean).length;
          const commentCount = (m.comments||[]).length;
          return `
          <div class="media-item" onclick="App.openLightbox('media','${m.id}')">
            ${m.type==='photo' ? `<img src="${m.src}" alt="">` : `<div class="video-ph">▶️</div>`}
            ${this.admin? `<button class="media-del" onclick="event.stopPropagation();App.deleteMedia('${m.id}')">🗑️</button>`:""}
            <button class="media-fav" onclick="event.stopPropagation();App.toggleFavMedia('${m.id}', ${!m.favorite})">${m.favorite?'⭐':'☆'}</button>
            <div class="media-cap"><span>${(m.category==='entrainement'?'🏃':'⚽')} ${esc(m.ref? this.refLabel(m.ref) : (m.competitionName||""))}${m.date? " · "+fmtDateShort(m.date):""}</span><span>❤️${likeCount} 💬${commentCount}</span></div>

      </div>
    `;
  },

  async saveStory(){

    const caption = document.getElementById("sCaption").value.trim();
    let src = "";
    if(type==="photo"){
      const file = document.getElementById("sPhotoFile").files[0];
      if(!file){ toast("Choisis une photo"); return; }
      src = await resizeImage(file, 700, 0.6);
    } else {
      const file = document.getElementById("sVideoFile").files[0];
      if(!file){ toast("Choisis une vidéo"); return; }
      try{

      } catch(err){

      }

    this.ensureMe(async (me)=>{

      // éphémère (visible 1 semaine seulement, cf STORY_LIFETIME_MS dans renderMedia), contrairement
      // aux médias (galerie permanente) et aux Actus (jamais filtrées par date), qui eux restent

      await this.db.collection("stories").add({
        type, src, caption, author:me, approved:true, likes:{}, comments:[], createdAt:new Date().toISOString()
      });
      this.closeModal();
      toast("Story publiée");
    });

      <button class="btn btn-accent btn-block" onclick="App.saveEditMedia('${kind}','${id}')">Enregistrer les modifications</button>
    `);
  },
  async saveEditMedia(kind, id){
    const col = kind==='story'?'stories':'media';
    const item = this.state[col].find(x=>x.id===id);
    if(!item) return;
    const isStory = kind==='story';
    const caption = document.getElementById("emCaption").value.trim();
    const patch = {caption};
    if(!isStory){
      patch.category = document.getElementById("emCategory").value;
      const compId = document.getElementById("emCompId").value;
      const comp = this.state.competitions.find(c=>c.id===compId);
      patch.competitionId = compId;
      patch.competitionName = comp?comp.name:"";
      patch.ref = document.getElementById("emRef").value;
      patch.date = document.getElementById("emDate").value || item.date;
    }
    if(item.type==='photo'){
      const fileInput = document.getElementById("emPhotoFile");
      const file = fileInput && fileInput.files[0];
      if(file) patch.src = await resizeImage(file, isStory?700:900, isStory?0.6:0.65);
    } else {
      const videoInput = document.getElementById("emVideoFile");
      const file = videoInput && videoInput.files[0];
      if(file){
        try{
          patch.src = await readVideoFile(file);
        } catch(err){
          toast(err.message || "Vidéo invalide");
          return;
        }
      }
      // si aucun nouveau fichier n'est choisi, on garde la vidéo actuelle (pas de patch.src)
    }
    await this.db.collection(col).doc(id).set({...item, ...patch});
    this.closeModal();
    toast("Modifications enregistrées");
    this.reopenViewerAfterAction(kind, id);
  },

  /* ---------- lightbox (view / like / comment) ---------- */

    document.getElementById("lightboxRoot").innerHTML = `

        <button class="lightbox-close" onclick="App.closeLightbox()">✕</button>

            (item.src && item.src.startsWith('data:video') ?
              `<video controls playsinline src="${item.src}" style="max-width:100%;max-height:100%;"></video>` :
              `<a class="openvid" href="${esc(item.src)}" target="_blank" rel="noopener">▶️<br>Ouvrir la vidéo</a>`)}
