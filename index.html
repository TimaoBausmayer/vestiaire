      {key:"relances", label:"🦶 Relances"},
      {key:"reflexes", label:"⚡ Réflexes"},
      {key:"placement", label:"📍 Placement"},
      {key:"autorite", label:"📢 Autorité de surface"},
      {key:"vitesseGk", label:"🏃 Vitesse"},
      {key:"global", label:"⭐ Note globale"},
    ],
  },
  ratingCriteriaFor(position){ return position==='Gardien' ? this.RATING_CRITERIA.gk : this.RATING_CRITERIA.outfield; },
  computePlayerStats(name, opts){
    let matches;
    if(opts && typeof opts==='object' && opts.includeIds){
      const idSet = new Set(opts.includeIds);
      matches = this.state.matches.filter(m=>m.played && idSet.has(m.id));
    } else {
      const excludeMatchId = opts;
      matches = this.state.matches.filter(m=>m.played && m.id!==excludeMatchId);
    }
    const player = this.state.players.find(p=>p.name===name);
    const manual = (player && player.manualStats) || {};
    const critList = this.ratingCriteriaFor(player && player.position);
    const critSums = {}, critCounts = {};
    critList.forEach(c=>{ critSums[c.key]=0; critCounts[c.key]=0; });
    let openPlayGoals=manual.goals||0, freekickScored=manual.freekickScored||0, assists=manual.assists||0, ratingsSum=0, ratingsCount=0, mvp=0, matchesPlayed=0, goalsConceded=0,
        timesStarter=manual.timesStarter||0, timesSub=manual.timesSub||0,
        yellow=manual.yellow||0, red=manual.red||0, worstVotesTotal=0, beautifulGoalVotesTotal=0, W=0, D=0, L=0,
        penaltiesScored=manual.penaltiesScored||0, penaltiesMissed=manual.penaltiesMissed||0, penaltiesCaused=manual.penaltiesCaused||0,
        cornersScored=manual.cornersScored||0, cornersTaken=manual.cornersTaken||0,
        shotsOnTarget=manual.shotsOnTarget||0, tacklesWon=manual.tacklesWon||0,
        saves=manual.saves||0, penaltiesSaved=manual.penaltiesSaved||0, penaltiesConceded=manual.penaltiesConceded||0,
        minutesPlayed=manual.minutesPlayed||0, matchVoteBest=0, matchVoteWorst=0, matchRankSum=0, matchRankCount=0;
    matches.forEach(m=>{
      (m.scorers||[]).forEach(s=>{ if(s.name===name) openPlayGoals += (s.count||0); });
      (m.freekickScored||[]).forEach(s=>{ if(s.name===name) freekickScored += (s.count||0); });
      (m.assists||[]).forEach(s=>{ if(s.name===name) assists += (s.count||0); });
      (m.cardsYellow||[]).forEach(s=>{ if(s.name===name) yellow += (s.count||0); });
      (m.cardsRed||[]).forEach(s=>{ if(s.name===name) red += (s.count||0); });
      (m.penaltiesScored||[]).forEach(s=>{ if(s.name===name) penaltiesScored += (s.count||0); });
      (m.penaltiesMissed||[]).forEach(s=>{ if(s.name===name) penaltiesMissed += (s.count||0); });
      (m.penaltiesCaused||[]).forEach(s=>{ if(s.name===name) penaltiesCaused += (s.count||0); });
      (m.cornersScored||[]).forEach(s=>{ if(s.name===name) cornersScored += (s.count||0); });
      (m.cornersTaken||[]).forEach(s=>{ if(s.name===name) cornersTaken += (s.count||0); });
      (m.shotsOnTarget||[]).forEach(s=>{ if(s.name===name) shotsOnTarget += (s.count||0); });
      (m.tacklesWon||[]).forEach(s=>{ if(s.name===name) tacklesWon += (s.count||0); });
      (m.saves||[]).forEach(s=>{ if(s.name===name) saves += (s.count||0); });
      (m.penaltiesSaved||[]).forEach(s=>{ if(s.name===name) penaltiesSaved += (s.count||0); });
      (m.penaltiesConceded||[]).forEach(s=>{ if(s.name===name) penaltiesConceded += (s.count||0); });
      (m.minutesPlayed||[]).forEach(s=>{ if(s.name===name) minutesPlayed += (s.count||0); });
      const wasGK = [m.tactic, m.tacticA, m.tacticB].some(t=>t && t.assignments && t.assignments.GK===name);
      if(wasGK && m.score){
        goalsConceded += (m.score.them||0);
      }
      // "Convoqué" doit être la source de vérité de "a joué ce match" : décocher quelqu'un dans les
      // convocations doit vraiment le retirer des stats, même s'il reste listé dans l'équipe A/B (l'équipe
      // A/B est la composition/effectif du match, pas la liste de présence). Sans ce garde-fou, un joueur
      // décoché restait quand même compté comme ayant joué dès qu'il figurait dans teamA/teamB — ce qui
      // arrive dès qu'il a été assigné à une équipe puis décoché ensuite. On ne retombe sur teamA/teamB que
      // pour les matchs plus anciens qui n'ont jamais utilisé les convocations (convoked resté vide).
      const wasInvolved = (m.convoked||[]).length
        ? (m.convoked||[]).includes(name)
        : ((m.teamA||[]).includes(name) || (m.teamB||[]).includes(name));
      if(wasInvolved){
        matchesPlayed++;
        const wasStarter = [m.tactic, m.tacticA, m.tacticB].some(t=>t && t.assignments && Object.values(t.assignments).includes(name));
        if(wasStarter) timesStarter++; else timesSub++;
      }
      if(wasInvolved && m.score){
        if(m.score.us>m.score.them) W++; else if(m.score.us===m.score.them) D++; else L++;
      }
      if(m.worstVotes && m.worstVotes[name]) worstVotesTotal += Object.values(m.worstVotes[name]).filter(Boolean).length;
      if(m.goalVotes && m.goalVotes[name]) beautifulGoalVotesTotal += Object.values(m.goalVotes[name]).filter(Boolean).length;
      const bestVoteInfo = this.matchVotePoints(m.matchVotes, 'best', this.MATCH_VOTE_BEST_SIZE);
      const worstVoteInfo = this.matchVotePoints(m.matchVotes, 'worst', this.MATCH_VOTE_WORST_SIZE);
      const bestAvgPts = bestVoteInfo.raterCount ? (bestVoteInfo.tally[name]||0)/bestVoteInfo.raterCount : 0;
      const worstAvgPts = worstVoteInfo.raterCount ? (worstVoteInfo.tally[name]||0)/worstVoteInfo.raterCount : 0;
      if(bestAvgPts>0) matchVoteBest += bestAvgPts;
      if(worstAvgPts>0) matchVoteWorst += worstAvgPts;
      // Le classement du match (top 10 meilleurs / top 3 pires voté par l'équipe) a maintenant son PROPRE
      // impact sur le général, complètement séparé des notes individuelles (avant, il était juste mélangé
      // dedans avec un poids faible). Sur son échelle -5..+5 par match (même échelle que l'écart des notes
      // à 5/10), moyenné sur tous les matchs où un classement a été voté (0 si le joueur n'y figure pas).
      if(bestVoteInfo.raterCount>0 || worstVoteInfo.raterCount>0){
        matchRankSum += (bestAvgPts/this.MATCH_VOTE_BEST_SIZE)*5 - (worstAvgPts/this.MATCH_VOTE_WORST_SIZE)*5;
        matchRankCount++;
      }
      const r = m.ratings && m.ratings[name];
      if(r){
        const vals = Object.values(r);
        if(vals.length){ ratingsSum += avg(vals); ratingsCount++; }
      }
      const dr = m.detailedRatings && m.detailedRatings[name];
      if(dr){
        Object.values(dr).forEach(entry=>{
          critList.forEach(c=>{
            if(entry && typeof entry[c.key]==="number"){ critSums[c.key]+=entry[c.key]; critCounts[c.key]++; }
          });
        });
      }
      if(m.ratings){
        let best=null, bestAvg=-1;
        Object.keys(m.ratings).forEach(p=>{
          const vals = Object.values(m.ratings[p]||{});
          if(!vals.length) return;
          const a = avg(vals);
          if(a>bestAvg){ bestAvg=a; best=p; }
        });
        if(best===name) mvp++;
      }
    });
    const avgRating = ratingsCount ? (ratingsSum/ratingsCount) : 0;
    const matchRankAvg = matchRankCount ? (matchRankSum/matchRankCount) : 0;
    const criteria = {};
    critList.forEach(c=>{ criteria[c.key] = critCounts[c.key] ? (critSums[c.key]/critCounts[c.key]) : 0; });
    const ballonDorAdj = this.ballonDorAdj(name);
    // Symétrique du Ballon d'Or, mais dans l'autre sens : être désigné "Pire Joueur" (ou cumuler des votes
    // "Pire Action") de la saison doit vraiment faire baisser le général, pas juste ne pas le faire monter —
    // sinon élire quelqu'un pire joueur de la saison n'avait aucun effet sur sa carte, alors que le Ballon d'Or,
    // lui, la fait vraiment monter. Poids plus lourd pour "Pire Joueur" (jugement sur toute la saison) que pour
    // "Pire Action" (un seul moment raté).
    const pireJoueurAdj = this.worstAwardAdj(name, 'pireJoueur', 3) * 6;
    const pireActionAdj = this.worstAwardAdj(name, 'pireAction', 10) * 3;
    // Un but est un but quelle que soit la manière : le total affiché partout (fiche, classement, carte FUT)
    // additionne les buts « en jeu », sur coup franc, sur corner direct et sur penalty. Le détail par type
    // reste disponible séparément (freekickScored, cornersScored, penaltiesScored) pour la note générale,
    // qui elle valorise différemment un but sur coup franc (très dur) et un but sur penalty (plus facile).
    const goals = openPlayGoals + freekickScored + cornersScored + penaltiesScored;
    return {goals, openPlayGoals, freekickScored, assists, avgRating, ratingsCount, mvp, matchesPlayed, timesStarter, timesSub, goalsConceded, yellow, red, worstVotesTotal, beautifulGoalVotesTotal, W, D, L, penaltiesScored, penaltiesMissed, penaltiesCaused, cornersScored, cornersTaken, shotsOnTarget, tacklesWon, saves, penaltiesSaved, penaltiesConceded, minutesPlayed, criteria, matchVoteBest, matchVoteWorst, matchRankAvg, ballonDorAdj, pireJoueurAdj, pireActionAdj, position: (player && player.position) || null};
  },
  // Mécanique commune à tous les classements de fin de saison (Ballon d'Or, Pire Joueur, Pire Action) :
  // seules les topN premières places du classement ont un effet "bonus" sur le général, et cet effet est
  // d'autant plus fort qu'on est proche de la 1ère place (idx 0) — la Ne place du top N a encore un petit
  // effet, jamais nul. `outsideScore` (optionnel, déjà dans le sens du malus, ex: -0.4) donne en plus un léger
  // écart pour tout le monde hors du top N (classé plus loin, ou pas classé du tout) — resté à 0 par défaut,
  // ce qui garde ce mécanisme neutre hors du top N (cas de Pire Joueur / Pire Action, inchangés). `direction`
  // vaut +1 pour un classement "des meilleurs" (bonus) ou -1 pour un classement "des pires" (malus). Moyenne
  // sur toutes les éditions clôturées de ce classement.
  seasonRankAdj(name, key, topN, direction, outsideScore){
    const history = (this.state.info && this.state.info.awardsHistory && this.state.info.awardsHistory[key]) || [];
    if(!history.length) return 0;
    let sum = 0, count = 0;
    history.forEach(h=>{
      const podium = h.podium || [];
      if(!podium.length) return;
      count++;
      const idx = podium.indexOf(name);
      if(idx===-1 || idx>=topN){ sum += direction * (outsideScore||0); return; } // hors du top N
      sum += direction * ((topN - idx) / topN);
    });
    if(!count) return 0;
    return sum/count;
  },
  // Le top 10 du Ballon d'Or fait monter le général (1er = bonus plein, 10e = petit bonus). Ne PAS être dans
  // ce top 10 donne en plus un léger écart vers le bas — plus marqué que la neutralité d'avant, mais volontai-
  // rement modeste (bien moindre que le bonus du top 10, et sans lien avec la distance au top 10 : 11e ou
  // dernier reçoivent le même petit écart) pour ne pas punir lourdement le reste de l'effectif.
  ballonDorAdj(name){
    return this.seasonRankAdj(name, 'ballonDor', 10, 1, -0.4) * 6;
  },
  // Seuls les 3 premiers d'un classement "des pires" (Pire Joueur / Pire Action) font baisser le général —
  // le poids (x6 pour Pire Joueur, x3 pour Pire Action) est appliqué par l'appelant.
  worstAwardAdj(name, key, topN){
    return this.seasonRankAdj(name, key, topN, -1);
  },
  cardRating(stats){
    // Un joueur qui n'a jamais disputé le moindre match part à 30 (pas de général tant qu'il n'y a pas eu au
    // moins un match joué). Le plancher général est maintenant 30 (au lieu de 45) : un joueur qui enchaîne les
    // mauvaises performances doit pouvoir vraiment redescendre, pas juste stagner à 45 quoi qu'il arrive.
    if(!stats.matchesPlayed) return 30;
    // Tant qu'aucune note individuelle n'a été saisie sur un match (ratingsCount===0), on ne pénalise ni ne
    // bonifie le général avec la moyenne des notes : avant, une moyenne par défaut à 0 faisait perdre ~27 points
    // à tout le monde même sans aucune note saisie, ce qui écrasait complètement les autres progrès.
    const avgRatingAdj = (stats.ratingsCount>0) ? (stats.avgRating-5)*4.5 : 0;
    // Le classement du match (top 10 meilleurs / top 3 pires voté par toute l'équipe) pèse maintenant un peu
    // plus que les notes individuelles, mais pas énormément : même échelle (-5..+5) que l'écart des notes à
    // 5/10, avec un poids légèrement supérieur (5.2 contre 4.5) — un classement qui va dans un sens a donc un
    // peu plus de poids qu'une note qui va dans le même sens, sans pour autant écraser les notes.
    const matchRankAdj = stats.matchRankAvg * 5.2;
    // Le temps de jeu compte maintenant vraiment : un joueur qui joue tout le match (90 min) gagne plus qu'un
    // joueur qui n'en joue qu'une partie, proportionnellement aux minutes réellement jouées (accumulées sur
    // tous ses matchs). Si aucune minute n'a jamais été saisie pour ce joueur (équipe qui ne suit pas ça), on
    // retombe sur l'ancien bonus fixe « titulaire » pour ne pas pénaliser les données déjà saisies.
    const playtimeBonus = (stats.minutesPlayed>0)
      ? (stats.minutesPlayed/90) * 3.0
      : (stats.timesStarter||0)*0.8;
    // Un gardien a un barème à part : il ne marque presque jamais et serait donc condamné à rester scotché
    // au plancher avec le barème des joueurs de champ (pensé pour valoriser les buts/tirs/tacles). Son général
    // valorise plutôt les arrêts, les penaltys stoppés, et le nombre de buts encaissés PAR MATCH (une moyenne,
    // pas un total, pour ne pas punir un gardien qui a simplement joué beaucoup de matchs) — une "feuille
    // blanche" (peu ou pas de buts encaissés en moyenne) donne un vrai bonus.
    if(stats.position==='Gardien'){
      const concededPerMatch = stats.goalsConceded / stats.matchesPlayed;
      const gkImpact = (stats.saves||0)*1.3 + (stats.penaltiesSaved||0)*5.0 + (stats.tacklesWon||0)*0.5;
      const cleanSheetBonus = Math.max(0, 1 - concededPerMatch) * 5.5;
      // Rendement décroissant sur la pénalité "buts encaissés" (racine carrée plutôt que linéaire) : un match
      // exceptionnellement à sens unique (ex : 10 buts encaissés dans un match très ouvert) ne doit pas à lui
      // seul écraser le général au plancher — un match difficile pèse, mais pas de façon disproportionnée.
      const concededPenalty = Math.sqrt(Math.max(0, concededPerMatch)) * 3.2;
      let rg = 52 + gkImpact + cleanSheetBonus - concededPenalty + stats.assists*2.3 + avgRatingAdj + matchRankAdj + stats.mvp*6.0
        + playtimeBonus
        - stats.worstVotesTotal*1.4
        - (stats.yellow||0)*0.8 - (stats.red||0)*3.2
        + (stats.beautifulGoalVotesTotal||0)*1.15 + (stats.ballonDorAdj||0)
        + (stats.pireJoueurAdj||0) + (stats.pireActionAdj||0);
      return this.compressRating(rg);
    }
    // Chaque façon de marquer pèse différemment sur le général, du plus dur au plus facile :
    // coup franc (le plus dur, vaut exactement 2 buts classiques) > corner direct (dur, mais moins qu'un coup
    // franc) > but « classique » en jeu ouvert (poids de base) > penalty (le plus facile). Un corner monte
    // donc plus qu'un but classique mais moins qu'un coup franc, et un coup franc vaut pile 2 buts classiques.
    const scoringImpact = (stats.openPlayGoals||0)*4.8 + (stats.freekickScored||0)*9.6 + (stats.cornersScored||0)*6.0 + (stats.penaltiesScored||0)*3.4;
    // Un joueur avec un mauvais match (carton, penalty raté/provoqué, mauvais votes) doit vraiment perdre du
    // général, pas juste moins en gagner : les cartons (auparavant ignorés par la note) comptent maintenant
    // aussi, un rouge punissant nettement plus qu'un jaune.
    // Être élu MVP d'un match (meilleure note du match) doit faire monter le général de façon très nette —
    // ce poids a été nettement augmenté (plus du double) pour que chaque titre de MVP se voie vraiment.
    let r = 52 + scoringImpact + stats.assists*2.3 + avgRatingAdj + matchRankAdj + stats.mvp*6.0 + stats.tacklesWon*0.9 + (stats.shotsOnTarget||0)*0.4
      + playtimeBonus
      - stats.penaltiesMissed*2.8 - stats.worstVotesTotal*1.4 - stats.penaltiesCaused*2.6
      - (stats.yellow||0)*0.8 - (stats.red||0)*3.2
      + (stats.beautifulGoalVotesTotal||0)*1.15 + (stats.ballonDorAdj||0)
      + (stats.pireJoueurAdj||0) + (stats.pireActionAdj||0);
    return this.compressRating(r);
  },
  // Comme sur une vraie carte : en dessous du seuil "élite", la note suit la formule brute normalement.
  // Au-dessus, chaque point devient de plus en plus dur à gagner (rendement décroissant), pour que les
  // meilleurs joueurs plafonnent naturellement autour de 93-95 et que 99 reste quasiment hors de portée —
  // ça évite aussi qu'un seul gros match fasse bondir le général d'un coup une fois qu'on est déjà haut.
  compressRating(raw){
    const floor = 30, softCap = 70, ceil = 99;
    // Arrondi au dixième (pas à l'entier) : avec un entier, deux notes très proches (ex: 7,2 et 7,3) peuvent
    // donner exactement le même général arrondi, et on dirait que la moyenne des notes n'a servi à rien alors
    // qu'elle est bien prise en compte en interne. Avec un dixième, le général bouge visiblement dès qu'une
    // note change, même un tout petit peu — plus honnête pour montrer que chaque nouvelle note compte.
    if(raw <= softCap) return Math.max(floor, Math.round(raw*10)/10);
    const excess = raw - softCap;
    const span = ceil - softCap;
    const hardness = 22.75; // plus ce chiffre est grand, plus il faut de performance pour grimper près de 99
    const compressed = span * (1 - Math.exp(-excess/hardness));
    return Math.min(ceil, Math.round((softCap + compressed)*10)/10);
  },
  cardTier(rating){
    if(rating>=85) return "icon";
    if(rating>=75) return "gold";
    if(rating>=65) return "silver";
    return "bronze";
  },
  /* ---------- Valeur marchande (façon marché des transferts) ---------- */
  lastPlayedMatch(){
    const played = this.state.matches.filter(m=>m.played).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    return played[0] || null;
  },
  marketValueFromRating(rating){
    // Le plancher du général est maintenant 30 (au lieu de 45) : la valeur marchande doit suivre, sinon un
    // joueur dont le général baisse entre 30 et 44 verrait sa valeur marchande rester figée comme avant,
    // recréant le même problème que le général qui ne bougeait pas visiblement.
    const r = Math.max(30, Math.min(99, rating));
    const raw = 50000 * Math.pow(1.11, r-45);
    return Math.round(raw/1000)*1000;
  },
  formatMarketValue(v){
    if(v>=1000000) return (v/1000000).toFixed(1).replace(/\.0$/,'') + "M €";
    return Math.round(v/1000) + "K €";
  },
  marketValueTrend(name){
    const stats = this.computePlayerStats(name);
    const rating = this.cardRating(stats);
    const value = this.marketValueFromRating(rating);
    const lm = this.lastPlayedMatch();
    if(!lm) return {value, rating, delta:0, pct:0, dir:'flat'};
    const prevStats = this.computePlayerStats(name, lm.id);
    const prevRating = this.cardRating(prevStats);
    const prevValue = this.marketValueFromRating(prevRating);
    const delta = value - prevValue;
    const pct = prevValue>0 ? (delta/prevValue*100) : 0;
    return {value, rating, prevValue, prevRating, delta, pct, dir: delta>0?'up':delta<0?'down':'flat'};
  },
  playerValueHistory(name){
    const played = this.state.matches.filter(m=>m.played).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const ids = [];
    return played.map(m=>{
      ids.push(m.id);
      const stats = this.computePlayerStats(name, {includeIds:[...ids]});
      const rating = this.cardRating(stats);
      return {date:m.date, opponent:m.opponent, value:this.marketValueFromRating(rating)};
    });
  },
  toggleValueChart(name){
    this.state.expandedValueChart = this.state.expandedValueChart || {};
    this.state.expandedValueChart[name] = !this.state.expandedValueChart[name];
    this.render();
  },
  renderValueHistoryChart(name){
    const points = this.playerValueHistory(name);
    if(points.length<2) return `<p class="muted" style="font-size:11.5px;">Pas encore assez de matchs joués pour tracer une évolution.</p>`;
    const values = points.map(p=>p.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max-min) || 1;
    const W=100, H=40;
    const stepX = points.length>1 ? W/(points.length-1) : 0;
    const coords = points.map((p,i)=>({x:i*stepX, y:H-((p.value-min)/range)*H, ...p}));
    const path = coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
    const last = coords[coords.length-1];
    return `
    <div style="margin-top:6px;">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:70px;background:var(--surface-2);border-radius:8px;">
        <path d="${path}" fill="none" stroke="var(--accent2)" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
        <circle cx="${last.x}" cy="${last.y}" r="1.6" fill="var(--accent2)"></circle>
      </svg>

        <span class="muted" style="font-size:10px;">${fmtDate(points[0].date)} · ${this.formatMarketValue(points[0].value)}</span>
        <span class="muted" style="font-size:10px;">${fmtDate(points[points.length-1].date)} · ${this.formatMarketValue(points[points.length-1].value)}</span>
      </div>
    </div>`;
  },
  /* ---------- Salaire (versé tous les 2 mois, indexé sur la valeur marchande) ---------- */
  playerSalary(name){
    const stats = this.computePlayerStats(name);
    const rating = this.cardRating(stats);
    const value = this.marketValueFromRating(rating);
    return Math.max(500, Math.round(value*0.05/500)*500);
  },
  // Le salaire ne baisse jamais d'un versement à l'autre : si la valeur marchande a reculé, on garde
  // le dernier montant connu (le "dernier prix") ; s'il a progressé, le salaire suit la nouvelle valeur.
  effectiveSalary(name, acc){
    const current = this.playerSalary(name);
    const floor = (acc && acc.lastSalaryAmount) || 0;
    return Math.max(current, floor);
  },
  pendingSalaryInfo(name){
    const player = this.state.players.find(p=>p.name===name);
    if(!player) return null;
    const acc = this.state.accounts.find(a=>a.username===name);
    const lastAt = acc && acc.lastSalaryAt ? new Date(acc.lastSalaryAt) : (acc && acc.createdAt ? new Date(acc.createdAt) : new Date());
    const nextAt = new Date(lastAt); nextAt.setMonth(nextAt.getMonth()+2);
    return {amount: this.effectiveSalary(name, acc), nextAt: isNaN(nextAt) ? null : nextAt.toISOString()};
  },
  checkAndPaySalaryIfNeeded(){
    if(!this.me || !this.db) return;
    if(this._salaryCheckedFor === this.me) return;
    this._salaryCheckedFor = this.me;
    const player = this.state.players.find(p=>p.name===this.me);
    if(!player) return;
    const acc = this.state.accounts.find(a=>a.username===this.me);
    if(!acc) return;
    const lastAt = acc.lastSalaryAt ? new Date(acc.lastSalaryAt) : new Date(acc.createdAt||Date.now());
    if(isNaN(lastAt)) return;
    const now = new Date();
    const monthsElapsed = (now.getFullYear()-lastAt.getFullYear())*12 + (now.getMonth()-lastAt.getMonth());
    const periods = Math.floor(monthsElapsed/2);
    if(periods<1) return;
    const salary = this.effectiveSalary(this.me, acc);
    const total = salary*periods;
    const newLastAt = new Date(lastAt); newLastAt.setMonth(newLastAt.getMonth()+periods*2);
    const newWallet = (acc.wallet||0) + total;
    this.db.collection("accounts").doc(slugify(this.me)).update({wallet:newWallet, lastSalaryAt:newLastAt.toISOString(), lastSalaryAmount:salary}).then(()=>{
      toast("💼 Salaire versé : "+fmtEuro(total)+(periods>1? " ("+periods+" versements)":""));
    });
  },
  /* ---------- Paris sportifs ---------- */
  factorial(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; },
  poissonP(lambda, k){
    if(lambda<=0) lambda=0.25;
    return Math.pow(lambda,k)*Math.exp(-lambda)/this.factorial(k);
  },
  // Comme sur un vrai book de paris : la marge de la maison grandit avec la probabilité de l'évènement,
  // donc un pari "trop facile" (joueur qui marque à presque tous les matchs, équipe très dominante...)
  // ne s'effondre jamais vers une cote presque à 1 — il reste juste "peu rémunérateur", jamais gratuit.
  fairOdds(p, baseMargin, min, max){
    baseMargin = baseMargin==null?0.10:baseMargin; min = min||1.15; max = max||25;
    const pc = Math.max(0.01, Math.min(0.95, p));
    const margin = Math.min(0.55, baseMargin + pc*0.22);
    const raw = (1/pc) * (1-margin);
    return Math.max(min, Math.min(max, +raw.toFixed(2)));
  },
  // Les cotes doivent se baser sur l'historique face à CET adversaire précis quand on en a un (au moins un
  // match déjà joué contre lui) — sinon un adversaire qui nous a déjà battus à plate couture afficherait
  // exactement la même cote qu'un adversaire jamais affronté (ou qu'on écrase à chaque fois), ce qui est une
  // vraie faille : les cotes ne s'adaptent alors jamais au véritable niveau de l'adversaire du match. On ne
  // retombe sur l'historique global du club que quand on n'a encore jamais joué cet adversaire précis.
  matchesAgainst(opponent){
    const all = this.pastMatches();
    if(!opponent) return all;
    const norm = s => (s||"").trim().toLowerCase();
    const vs = all.filter(m=>norm(m.opponent)===norm(opponent));
    return vs.length ? vs : all;
  },
  clubForm(opponent){
    const past = this.matchesAgainst(opponent);
    if(!past.length) return {winP:0.42, drawP:0.26, lossP:0.32};
    let w=0,d=0,l=0;
    past.forEach(m=>{ if(!m.score) return; if(m.score.us>m.score.them) w++; else if(m.score.us===m.score.them) d++; else l++; });
    const tot = w+d+l || 1;
    return {winP:w/tot, drawP:d/tot, lossP:l/tot};
  },
  matchOutcomeOdds(opponent){
    const f = this.clubForm(opponent);
    // Un plancher de probabilité assez haut (15%) pour qu'aucune issue ne devienne un pari-cadeau à
    // cote démesurée, même quand le club a un excellent historique — un "outsider" garde toujours une vraie chance.
    const winP = Math.max(0.15,f.winP), drawP = Math.max(0.15,f.drawP), lossP = Math.max(0.15,f.lossP);
    const norm = winP+drawP+lossP;
    return {
      us: this.fairOdds(winP/norm, 0.08, 1.15, 7),
      draw: this.fairOdds(drawP/norm, 0.08, 1.15, 7),
      them: this.fairOdds(lossP/norm, 0.08, 1.15, 7),
    };
  },
  diffOdds(opponent){
    const past = this.matchesAgainst(opponent);
    let under2=0, tot=0;
    past.forEach(m=>{ if(!m.score) return; tot++; if(Math.abs(m.score.us-m.score.them)<2) under2++; });
    const p = tot? under2/tot : 0.55;
    const pC = Math.max(0.18, Math.min(0.82, p));
    return {under2: this.fairOdds(pC, 0.08, 1.15, 6), over2: this.fairOdds(1-pC, 0.08, 1.15, 6)};
  },
  scoreOdds(us, them, opponent){
    const past = this.matchesAgainst(opponent);
    const n = past.length;
    const avgUs = n? past.reduce((s,m)=>s+(m.score?m.score.us:0),0)/n : 1.4;
    const avgThem = n? past.reduce((s,m)=>s+(m.score?m.score.them:0),0)/n : 1.1;
    const pUs = this.poissonP(Math.max(0.2,avgUs), us);
    const pThem = this.poissonP(Math.max(0.2,avgThem), them);
    const p = Math.max(0.004, pUs*pThem);
    return this.fairOdds(p, 0.15, 3, 40);
  },
  // Les cotes "buteur" s'appuient directement sur le rythme de buts du joueur (buts / match joué) :
  // un buteur déjà très prolifique verra sa cote s'écraser vers le plancher (peu de gain), un joueur qui
  // marque rarement garde une cote élevée — exactement comme sur un vrai book, adapté aux stats réelles.
  scorerOdds(name){
    const s = this.computePlayerStats(name);
    const lambda = Math.max(0.08, s.matchesPlayed>0 ? s.goals/s.matchesPlayed : 0.2);
    const p1 = 1 - Math.exp(-lambda);
    const p2 = 1 - Math.exp(-lambda)*(1+lambda);
    const penRate = Math.max(0.02, s.matchesPlayed>0 ? (s.penaltiesScored/s.matchesPlayed) : 0.03);
    const pPen = 1 - Math.exp(-penRate);
    const fkRate = Math.max(0.015, s.matchesPlayed>0 ? (s.freekickScored/s.matchesPlayed) : 0.02);
    const pFk = 1 - Math.exp(-fkRate);
    return {
      atLeast1: this.fairOdds(p1, 0.08, 1.15, 12),
      atLeast2: this.fairOdds(p2, 0.10, 1.3, 25),
      penalty: this.fairOdds(pPen, 0.12, 1.5, 20),
      freekick: this.fairOdds(pFk, 0.12, 1.8, 25),
    };
  },

  didBetWin(b, finalData){
    const sel = b.selection;
    if(b.type==='winner'){
      const outcome = finalData.us>finalData.them ? 'us' : finalData.us===finalData.them ? 'draw' : 'them';
      return sel===outcome;
    }
    if(b.type==='score') return sel && sel.us===finalData.us && sel.them===finalData.them;
    if(b.type==='diff2'){
      const under2 = Math.abs(finalData.us-finalData.them)<2;
      return sel==='under2' ? under2 : !under2;
    }
    if(b.type==='scorer'){
      // Un pari "marqueur" doit compter tout but, quel que soit le type (jeu ouvert, coup franc,
      // corner direct, penalty) — sinon un joueur qui marque uniquement sur penalty ou coup franc
      // ferait perdre à tort un pari "marque au moins 1/2 but(s)".
      const merged = finalData.allGoals || [];
      const g = merged.find(s=>s.name===sel.player);
      return (g? g.count:0) >= sel.threshold;
    }
    if(b.type==='scorer_penalty'){
      const g = (finalData.penScored||[]).find(s=>s.name===sel.player);
      return !!(g && g.count>0);
    }
    if(b.type==='scorer_freekick'){
      const g = (finalData.freekick||[]).find(s=>s.name===sel.player);
      return !!(g && g.count>0);
    }
    return false;
  },
  async settleBetsForMatch(matchId, finalData){
    const pending = (this.state.bets||[]).filter(b=>b.matchId===matchId && b.status==='pending');
    if(!pending.length) return;
    const walletDelta = {};
    await Promise.all(pending.map(b=>{
      const won = this.didBetWin(b, finalData);
      const payout = won ? Math.round(b.stake*b.odds) : 0;
      if(won) walletDelta[b.bettor] = (walletDelta[b.bettor]||0) + payout;
      return this.db.collection("bets").doc(b.id).update({status: won?"won":"lost", payout, settledAt:new Date().toISOString()});
    }));
    await Promise.all(Object.keys(walletDelta).map(username=>{
      const acc = this.state.accounts.find(a=>a.username===username);
      const current = acc ? (acc.wallet||0) : 0;
      return this.db.collection("accounts").doc(slugify(username)).update({wallet: current + walletDelta[username]});
    }));
  },

  // Les 6 attributs "façon carte FIFA" affichés sur la carte viennent d'abord des notes que les gens
  // votent après chaque match (mêmes critères, exactement) — donc voter a un vrai impact sur la carte.
  // Tant que personne n'a encore noté un critère, on retombe sur une estimation à partir des stats du match
  // (buts, tirs, tacles...) pour que la carte ne reste pas figée à vide pour un nouveau joueur.
  cardSubStats(p, stats){
    // Arrondi au dixième (comme le général) plutôt qu'à l'entier : sinon deux joueurs très proches en
    // dribble/tir/défense se retrouvaient collés au même entier, et impossible de voir qui progresse vraiment
    // d'un match à l'autre dans les classements par catégorie.
    const clamp = v => Math.max(40, Math.min(99, Math.round(v*10)/10));
    const c = stats.criteria || {};
    // Un vote moyen 0-10 est ramené sur l'échelle 40-99 des cartes, puis mélangé (65/35) avec l'estimation
    // "brute" issue des stats — les votes de la communauté priment, les stats évitent une carte figée à 40.
    const blend = (voteVal, fallback) => (voteVal && voteVal>0) ? clamp((40+voteVal*5.9)*0.65 + fallback*0.35) : clamp(fallback);
    if(p.position==='Gardien'){
      const fPlongeon = 50 + Math.min(20, stats.saves*1.4);
      const fRelances = 50;
      const fReflexes = 50 + Math.min(20, stats.penaltiesSaved*5);
      const fPlacement = 48 + Math.min(10, stats.matchesPlayed);
      const fAutorite = 48 + Math.min(10, stats.matchesPlayed);
      const fVitesse = 50;
      return {
        PLO: blend(c.plongeon, fPlongeon),
        REL: blend(c.relances, fRelances),
        "RÉF": blend(c.reflexes, fReflexes),
        PLA: blend(c.placement, fPlacement),
        AUT: blend(c.autorite, fAutorite),
        VIT: blend(c.vitesseGk, fVitesse),
      };
    }
    const gpm = stats.matchesPlayed>0 ? stats.goals/stats.matchesPlayed : 0;
    const fVit = 52 + gpm*12;
    const fTir = 45 + stats.goals*4 + stats.shotsOnTarget*1;
    const fPas = 45 + stats.assists*3;
    const fDri = 50;
    const fDef = 40 + stats.tacklesWon*2;
    const fPhy = 48 + Math.min(10, stats.matchesPlayed);
    return {
      VIT: blend(c.vitesse, fVit),
      TIR: blend(c.tir, fTir),
      PAS: blend(c.passe, fPas),
      DRI: blend(c.dribble, fDri),
      "DÉF": blend(c.defense, fDef),
      PHY: blend(c.physique, fPhy),
    };
  },

  /* ============================= TAB 4 : Stats (Joueurs, Équipe & Adversaires) ============================= */
  // Fusionne toutes les façons de marquer un but dans ce match (jeu ouvert, coup franc, corner direct,
  // penalty) en une seule liste {name, count} — un but reste un but, peu importe comment il a été inscrit.
  matchGoalScorers(m){
    const totals = {};
    [m.scorers, m.freekickScored, m.cornersScored, m.penaltiesScored].forEach(arr=>{
      (arr||[]).forEach(s=>{ totals[s.name] = (totals[s.name]||0) + (s.count||0); });
    });
    return Object.entries(totals).filter(([,c])=>c>0).map(([name,count])=>({name,count}));
  },
  globalRankings(){
    const played = this.state.matches.filter(m=>m.played);
    const byPlayer = {};
    this.state.players.forEach(p=> byPlayer[p.name] = {name:p.name, goals:0, assists:0, ratingSum:0, ratingCount:0});
    played.forEach(m=>{
      this.matchGoalScorers(m).forEach(s=>{ if(byPlayer[s.name]) byPlayer[s.name].goals += s.count; else byPlayer[s.name]={name:s.name,goals:s.count,assists:0,ratingSum:0,ratingCount:0}; });
      (m.assists||[]).forEach(s=>{ if(byPlayer[s.name]) byPlayer[s.name].assists += s.count; else byPlayer[s.name]={name:s.name,goals:0,assists:s.count,ratingSum:0,ratingCount:0}; });
      Object.entries(m.ratings||{}).forEach(([name,raters])=>{
        const vals = Object.values(raters||{});
        if(!vals.length) return;
        if(!byPlayer[name]) byPlayer[name]={name,goals:0,assists:0,ratingSum:0,ratingCount:0};
        byPlayer[name].ratingSum += avg(vals); byPlayer[name].ratingCount += 1;
      });
    });
    const list = Object.values(byPlayer);
    const byAvg = list.filter(p=>p.ratingCount>0).map(p=>({...p, avg:p.ratingSum/p.ratingCount})).sort((a,b)=>b.avg-a.avg);
    const byGoals = list.slice().sort((a,b)=>b.goals-a.goals).filter(p=>p.goals>0);
    const byAssists = list.slice().sort((a,b)=>b.assists-a.assists).filter(p=>p.assists>0);
    let W=0,N=0,D=0, gf=0, ga=0;
    played.forEach(m=>{ if(!m.score) return; gf+=m.score.us||0; ga+=m.score.them||0; if(m.score.us>m.score.them) W++; else if(m.score.us===m.score.them) N++; else D++; });
    return {byAvg, byGoals, byAssists, W, N, D, gf, ga, played: played.length};
  },
  // Les 6 classements par catégorie ("Général", "Buteur", "Passeur", "Tireur", "Dribbleur", "Défenseur")
  // demandés pour voir en un coup d'œil qui est le/la meilleur(e) dans chaque domaine, et combien de
  // joueurs sont classés. "Tireur"/"Dribbleur"/"Défenseur" reprennent directement les attributs TIR/DRI/DÉF
  // déjà affichés sur la carte FUT de chaque joueur (cardSubStats) — donc noter un joueur sur ces critères
  // après un match a un effet direct ici aussi. Un gardien n'a pas ces attributs (son jeu de carte est
  // différent : PLO/REL/RÉF/PLA/AUT), donc il est exclu de ces 3 classements-là, mais reste dans les 3 autres.
  // `opts` (optionnel) se transmet tel quel à computePlayerStats — utilisé pour recalculer un classement
  // "avant le dernier match" et ainsi détecter si quelqu'un est monté ou descendu.
  CLASSEMENT_CATEGORIES: [
    {key:'general', label:'⭐ Général', forGK:true, fmt:v=>v.toFixed(1)},
    {key:'buteur', label:'⚽ Buteur', forGK:true, fmt:v=>String(Math.round(v))},
    {key:'passeur', label:'🎯 Passeur', forGK:true, fmt:v=>String(Math.round(v))},
    {key:'tireur', label:'🥅 Tireur', forGK:false, fmt:v=>v.toFixed(1)},
    {key:'dribbleur', label:'🌀 Dribbleur', forGK:false, fmt:v=>v.toFixed(1)},
    {key:'defenseur', label:'🛡️ Défenseur', forGK:false, fmt:v=>v.toFixed(1)},
    {key:'polyvalent', label:'🌟 Complet', forGK:false, fmt:v=>v.toFixed(1), composite:true},
  ],
  computeCategoryRanking(category, opts){
    const def = this.CLASSEMENT_CATEGORIES.find(c=>c.key===category);
    if(!def) return [];
    if(def.composite){
      // "Complet" : le classement "entre" tous les autres, qui mélange un peu de tout (buteur, passeur,
      // tireur, dribbleur, défenseur) plutôt qu'une seule spécialité — contrairement au Général, il ne
      // prend PAS en compte les votes/MVP/cartons, juste ces 5 classements combinés. Pour chaque catégorie,
      // chaque joueur reçoit un score de 0 (dernier) à 1 (premier) selon sa place ; son score "Complet" est
      // la moyenne de ces 5 scores, ramenée sur 100 — donc être bon un peu partout fait mieux monter que
      // d'être élite dans un seul domaine et mauvais dans les autres.
      const componentKeys = ['buteur','passeur','tireur','dribbleur','defenseur'];
      const scoreByName = {};
      componentKeys.forEach(k=>{
        const list = this.computeCategoryRanking(k, opts);
        const n = list.length;
        list.forEach(r=>{
          const pct = n>1 ? (n-r.rank)/(n-1) : 1;
          if(!scoreByName[r.name]) scoreByName[r.name] = {sum:0, count:0};
          scoreByName[r.name].sum += pct; scoreByName[r.name].count++;
        });
      });
      const rows = Object.entries(scoreByName)
        .filter(([,o])=>o.count===componentKeys.length) // seuls les joueurs présents dans les 5 (donc pas les gardiens)
        .map(([name,o])=>({name, value:(o.sum/o.count)*100}));
      rows.sort((a,b)=>b.value-a.value);
      rows.forEach((r,i)=>{ r.rank = i+1; });
      return rows;
    }
    const rows = [];
    this.state.players.forEach(p=>{
      if(p.position==='Gardien' && !def.forGK) return;
      const stats = this.computePlayerStats(p.name, opts);
      if(!stats.matchesPlayed) return; // pas encore joué = pas classé, pour ne pas polluer avec des valeurs par défaut
      let value;
      if(category==='general') value = this.cardRating(stats);
      else if(category==='buteur') value = stats.goals;
      else if(category==='passeur') value = stats.assists;
      else {
        const sub = this.cardSubStats(p, stats);
        if(category==='tireur') value = sub.TIR;
        else if(category==='dribbleur') value = sub.DRI;
        else if(category==='defenseur') value = sub["DÉF"];
      }
      if(value==null) return;
      rows.push({name:p.name, position:p.position, value});
    });
    rows.sort((a,b)=>b.value-a.value);
    rows.forEach((r,i)=>{ r.rank = i+1; });
    return rows;
  },
  // Ajoute prevRank/trend en comparant au classement calculé juste avant le dernier match joué — c'est ce
  // qui permet d'afficher "monté" / "descendu" / "nouveau" à chaque nouveau match.
  computeCategoryRankingWithTrend(category){
    const current = this.computeCategoryRanking(category);
    const lastMatch = this.lastPlayedMatch();
    const prevRows = lastMatch ? this.computeCategoryRanking(category, lastMatch.id) : [];
    const prevRankByName = {};
    prevRows.forEach(r=>{ prevRankByName[r.name] = r.rank; });
    current.forEach(r=>{
      const pr = prevRankByName[r.name];
      r.prevRank = pr!=null ? pr : null;
      r.trend = pr==null ? 'new' : pr>r.rank ? 'up' : pr<r.rank ? 'down' : 'same';
    });
    return current;
  },
  setClassementCat(key){ this.state.classementCat = key; this.render(); },
  renderClassementsSection(){
    const cats = this.CLASSEMENT_CATEGORIES;
    const active = cats.find(c=>c.key===this.state.classementCat) ? this.state.classementCat : 'general';
    const cat = cats.find(c=>c.key===active);
    const rows = this.computeCategoryRankingWithTrend(active);
    const trendTag = (r)=>{
      if(r.trend==='new') return `<span class="muted" style="font-size:11px;">🆕 nouveau</span>`;
      if(r.trend==='same') return `<span class="muted" style="font-size:11px;">▬ pareil</span>`;
      if(r.trend==='up') return `<span style="font-size:11px;color:#2e7d32;">▲ ${r.prevRank}e ➜ ${r.rank}e</span>`;
      return `<span style="font-size:11px;color:#c62828;">▼ ${r.prevRank}e ➜ ${r.rank}e</span>`;
    };
    return `
    <div class="card">
      <h2>🏆 Classements</h2>
      <p class="muted" style="font-size:12px;margin-top:-6px;">${rows.length} joueur${rows.length>1?'s':''} classé${rows.length>1?'s':''} dans "${esc(cat.label.replace(/^\S+\s/,''))}". Choisis une catégorie ci-dessous — après chaque nouveau match, regarde si tu montes ▲ ou descends ▼ !</p>
      <div class="wrap" style="margin-bottom:10px;">
        ${cats.map(c=>`<span class="chip ${active===c.key?'active':''}" onclick="App.setClassementCat('${c.key}')">${c.label}</span>`).join("")}
      </div>
      ${rows.length===0 ? `<p class="muted" style="font-size:12.5px;">Personne n'a encore assez joué pour ce classement.</p>` :
        rows.map(r=>`
        <div class="presence-row" style="cursor:pointer;" onclick="App.selectStatsPlayer('${jsa(r.name)}')">

            <b>${cat.fmt(r.value)}</b><br>${trendTag(r)}
          </span>
        </div>`).join("")}
    </div>`;
  },
  computeOpponents(){
    const played = this.state.matches.filter(m=>m.played && m.opponent);
    const byOpp = {};
    played.forEach(m=>{
      const key = m.opponent;
      if(!byOpp[key]) byOpp[key] = {name:key, W:0,D:0,L:0, gf:0, ga:0, played:0};
      const o = byOpp[key];
      o.played++; o.gf += m.score?m.score.us:0; o.ga += m.score?m.score.them:0;
      if(!m.score) return;
      if(m.score.us>m.score.them) o.W++; else if(m.score.us===m.score.them) o.D++; else o.L++;
    });
    return Object.values(byOpp).sort((a,b)=>b.played-a.played);
  },
  renderStatsTab(){

  computeTeamSplitStats(key){
    const players = this.state.players.filter(p=>p.team===key);
    let goals=0, assists=0, yellow=0, red=0, cornersScored=0, cornersTaken=0, penaltiesScored=0, penaltiesMissed=0, penaltiesCaused=0,
        shotsOnTarget=0, tacklesWon=0, saves=0, penaltiesSaved=0, penaltiesConceded=0, minutesPlayed=0, ratingSum=0, ratingCount=0, mvp=0,
        matchesPlayed=0, W=0, D=0, L=0;
    players.forEach(p=>{
      const s = this.computePlayerStats(p.name);
      goals+=s.goals; assists+=s.assists; yellow+=s.yellow; red+=s.red;
      cornersScored+=s.cornersScored; cornersTaken+=s.cornersTaken;
      penaltiesScored+=s.penaltiesScored; penaltiesMissed+=s.penaltiesMissed; penaltiesCaused+=s.penaltiesCaused;
      shotsOnTarget+=s.shotsOnTarget; tacklesWon+=s.tacklesWon; saves+=s.saves; penaltiesSaved+=s.penaltiesSaved; penaltiesConceded+=s.penaltiesConceded;
      minutesPlayed+=s.minutesPlayed; mvp+=s.mvp; matchesPlayed+=s.matchesPlayed; W+=s.W; D+=s.D; L+=s.L;
      if(s.avgRating>0){ ratingSum+=s.avgRating; ratingCount++; }
    });
    const avgRating = ratingCount? ratingSum/ratingCount : 0;
    return {count:players.length, goals, assists, yellow, red, cornersScored, cornersTaken, penaltiesScored, penaltiesMissed, penaltiesCaused, shotsOnTarget, tacklesWon, saves, penaltiesSaved, penaltiesConceded, minutesPlayed, avgRating, mvp, matchesPlayed, W, D, L};
  },
  teamWinStrength(s){
    // Petit indice "forme" maison — pas une vraie stat pro, juste pour comparer les deux équipes du club.
    const winRate = (s.W+s.D+s.L)>0 ? s.W/(s.W+s.D+s.L) : 0;
    const goalsPerMatch = s.matchesPlayed>0 ? s.goals/s.matchesPlayed : 0;
    return Math.max(0.1, winRate*60 + goalsPerMatch*15 + (s.avgRating||0)*4 - (s.yellow+s.red*2)*0.5);
  },
  renderTeamSplitStats(){
    const tn = this.teamNames();
    const a = this.computeTeamSplitStats('A'), b = this.computeTeamSplitStats('B');
    if(a.count===0 && b.count===0) return "";
    const strA = this.teamWinStrength(a), strB = this.teamWinStrength(b);

        <div class="kv" style="border:none;"><span>Pen. marqués/ratés</span><b>${s.penaltiesScored}/${s.penaltiesMissed}</b></div>
        <div class="kv" style="border:none;"><span>🎯 Taux réussite pen.</span><b>${pctStr(s.penaltiesScored, s.penaltiesScored+s.penaltiesMissed)}</b></div>
        <div class="kv" style="border:none;"><span>🚫 Pen. provoqués</span><b>${s.penaltiesCaused}</b></div>
        <div class="kv" style="border:none;"><span>Coufrans marq./tirés</span><b>${s.cornersScored}/${s.cornersTaken}</b></div>
        <div class="kv" style="border:none;"><span>🎯 Taux réussite coufran</span><b>${pctStr(s.cornersScored, s.cornersTaken)}</b></div>
        <div class="kv" style="border:none;"><span>Tirs cadrés</span><b>${s.shotsOnTarget}</b></div>
        <div class="kv" style="border:none;"><span>🛡️ Tacles réussis</span><b>${s.tacklesWon}</b></div>
        <div class="kv" style="border:none;"><span>Arrêts (GK)</span><b>${s.saves}</b></div>
        <div class="kv" style="border:none;"><span>Pen. attrapés/pris (GK)</span><b>${s.penaltiesSaved}/${s.penaltiesConceded}</b></div>
        <div class="kv" style="border:none;"><span>Cartons J/R</span><b>${s.yellow}/${s.red}</b></div>
      </div>`;
    return `
    <div class="card">
      <h2>⚔️ ${esc(tn.a)} vs ${esc(tn.b)} — Stats cumulées</h2>
      <p class="muted" style="font-size:12px;margin-top:-6px;">Stats additionnées de tous les joueurs de chaque équipe, sur tous les matchs.</p>
      <div class="team-compare">
        ${col(tn.a,this.teamLogoTag('A',14),a)}
        ${col(tn.b,this.teamLogoTag('B',14),b)}
      </div>
      <hr class="sep">
      <h3 style="font-size:15px;">🔮 Qui a le plus de chances de gagner ?</h3>
      <p class="muted" style="font-size:11.5px;margin-top:-6px;">Petit indice maison basé sur le taux de victoire, les buts par match et la note moyenne — pour le fun, pas une science exacte !</p>
      <div class="kv" style="border:none;"><span>${this.teamLogoTag('A',14)} ${esc(tn.a)}</span><b>${chanceA}%</b></div>
      <div style="height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:2px 0 8px;"><div style="height:100%;width:${chanceA}%;background:var(--accent2);"></div></div>
      <div class="kv" style="border:none;"><span>${this.teamLogoTag('B',14)} ${esc(tn.b)}</span><b>${chanceB}%</b></div>
      <div style="height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:2px 0 4px;"><div style="height:100%;width:${chanceB}%;background:var(--gold);"></div></div>
    </div>`;
  },
  setStatsSearch(v){ this.state.statsSearch = v; this.render(); },

  setStatsSort(key){

  renderStatsTable(){
    const search = this.state.statsSearch;
    const key = this.state.statsSortKey || 'goals';
    const dir = this.state.statsSortDir || 'desc';
    const cols = [
      {key:'name', label:'Joueur'},
      {key:'goals', label:'⚽ Buts'},
      {key:'assists', label:'🎯 Passes'},
      {key:'cornersScored', label:'⛳ Coufrans'},
      {key:'penaltiesScored', label:'✅ Pen.'},
      {key:'tacklesWon', label:'🛡️ Tacles'},
      {key:'yellow', label:'🟨'},
      {key:'red', label:'🟥'},
      {key:'matchesPlayed', label:'MJ'},
      {key:'avgRating', label:'⭐ Moy.', fmt:v=>v?v.toFixed(1):'–'},
    ];
    let rows = this.state.players.filter(p=> !search || norm(p.name).includes(norm(search))).map(p=>{
      const s = this.computePlayerStats(p.name);
      return {name:p.name, id:p.id, ...s};
    });
    rows.sort((a,b)=>{
      let av=a[key], bv=b[key];
      if(key==='name'){ av=norm(av||""); bv=norm(bv||""); return dir==='asc'? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0); }
      av = av||0; bv = bv||0;
      return dir==='asc'? av-bv : bv-av;
    });

            ${cols.map(c=>`<th style="cursor:pointer;white-space:nowrap;" onclick="App.setStatsSort('${c.key}')">${c.label}${key===c.key?(dir==='desc'?' ▼':' ▲'):''}</th>`).join("")}

      ${(()=>{ const mv=this.marketValueTrend(p.name); const arrow=mv.dir==='up'?'▲':mv.dir==='down'?'▼':'▬'; const col=mv.dir==='up'?'var(--accent2)':mv.dir==='down'?'var(--danger)':'var(--text-muted)';
        const chartOpen = this.state.expandedValueChart && this.state.expandedValueChart[p.name];
        return `<div class="kv" style="border:none;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:8px 0 4px;">
          <span>💰 Valeur marchande</span>
          <b style="text-align:right;">${this.formatMarketValue(mv.value)} <span style="color:${col};">${arrow}${mv.dir!=='flat'?' '+(mv.pct>=0?'+':'')+mv.pct.toFixed(1)+'%':''}</span></b>
        </div>
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:8px;" onclick="App.toggleValueChart('${jsa(p.name)}')">📈 ${chartOpen?'Masquer':'Voir'} l'évolution de la valeur</button>
        ${chartOpen? this.renderValueHistoryChart(p.name):''}`; })()}
      <hr class="sep">
      <div class="stat-grid">
        <div class="kv"><span>Buts marqués</span><b>${s.goals}</b></div>
        <div class="kv"><span>⚽ Buts / match (moy.)</span><b>${perMatchStr(s.goals, s.matchesPlayed)}</b></div>
        <div class="kv"><span>🎯 Buts sur coup franc</span><b>${s.freekickScored}</b></div>
        <div class="kv"><span>Passes décisives</span><b>${s.assists}</b></div>
        <div class="kv"><span>Penaltys marqués</span><b>${s.penaltiesScored}</b></div>
        <div class="kv"><span>Penaltys loupés</span><b>${s.penaltiesMissed}</b></div>
        <div class="kv"><span>🎯 Taux de réussite penalty</span><b>${pctStr(s.penaltiesScored, s.penaltiesScored+s.penaltiesMissed)}</b></div>
        <div class="kv"><span>🚫 Penaltys provoqués (faute)</span><b>${s.penaltiesCaused}</b></div>
        <div class="kv"><span>Coufrans marqués</span><b>${s.cornersScored}</b></div>
        <div class="kv"><span>Coufrans tirés</span><b>${s.cornersTaken}</b></div>

  computeClubTotals(){
    let goals=0, assists=0, yellow=0, red=0, cornersScored=0, cornersTaken=0, penaltiesScored=0, penaltiesMissed=0, penaltiesCaused=0,
        shotsOnTarget=0, tacklesWon=0, saves=0, penaltiesSaved=0, penaltiesConceded=0;
    this.state.players.forEach(p=>{
      const s = this.computePlayerStats(p.name);
      goals+=s.goals; assists+=s.assists; yellow+=s.yellow; red+=s.red;
      cornersScored+=s.cornersScored; cornersTaken+=s.cornersTaken;
      penaltiesScored+=s.penaltiesScored; penaltiesMissed+=s.penaltiesMissed; penaltiesCaused+=s.penaltiesCaused;
      shotsOnTarget+=s.shotsOnTarget; tacklesWon+=s.tacklesWon; saves+=s.saves; penaltiesSaved+=s.penaltiesSaved; penaltiesConceded+=s.penaltiesConceded;
    });
    return {goals, assists, yellow, red, cornersScored, cornersTaken, penaltiesScored, penaltiesMissed, penaltiesCaused, shotsOnTarget, tacklesWon, saves, penaltiesSaved, penaltiesConceded};
  },

  renderPaymentSection(m){
    const pay = m.payment || {enabled:false, amount:0, paid:{}};

    const received = paidCount * (pay.amount||0);
    return `
    <div class="card tight" style="margin:10px 0;background:var(--surface-2);">

        <div class="kv"><span>Reçu / attendu</span><b>${received.toFixed(2)}€ / ${expected.toFixed(2)}€</b></div>
        <div class="kv"><span>Ont payé</span><b>${paidCount} / ${total}</b></div>
        <hr class="sep" style="margin:8px 0;">
        ${roster.map(n=>{
          const isPaid = pay.paid && pay.paid[n];
          return `<div class="presence-row">
            <span class="nm">${esc(n)}</span>
            <button class="pbtn ${isPaid?'on-present':''}" ${this.admin?`onclick="App.togglePlayerPaid('${m.id}','${jsa(n)}')"`:'disabled'}>${isPaid?'✅ Payé':'❌ Pas payé'}</button>

  async togglePlayerPaid(matchId, name){
    if(!this.admin){ toast("Réservé aux capitaines"); return; }
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const already = m.payment && m.payment.paid && m.payment.paid[name];
    await this.db.collection("matches").doc(matchId).update({payment:{paid:{[name]: !already}}});
  },
  computePaymentSummary(){
    const byPlayer = {};
    let totalExpected=0, totalReceived=0;
    this.state.matches.forEach(m=>{
      const pay = m.payment;
      if(!pay || !pay.enabled) return;
      const roster = uniq([...(m.convoked||[]), ...Object.keys(pay.paid||{})]);
      roster.forEach(n=>{
        if(!byPlayer[n]) byPlayer[n] = {owed:0, paidCount:0, unpaidCount:0};
        const isPaid = pay.paid && pay.paid[n];
        totalExpected += pay.amount||0;
        if(isPaid){ byPlayer[n].paidCount++; totalReceived += pay.amount||0; }
        else { byPlayer[n].unpaidCount++; byPlayer[n].owed += pay.amount||0; }
      });
    });
    const unpaidList = Object.entries(byPlayer).filter(([n,v])=>v.owed>0).map(([name,v])=>({name, ...v})).sort((a,b)=>b.owed-a.owed);
    return {byPlayer, unpaidList, totalExpected, totalReceived};
  },
  renderPaymentSummarySection(){
    if(!this.admin) return "";
    const sum = this.computePaymentSummary();
    if(sum.totalExpected===0) return "";
    return `
    <div class="card">
      <h2>💰 Bilan des paiements</h2>
      <div class="kv"><span>Reçu / attendu (saison)</span><b>${sum.totalReceived.toFixed(2)}€ / ${sum.totalExpected.toFixed(2)}€</b></div>
      ${sum.unpaidList.length===0 ? `<p class="muted" style="font-size:12.5px;">Tout le monde est à jour ! 🎉</p>` : `
        <hr class="sep">
        <h3 style="font-size:14px;">💸 À relancer</h3>
        ${sum.unpaidList.map(u=>`<div class="kv"><span>${esc(u.name)}</span><b>${u.owed.toFixed(2)}€ (${u.unpaidCount} match${u.unpaidCount>1?'s':''})</b></div>`).join("")}
      `}
    </div>`;
  },

  renderTeamCompare(nm){
    const teamA = nm.teamA||[], teamB = nm.teamB||[];

      return {count:roster.length, avg: ratingsAll.length?avg(ratingsAll):null, goals};

  async assignTeam(matchId, name, team){
    const m = this.state.matches.find(x=>x.id===matchId);
    let teamA = (m.teamA||[]).filter(n=>n!==name);
    let teamB = (m.teamB||[]).filter(n=>n!==name);
    if(team==='A') teamA.push(name); else teamB.push(name);
    let convoked = uniq([...(m.convoked||[]), name]);
    // .update() (pas .set()) : ne touche que teamA/teamB/convoked. Un .set() aurait réécrit TOUT le
    // document avec la copie locale de "m", donc si un autre champ (ex: des notes) avait été modifié par
    // quelqu'un d'autre entre-temps et pas encore reçu sur cet appareil, ce .set() l'aurait effacé.
    await this.db.collection("matches").doc(matchId).update({teamA, teamB, convoked});

  domSafe(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,'_'); },
  renderMovesSvg(slots, moves, targetId){
    const safeT = this.domSafe(targetId);
    if(!moves || !moves.length) return `<svg class="pitch-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>`;
    const byKey = {}; slots.forEach(s=>byKey[s.k]=s);
    const parts = moves.map((mv,i)=>{
      const from = byKey[mv.from], to = byKey[mv.to];
      if(!from || !to) return "";
      return `
        <line x1="${from.l}" y1="${from.t}" x2="${to.l}" y2="${to.t}" stroke="#FFD84A" stroke-width="1" marker-end="url(#arrowhead-${safeT})" opacity="0.9"></line>
        <circle class="mv-marker" r="2" fill="#FF5A5A" cx="${from.l}" cy="${from.t}" opacity="0">
          <animateMotion id="anim-${safeT}-${i}" begin="indefinite" dur="1.1s" fill="freeze" path="M${from.l},${from.t} L${to.l},${to.t}"></animateMotion>
          <animate attributeName="opacity" begin="anim-${safeT}-${i}.begin" dur="0.05s" to="1" fill="freeze"></animate>
        </circle>`;
    }).join("");
    return `<svg class="pitch-svg" data-target="${esc(targetId)}" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><marker id="arrowhead-${safeT}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#FFD84A"></path></marker></defs>
      ${parts}
    </svg>`;
  },
  toggleDrawMode(target){
    if(this.draw.target === target){ this.draw.target = null; this.draw.pending = null; }
    else { this.draw.target = target; this.draw.pending = null; }
    this.render();
  },
  handleDrawTap(target, slotKey){
    if(this.draw.pending === slotKey){ this.draw.pending = null; this.render(); return; }
    if(!this.draw.pending){ this.draw.pending = slotKey; this.render(); return; }
    const from = this.draw.pending, to = slotKey;
    this.draw.pending = null;
    this.render();
    this.commitMove(target, from, to);
  },
  async commitMove(target, from, to){
    const parts = target.split("|");
    if(parts[0]==='match'){
      const matchId = parts[1], tacticKey = parts[2];
      const m = this.state.matches.find(x=>x.id===matchId);
      if(!m) return;
      const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}, moves:[]};
      const moves = [...(tactic.moves||[]), {from, to}];
      await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, moves}});
    } else if(parts[0]==='bestxi'){
      const view = parts[1];
      const data = this.getBestXIData(view);
      const v = data.variants.find(x=>x.id===data.activeId);
      if(v){ v.moves = [...(v.moves||[]), {from, to}]; await this.saveBestXIData(view, data); }
    }
  },
  async clearMoves(target){
    const parts = target.split("|");
    if(parts[0]==='match'){
      const matchId = parts[1], tacticKey = parts[2];
      const m = this.state.matches.find(x=>x.id===matchId);
      if(!m) return;
      const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}, moves:[]};
      await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, moves:[]}});
    } else if(parts[0]==='bestxi'){
      const view = parts[1];
      const data = this.getBestXIData(view);
      const v = data.variants.find(x=>x.id===data.activeId);
      if(v){ v.moves = []; await this.saveBestXIData(view, data); }
    }
  },
  async removeMove(target, idx){
    const parts = target.split("|");
    if(parts[0]==='match'){
      const matchId = parts[1], tacticKey = parts[2];
      const m = this.state.matches.find(x=>x.id===matchId);
      if(!m) return;
      const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}, moves:[]};
      const moves = (tactic.moves||[]).filter((_,i)=>i!==idx);
      await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation:tactic.formation, moves}});
    } else if(parts[0]==='bestxi'){
      const view = parts[1];
      const data = this.getBestXIData(view);
      const v = data.variants.find(x=>x.id===data.activeId);
      if(v){ v.moves = (v.moves||[]).filter((_,i)=>i!==idx); await this.saveBestXIData(view, data); }
    }
  },
  animateMoves(target){
    const svgs = document.querySelectorAll(`svg[data-target="${target}"]`);
    if(!svgs.length){ toast("Aucune flèche à animer"); return; }
    svgs.forEach(svg=>{
      const anims = svg.querySelectorAll('animateMotion');
      anims.forEach((a,i)=>{
        const circle = a.closest('circle');
        if(circle) circle.setAttribute('opacity','0');
        setTimeout(()=>{ try{ a.beginElement(); }catch(e){} }, i*260);
      });
    });
    toast("▶️ Animation des déplacements");
  },
  renderDrawTools(target, moves){
    const drawing = this.draw.target === target;
    if(!this.admin) return "";
    return `
      <div class="draw-tools">
        <button class="btn btn-ghost btn-sm" onclick="App.toggleDrawMode('${target}')">${drawing? '✅ Terminer le dessin' : '✏️ Dessiner un déplacement'}</button>
        ${moves.length? `<button class="btn btn-ghost btn-sm" onclick="App.animateMoves('${target}')">▶️ Animer</button>
        <button class="btn btn-ghost btn-sm" onclick="App.clearMoves('${target}')">🗑️ Effacer les flèches</button>` : ""}
      </div>
      ${drawing? `<p class="muted" style="font-size:11px;margin-top:6px;">Touche un poste de départ puis un poste d'arrivée pour tracer une flèche de déplacement.</p>` : ""}
      ${moves.length? `<div class="moves-list">${moves.map((mv,i)=>`<div class="kv"><span>➡️ ${esc(mv.from)} → ${esc(mv.to)}</span><span class="mini-x" onclick="App.removeMove('${target}', ${i})">✕</span></div>`).join("")}</div>` : ""}
    `;
  },
  renderTacticBoard(nm, tacticKey, pool, label, opts){
    opts = opts||{};
    const tactic = nm[tacticKey];
    const formation = (tactic&&tactic.formation) || "4-3-3";
    const assignments = (tactic&&tactic.assignments) || {};
    const moves = (tactic&&tactic.moves) || [];
    const slots = this.FORMATIONS[formation];
    const target = `match|${nm.id}|${tacticKey}`;
    const drawing = this.draw.target === target;
    const pending = drawing ? this.draw.pending : null;
    return `
    <div>
      ${label? `<p class="muted" style="font-size:12.5px;font-weight:700;margin:0 0 6px;">${label}</p>`:""}
      ${this.admin ? `
        <label class="field">Formation
          <select onchange="App.setFormation('${nm.id}','${tacticKey}', this.value)">
            ${Object.keys(this.FORMATIONS).map(f=>`<option value="${f}" ${f===formation?'selected':''}>${f}</option>`).join("")}
          </select>
        </label>` : `<p class="muted" style="font-size:13px;">Formation : <b>${formation}</b></p>`}
      <div class="pitch ${drawing?'drawmode':''}">
        ${this.renderMovesSvg(slots, moves, target)}
        ${slots.map(s=>{
          const assigned = assignments[s.k];
          const isPending = pending===s.k;
          return `<div class="slot ${assigned?'':'empty'} ${isPending?'pending':''}" style="top:${s.t}%;left:${s.l}%;" ${this.admin?`onclick="App.tacticSlotClick('${nm.id}','${tacticKey}','${s.k}')"`:''}>
            <div class="dot">${assigned? initials(assigned) : s.k.replace(/[0-9]/g,'')}</div>
            <div class="lb">${assigned? esc(assigned).split(' ')[0] : s.k}</div>
          </div>`;
        }).join("")}
      </div>
      ${!this.admin && pool.length===0 ? `<p class="muted" style="margin-top:8px;">Composition à venir.</p>` : ""}
      ${this.renderDrawTools(target, moves)}
      <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="App.shareMatchTacticToChat('${nm.id}','${tacticKey}')">📤 Partager dans le chat</button>
    </div>`;
  },
  async shareMatchTacticToChat(matchId, tacticKey){
    const m = this.state.matches.find(x=>x.id===matchId);
    if(!m) return;
    const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}};
    const formation = tactic.formation || "4-3-3";
    const slots = this.FORMATIONS[formation];
    const assignments = tactic.assignments || {};
    const tn = this.teamNames();
    const label = tacticKey==='tacticA' ? tn.a : tacticKey==='tacticB' ? tn.b : "Général";
    const channel = tacticKey==='tacticA' ? 'A' : tacticKey==='tacticB' ? 'B' : 'general';
    const lines = slots.filter(s=>assignments[s.k]).map(s=>`${s.k} — ${assignments[s.k]}`);
    const header = `🧠 Composition${m.opponent? ' vs '+m.opponent:''} (${label}) — ${formation}`;
    const text = header + "\n" + (lines.length? lines.join("\n") : "(pas encore remplie)");
    this.ensureMe(async (me)=>{
      await this.db.collection("messages").add({channel, author:me, text, createdAt:new Date().toISOString()});
      toast("Composition partagée dans le chat ("+(channel==='general'?'Général':label)+")");
    });
  },
  async setFormation(matchId, tacticKey, formation){
    await this.db.collection("matches").doc(matchId).update({[tacticKey]:{formation, assignments:{}, moves:[]}});
  },
  tacticSlotClick(matchId, tacticKey, slotKey){
    const target = `match|${matchId}|${tacticKey}`;
    if(this.draw.target === target){ this.handleDrawTap(target, slotKey); return; }
    this.openSlotPicker(matchId, tacticKey, slotKey);
  },
  openSlotPicker(matchId, tacticKey, slotKey){
    const m = this.state.matches.find(x=>x.id===matchId);
    let pool;
    if(tacticKey==='tacticA' || tacticKey==='tacticB'){
      // any convoked player can be placed here — doing so assigns them to this team
      pool = uniq([...(m.convoked||[]), ...(m.teamA||[]), ...(m.teamB||[])]);
    } else {
      pool = uniq([...(m.teamA||[]), ...(m.teamB||[]), ...(m.convoked||[])]);
    }
    const teamHint = (tacticKey==='tacticA' || tacticKey==='tacticB') ? "Placer un nom ici l'ajoute automatiquement à cette équipe." : "";
    this.modal(`
      <h3>Poste : ${slotKey}</h3>
      ${teamHint? `<p class="muted" style="font-size:11.5px;margin-top:-4px;">${teamHint}</p>`:""}
      <div class="wrap">
        <span class="chip" onclick="App.assignSlot('${matchId}','${tacticKey}','${slotKey}','')">Vider</span>
        ${pool.map(n=>`<span class="chip" onclick="App.assignSlot('${matchId}','${tacticKey}','${slotKey}','${jsa(n)}')">${esc(n)}</span>`).join("") || "<p class='muted'>Convoque des joueurs d'abord.</p>"}
      </div>
    `);
  },
  async assignSlot(matchId, tacticKey, slotKey, name){
    const m = this.state.matches.find(x=>x.id===matchId);
    const tactic = m[tacticKey] || {formation:"4-3-3", assignments:{}};
    const assignments = {...(tactic.assignments||{})};
    if(name) assignments[slotKey]=name; else delete assignments[slotKey];
    const patch = {[tacticKey]:{formation:tactic.formation, assignments}};
    if(name && (tacticKey==='tacticA' || tacticKey==='tacticB')){
      const teamA = (m.teamA||[]).filter(n=>n!==name);
      const teamB = (m.teamB||[]).filter(n=>n!==name);
      if(tacticKey==='tacticA') teamA.push(name); else teamB.push(name);
      patch.teamA = teamA; patch.teamB = teamB;
    }
    await this.db.collection("matches").doc(matchId).update(patch);
    this.closeModal();
  },

  /* ---------- Meilleur 11 : global + par équipe (composition évolutive, indépendante d'un match, avec variantes) ---------- */
  bestXIField(view){ return view==='A' ? 'bestXI_A' : view==='B' ? 'bestXI_B' : 'bestXI_general'; },
  bestXIRoster(view){
    if(view==='general') return this.state.players.map(p=>p.name);
    return this.state.players.filter(p=>p.team===view).map(p=>p.name);
  },
  getBestXIData(view){
    const info = this.state.info || this.defaultInfo();
    const field = this.bestXIField(view);
    const raw = info[field];
    if(raw && Array.isArray(raw.variants) && raw.variants.length){
      const activeId = (raw.activeId && raw.variants.some(v=>v.id===raw.activeId)) ? raw.activeId : raw.variants[0].id;
      return {variants: raw.variants.map(v=>({moves:[], ...v})), activeId};
    }
    const legacy = raw || {formation:"4-3-3", assignments:{}};
    const v = {id:"v1", name:"Variante 1", formation: legacy.formation||"4-3-3", assignments: legacy.assignments||{}, moves: legacy.moves||[]};
    return {variants:[v], activeId:"v1"};
  },
  activeBestXIVariant(view){
    const data = this.getBestXIData(view);
    return data.variants.find(v=>v.id===data.activeId) || data.variants[0];
  },
  async saveBestXIData(view, data){
    const info = this.state.info || this.defaultInfo();
    const field = this.bestXIField(view);
    await this.db.doc("team/info").set({...info, [field]: data});
  },

    const data = this.getBestXIData(view);
    const id = "v"+Date.now();
    data.variants.push({id, name:"Variante "+(data.variants.length+1), formation:"4-3-3", assignments:{}, moves:[]});
    data.activeId = id;
    await this.saveBestXIData(view, data);
  },

    data.activeId = id;

    const v = data.variants.find(x=>x.id===id);
    if(v) v.name = name.trim().slice(0,40);

  async saveResult(matchId){
    const m = this.state.matches.find(x=>x.id===matchId);
    const convoked = m.convoked||[];
    const roster = uniq([...convoked, ...this.state.players.map(p=>p.name)]);
    const opponent = document.getElementById("rOpp").value.trim();
    const date = document.getElementById("rDate").value;
    const time = document.getElementById("rTime").value;
    const location = document.getElementById("rLoc").value.trim();
    const jerseyHome = document.getElementById("rJh").value.trim();
    const jerseyAway = document.getElementById("rJa").value.trim();
    const us = parseInt(document.getElementById("rUs").value,10)||0;
    const them = parseInt(document.getElementById("rThem").value,10)||0;
    const out = {};
    this.STAT_COLS.forEach(c=>{ out[c.key] = []; });
    roster.forEach(n=>{
      this.STAT_COLS.forEach(c=>{
        const el = document.getElementById(`rc-${c.id}-${slugify(n)}`);
        const v = el ? (parseInt(el.value,10)||0) : 0;
        if(v>0) out[c.key].push({name:n, count:v});
      });
    });
    await this.db.collection("matches").doc(matchId).update({
      opponent, date, time, location, jerseyHome, jerseyAway,
      played:true, score:{us,them},
      scorers: out.goals, freekickScored: out.freekick, assists: out.assists,
      penaltiesScored: out.penScored, penaltiesMissed: out.penMissed, penaltiesCaused: out.penCaused,
      cornersScored: out.cornersScored, cornersTaken: out.cornersTaken, shotsOnTarget: out.shots, tacklesWon: out.tackles,
      saves: out.saves, penaltiesSaved: out.penSaved, penaltiesConceded: out.penConceded,
      minutesPlayed: out.minutes,
      cardsYellow: out.yellow, cardsRed: out.red,
    });
    await this.settleBetsForMatch(matchId, {us, them, scorers: out.goals, freekick: out.freekick, penScored: out.penScored, allGoals: this.matchGoalScorers({scorers: out.goals, freekickScored: out.freekick, cornersScored: out.cornersScored, penaltiesScored: out.penScored})});
    this.closeModal();
    toast("Match enregistré");
  },
