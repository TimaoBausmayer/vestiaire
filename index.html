          ${item.caption? `<p style="font-size:13.5px;margin:6px 0;">${esc(item.caption)}</p>`:""}
          ${!item.caption && this.admin? `<p class="muted" style="font-size:12px;margin:4px 0;">Aucune description. <a href="#" onclick="event.preventDefault();App.openEditMedia('${kind}','${id}')">En ajouter une</a>.</p>`:""}
          <button class="chip ${likedByMe?'active':''}" style="margin:6px 0 10px;" onclick="App.toggleLike('${kind}','${id}')">❤️ J'aime (${likeCount})</button>

              comments.map((c,i)=>`

                  <div><b>${esc(c.author)}</b>${this.roleBadge(c.author)} ${esc(c.text)}</div>
                  ${this.admin? `<button class="btn btn-ghost btn-sm" onclick="App.deleteComment('${kind}','${id}',${i})">✕</button>`:""}
                </div>
              `).join("")}
          </div>

            <button class="btn btn-accent btn-sm" onclick="App.addComment('${kind}','${id}')">Envoyer</button>
          </div>
        </div>
      </div>
    `;
  },
  async deleteItem(kind, id){
    await this.db.collection(kind==='story'?'stories':'media').doc(id).delete();
    this.closeLightbox();
    toast("Supprimé");
  },
  // Après un like/commentaire/modif sur une story pendant qu'on est dans le visualiseur façon Instagram :
  // on rouvre CE visualiseur à la même position (avec la donnée fraîche), pas la fiche "lightbox" classique
  // (qui n'a pas la navigation entre stories). Pour les médias (galerie), rien ne change.
  reopenViewerAfterAction(kind, id){
    if(kind==='story'){
      const item = this.state.stories.find(x=>x.id===id);
      const author = this.state.storyViewerAuthor!=null ? this.state.storyViewerAuthor : (item && item.author);
      const idx = this.state.storyViewerIndex||0;
      if(author!=null) setTimeout(()=>this.openStoryViewer(author, idx), 80);
    } else {
      setTimeout(()=>this.openLightbox(kind,id), 80);
    }
  },
  // Visualiseur de stories façon Instagram : un rond par personne dans le bandeau, et ici on peut défiler
  // d'une story à l'autre de la MÊME personne (barres de progression en haut, zones tactiles gauche/droite)
  // sans jamais ressortir vers le bandeau. `author` identifie le groupe (activeStoryGroups()), `index` la
  // position dans ses stories, triées de la plus ancienne à la plus récente. Dépasser la dernière story du
  // groupe passe au groupe (à la personne) suivant, comme sur Instagram ; avant la première ne fait rien.
  openStoryViewer(author, index){
    const groups = this.activeStoryGroups();
    let gi = groups.findIndex(g=>g.author===author);
    if(gi<0){ this.closeLightbox(); return; }
    let group = groups[gi];
    if(index<0){
      if(gi===0) return; // déjà tout au début : on ne fait rien, comme Instagram
      group = groups[gi-1];
      author = group.author;
      index = group.stories.length-1;
    } else if(index>=group.stories.length){
      if(gi>=groups.length-1){ this.closeLightbox(); return; } // dernière story de la dernière personne : on ferme
      group = groups[gi+1];
      author = group.author;
      index = 0;
    }
    const item = group.stories[index];
    if(!item){ this.closeLightbox(); return; }
    this.state.storyViewerAuthor = author;
    this.state.storyViewerIndex = index;
    const likeCount = Object.values(item.likes||{}).filter(Boolean).length;
    const likedByMe = this.me && item.likes && item.likes[slugify(this.me)];
    const comments = item.comments||[];
    document.getElementById("lightboxRoot").innerHTML = `
      <div class="lightbox-back">
        <button class="lightbox-close" onclick="App.closeLightbox()">✕</button>
        <div class="lightbox-media" style="position:relative;">
          <div style="position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:3;">
            ${group.stories.map((_,i)=>`<div style="flex:1;height:3px;border-radius:2px;background:${i<=index?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.35)'};"></div>`).join("")}
          </div>
          <div style="position:absolute;top:0;bottom:0;left:0;width:35%;z-index:2;cursor:pointer;" onclick="App.storyViewerPrev()" title="Précédent"></div>
          <div style="position:absolute;top:0;bottom:0;right:0;width:65%;z-index:2;cursor:pointer;" onclick="App.storyViewerNext()" title="Suivant"></div>
          ${item.type==='photo' ? `<img src="${item.src}" style="pointer-events:none;">` :
            (item.src && item.src.startsWith('data:video') ?
              `<video autoplay controls playsinline src="${item.src}" style="max-width:100%;max-height:100%;"></video>` :
              `<a class="openvid" href="${esc(item.src)}" target="_blank" rel="noopener" style="pointer-events:none;">▶️<br>Ouvrir la vidéo</a>`)}
        </div>
        <div class="lightbox-panel">
          <div class="row" style="justify-content:space-between;">
            <div>
              <b>${esc(item.author||"?")}</b>${this.roleBadge(item.author)}
              <span class="muted" style="font-size:12px;"> · ${fmtDateTime(item.createdAt)}</span>
              ${group.stories.length>1? `<div class="muted" style="font-size:11px;">Story ${index+1}/${group.stories.length}</div>`:""}
            </div>
            ${this.admin? `<span class="row" style="gap:6px;">
              <button class="btn btn-ghost btn-sm" onclick="App.openEditMedia('story','${item.id}')">✏️ Modifier</button>
              <button class="btn btn-ghost btn-sm" onclick="App.deleteItem('story','${item.id}')">🗑️ Supprimer</button>
            </span>`:""}
          </div>
          ${this.renderAuthorStatChip(item.author)}
          ${item.caption? `<p style="font-size:13.5px;margin:6px 0;white-space:pre-wrap;">${esc(item.caption)}</p>`:""}
          <button class="chip ${likedByMe?'active':''}" style="margin:6px 0 10px;" onclick="App.toggleLike('story','${item.id}')">❤️ J'aime (${likeCount})</button>
          <hr class="sep" style="margin:6px 0 10px;">
          <div id="commentsList">
            ${comments.length===0? `<p class="muted" style="font-size:12.5px;">Aucun commentaire.</p>` :
              comments.map((c,i)=>`
                <div class="comment-item">
                  <div><b>${esc(c.author)}</b>${this.roleBadge(c.author)} ${esc(c.text)}</div>
                  ${this.admin? `<button class="btn btn-ghost btn-sm" onclick="App.deleteComment('story','${item.id}',${i})">✕</button>`:""}
                </div>
              `).join("")}
          </div>
          <div class="row" style="margin-top:10px;">
            <input type="text" id="newComment" placeholder="Écrire un commentaire...">
            <button class="btn btn-accent btn-sm" onclick="App.addComment('story','${item.id}')">Envoyer</button>
          </div>
        </div>
      </div>
    `;
  },
  storyViewerNext(){
    if(this.state.storyViewerAuthor==null) return;
    this.openStoryViewer(this.state.storyViewerAuthor, (this.state.storyViewerIndex||0)+1);
  },
  storyViewerPrev(){
    if(this.state.storyViewerAuthor==null) return;
    this.openStoryViewer(this.state.storyViewerAuthor, (this.state.storyViewerIndex||0)-1);
  },
  async toggleLike(kind, id){
    this.ensureMe(async (me)=>{
      const col = kind==='story'?'stories':'media';
      const item = this.state[col].find(x=>x.id===id);
      if(!item) return;
      const already = item.likes && item.likes[slugify(me)];
      await this.db.collection(col).doc(id).update({likes:{[slugify(me)]: !already}});
      this.reopenViewerAfterAction(kind, id);
    });
  },
  async addComment(kind, id){
    const input = document.getElementById("newComment");
    const text = input.value.trim();
    if(!text) return;
    this.ensureMe(async (me)=>{
      const col = kind==='story'?'stories':'media';
      const item = this.state[col].find(x=>x.id===id);
      if(!item) return;
      const comments = [...(item.comments||[]), {author:me, text, at:new Date().toISOString()}];
      await this.db.collection(col).doc(id).update({comments});
      this.reopenViewerAfterAction(kind, id);
    });
  },
  async deleteComment(kind, id, idx){
    const col = kind==='story'?'stories':'media';
    const item = this.state[col].find(x=>x.id===id);
    if(!item) return;
    const comments = (item.comments||[]).filter((_,i)=>i!==idx);
    await this.db.collection(col).doc(id).update({comments});
    this.reopenViewerAfterAction(kind, id);
  },

  /* ============================= TAB 3 : Recrues & Cartes FUT ============================= */
  // Mêmes 6 critères que sur les cartes FUT (Recrues), pour que les votes après-match aient un vrai
  // impact sur les attributs affichés sur la carte du joueur. Critères dédiés et adaptés (façon FIFA) pour les gardiens.
  RATING_CRITERIA:{
    outfield:[
      {key:"vitesse", label:"🏃 Vitesse"},
      {key:"tir", label:"🎯 Tir"},
      {key:"passe", label:"🎯 Passe"},
      {key:"dribble", label:"🕺 Dribble"},
      {key:"defense", label:"🛡️ Défense"},
      {key:"physique", label:"💪 Physique"},
      {key:"global", label:"⭐ Note globale"},
    ],
    gk:[
      {key:"plongeon", label:"🤸 Plongeon"},
      {key:"relances", label:"🦶 Relances"},
      {key:"reflexes", label:"⚡ Réflexes"},
      {key:"placement", label:"📍 Placement"},
      {key:"autorite", label:"📢 Autorité de surface"},
      {key:"vitesseGk", label:"🏃 Vitesse"},
      {key:"global", label:"⭐ Note globale"},
    ],
  },
  ratingCriteriaFor(position){ return position==='Gardien' ? this.RATING_CRITERIA.gk : this.RATING_CRITERIA.outfield; },
  computePlayerStats(name, opts){
    let matches;
    if(opts && typeof opts==='object' && opts.includeIds){
      const idSet = new Set(opts.includeIds);
      matches = this.state.matches.filter(m=>m.played && idSet.has(m.id));
    } else {
      const excludeMatchId = opts;
      matches = this.state.matches.filter(m=>m.played && m.id!==excludeMatchId);
    }
    const player = this.state.players.find(p=>p.name===name);
    const manual = (player && player.manualStats) || {};
    const critList = this.ratingCriteriaFor(player && player.position);
    const critSums = {}, critCounts = {};
    critList.forEach(c=>{ critSums[c.key]=0; critCounts[c.key]=0; });
    let openPlayGoals=manual.goals||0, freekickScored=manual.freekickScored||0, assists=manual.assists||0, ratingsSum=0, ratingsCount=0, mvp=0, matchesPlayed=0, goalsConceded=0,
        timesStarter=manual.timesStarter||0, timesSub=manual.timesSub||0,
        yellow=manual.yellow||0, red=manual.red||0, worstVotesTotal=0, beautifulGoalVotesTotal=0, W=0, D=0, L=0,
        penaltiesScored=manual.penaltiesScored||0, penaltiesMissed=manual.penaltiesMissed||0, penaltiesCaused=manual.penaltiesCaused||0,
        cornersScored=manual.cornersScored||0, cornersTaken=manual.cornersTaken||0, freekickTaken=manual.freekickTaken||0,
        shotsOnTarget=manual.shotsOnTarget||0, tacklesWon=manual.tacklesWon||0,
        saves=manual.saves||0, penaltiesSaved=manual.penaltiesSaved||0, penaltiesConceded=manual.penaltiesConceded||0,
        minutesPlayed=manual.minutesPlayed||0, matchVoteBest=0, matchVoteWorst=0, matchRankSum=0, matchRankCount=0;
    // Version "pondérée" de ces mêmes totaux, utilisée UNIQUEMENT pour calculer le général (cardRating) :
    // chaque match n'y contribue plus pour 1x, mais pour son poids d'importance (voir matchWeight / le
    // barème IMPORTANCE_BAREME) — un match noté 1/10 pèse 5x moins qu'un match "normal" (5/10, poids 1x),
    // un match noté 10/10 pèse 2x plus. Les stats manuelles (import, sans match associé) gardent un poids
    // normal (1x). Les totaux BRUTS ci-dessus restent inchangés et continuent d'alimenter les classements
    // (Buteur, Passeur, etc.) et les fiches joueur, qui doivent rester de vrais compteurs, pas des valeurs
    // pondérées.
    let wOpenPlayGoals=manual.goals||0, wFreekickScored=manual.freekickScored||0, wCornersScored=manual.cornersScored||0, wPenaltiesScored=manual.penaltiesScored||0,
        wAssists=manual.assists||0, wRatingsSum=0, wRatingsWeight=0, wMvp=0, wGoalsConceded=0, wGkWeight=0,
        wTimesStarter=manual.timesStarter||0, wMinutesPlayed=manual.minutesPlayed||0,
        wYellow=manual.yellow||0, wRed=manual.red||0, wWorstVotesTotal=0, wBeautifulGoalVotesTotal=0,
        wPenaltiesMissed=manual.penaltiesMissed||0, wPenaltiesCaused=manual.penaltiesCaused||0,
        wShotsOnTarget=manual.shotsOnTarget||0, wTacklesWon=manual.tacklesWon||0,
        wSaves=manual.saves||0, wPenaltiesSaved=manual.penaltiesSaved||0,
        wMatchRankSum=0, wMatchRankWeight=0;
    matches.forEach(m=>{
      const w = this.matchWeight(m);
      // Équipe sur laquelle CE joueur a vraiment joué CE match précis : basé sur m.teamA/m.teamB (la
      // composition réelle du match), pas sur sa fiche permanente (player.team), qui peut changer après
      // coup (transfert). Un joueur transféré doit garder son résultat (victoire/défaite) et ses buts
      // encaissés (gardien) tels qu'ils se sont vraiment passés CE jour-là, même si sa fiche indique
      // aujourd'hui un autre club — l'histoire ne se réécrit pas avec un transfert. On ne retombe sur la
      // fiche permanente que si le joueur n'apparaît dans aucune des deux listes (match trop ancien, stats
      // manuelles sans match associé...).
      const sideInMatch = (m.teamA||[]).includes(name) ? 'A' : ((m.teamB||[]).includes(name) ? 'B' : (player && player.team));
      (m.scorers||[]).forEach(s=>{ if(s.name===name){ openPlayGoals += (s.count||0); wOpenPlayGoals += (s.count||0)*w; } });
      (m.freekickScored||[]).forEach(s=>{ if(s.name===name){ freekickScored += (s.count||0); wFreekickScored += (s.count||0)*w; } });
      (m.assists||[]).forEach(s=>{ if(s.name===name){ assists += (s.count||0); wAssists += (s.count||0)*w; } });
      (m.cardsYellow||[]).forEach(s=>{ if(s.name===name){ yellow += (s.count||0); wYellow += (s.count||0)*w; } });
      (m.cardsRed||[]).forEach(s=>{ if(s.name===name){ red += (s.count||0); wRed += (s.count||0)*w; } });
      (m.penaltiesScored||[]).forEach(s=>{ if(s.name===name){ penaltiesScored += (s.count||0); wPenaltiesScored += (s.count||0)*w; } });
      (m.penaltiesMissed||[]).forEach(s=>{ if(s.name===name){ penaltiesMissed += (s.count||0); wPenaltiesMissed += (s.count||0)*w; } });
      (m.penaltiesCaused||[]).forEach(s=>{ if(s.name===name){ penaltiesCaused += (s.count||0); wPenaltiesCaused += (s.count||0)*w; } });
      (m.cornersScored||[]).forEach(s=>{ if(s.name===name){ cornersScored += (s.count||0); wCornersScored += (s.count||0)*w; } });
      (m.cornersTaken||[]).forEach(s=>{ if(s.name===name) cornersTaken += (s.count||0); });
      (m.freekickTaken||[]).forEach(s=>{ if(s.name===name) freekickTaken += (s.count||0); });
      (m.shotsOnTarget||[]).forEach(s=>{ if(s.name===name){ shotsOnTarget += (s.count||0); wShotsOnTarget += (s.count||0)*w; } });
      (m.tacklesWon||[]).forEach(s=>{ if(s.name===name){ tacklesWon += (s.count||0); wTacklesWon += (s.count||0)*w; } });
      (m.saves||[]).forEach(s=>{ if(s.name===name){ saves += (s.count||0); wSaves += (s.count||0)*w; } });
      (m.penaltiesSaved||[]).forEach(s=>{ if(s.name===name){ penaltiesSaved += (s.count||0); wPenaltiesSaved += (s.count||0)*w; } });
      (m.penaltiesConceded||[]).forEach(s=>{ if(s.name===name) penaltiesConceded += (s.count||0); });
      (m.minutesPlayed||[]).forEach(s=>{ if(s.name===name){ minutesPlayed += (s.count||0); wMinutesPlayed += (s.count||0)*w; } });
      const wasGK = [m.tactic, m.tacticA, m.tacticB].some(t=>t && t.assignments && t.assignments.GK===name);
      if(wasGK && m.score){
        // m.score.us / m.score.them sont toujours du point de vue de l'équipe A ("nous", Mot'eau). Un
        // gardien qui a joué côté équipe B (adverse) CE match encaisse donc nos buts à NOUS (m.score.us),
        // pas m.score.them — sinon son total de buts encaissés était en fait celui du gardien adverse.
        const conceded = (sideInMatch==='B') ? (m.score.us||0) : (m.score.them||0);
        goalsConceded += conceded;
        wGoalsConceded += conceded*w;
        wGkWeight += w;
      }
      // "Convoqué" doit être la source de vérité de "a joué ce match" : décocher quelqu'un dans les
      // convocations doit vraiment le retirer des stats, même s'il reste listé dans l'équipe A/B (l'équipe
      // A/B est la composition/effectif du match, pas la liste de présence). Sans ce garde-fou, un joueur
      // décoché restait quand même compté comme ayant joué dès qu'il figurait dans teamA/teamB — ce qui
      // arrive dès qu'il a été assigné à une équipe puis décoché ensuite. On ne retombe sur teamA/teamB que
      // pour les matchs plus anciens qui n'ont jamais utilisé les convocations (convoked resté vide).
      const wasInvolved = (m.convoked||[]).length
        ? (m.convoked||[]).includes(name)
        : ((m.teamA||[]).includes(name) || (m.teamB||[]).includes(name));
      if(wasInvolved){
        matchesPlayed++;
        const wasStarter = [m.tactic, m.tacticA, m.tacticB].some(t=>t && t.assignments && Object.values(t.assignments).includes(name));
        if(wasStarter){ timesStarter++; wTimesStarter += w; } else timesSub++;
      }
      if(wasInvolved && m.score){
        // Même logique : m.score.us/them est toujours du point de vue de l'équipe A. Le résultat
        // (victoire/nul/défaite) de CE match pour ce joueur dépend du côté où il a VRAIMENT joué ce
        // match-là (sideInMatch), pas de sa fiche permanente — sinon un joueur transféré après coup voit
        // son historique réécrit (ex. un but et une victoire gagnés avec FC Nulos qui deviennent une
        // défaite une fois le joueur transféré à Mot'eau).
        const forPlayer = (sideInMatch==='B') ? (m.score.them||0) : (m.score.us||0);
        const against = (sideInMatch==='B') ? (m.score.us||0) : (m.score.them||0);
        if(forPlayer>against) W++; else if(forPlayer===against) D++; else L++;
      }
      if(m.worstVotes && m.worstVotes[name]){ const n = Object.values(m.worstVotes[name]).filter(Boolean).length; worstVotesTotal += n; wWorstVotesTotal += n*w; }
      if(m.goalVotes && m.goalVotes[name]){ const n = Object.values(m.goalVotes[name]).filter(Boolean).length; beautifulGoalVotesTotal += n; wBeautifulGoalVotesTotal += n*w; }
      const bestVoteInfo = this.matchVotePoints(m.matchVotes, 'best', this.MATCH_VOTE_BEST_SIZE);
      const worstVoteInfo = this.matchVotePoints(m.matchVotes, 'worst', this.MATCH_VOTE_WORST_SIZE);
      const bestAvgPts = bestVoteInfo.raterCount ? (bestVoteInfo.tally[name]||0)/bestVoteInfo.raterCount : 0;
      const worstAvgPts = worstVoteInfo.raterCount ? (worstVoteInfo.tally[name]||0)/worstVoteInfo.raterCount : 0;
      if(bestAvgPts>0) matchVoteBest += bestAvgPts;
      if(worstAvgPts>0) matchVoteWorst += worstAvgPts;
      // Le classement du match (top 10 meilleurs / top 3 pires voté par l'équipe) a maintenant son PROPRE
      // impact sur le général, complètement séparé des notes individuelles (avant, il était juste mélangé
      // dedans avec un poids faible). Sur son échelle -5..+5 par match (même échelle que l'écart des notes
      // à 5/10), moyenné sur tous les matchs où un classement a été voté (0 si le joueur n'y figure pas).
      if(bestVoteInfo.raterCount>0 || worstVoteInfo.raterCount>0){
        const rankPts = (bestAvgPts/this.MATCH_VOTE_BEST_SIZE)*5 - (worstAvgPts/this.MATCH_VOTE_WORST_SIZE)*5;
        matchRankSum += rankPts;
        matchRankCount++;
        wMatchRankSum += rankPts*w;
        wMatchRankWeight += w;
      }
      const r = m.ratings && m.ratings[name];
      if(r){
        const vals = Object.values(r);
        if(vals.length){ const a = avg(vals); ratingsSum += a; ratingsCount++; wRatingsSum += a*w; wRatingsWeight += w; }
      }
      const dr = m.detailedRatings && m.detailedRatings[name];
      if(dr){
        Object.values(dr).forEach(entry=>{
          critList.forEach(c=>{
            if(entry && typeof entry[c.key]==="number"){ critSums[c.key]+=entry[c.key]; critCounts[c.key]++; }
          });
        });
      }
      const mvpInfo = this.matchMVP(m);
      if(mvpInfo && mvpInfo.name===name){ mvp++; wMvp += w; }
    });
    const avgRating = ratingsCount ? (ratingsSum/ratingsCount) : 0;
    const matchRankAvg = matchRankCount ? (matchRankSum/matchRankCount) : 0;
    const wAvgRating = wRatingsWeight ? (wRatingsSum/wRatingsWeight) : 0;
    const wMatchRankAvg = wMatchRankWeight ? (wMatchRankSum/wMatchRankWeight) : 0;
    const criteria = {};
    critList.forEach(c=>{ criteria[c.key] = critCounts[c.key] ? (critSums[c.key]/critCounts[c.key]) : 0; });
    const ballonDorAdj = this.ballonDorAdj(name);
    // Symétrique du Ballon d'Or, mais dans l'autre sens : être désigné "Pire Joueur" (ou cumuler des votes
    // "Pire Action") de la saison doit vraiment faire baisser le général, pas juste ne pas le faire monter —
    // sinon élire quelqu'un pire joueur de la saison n'avait aucun effet sur sa carte, alors que le Ballon d'Or,
    // lui, la fait vraiment monter. Poids plus lourd pour "Pire Joueur" (jugement sur toute la saison) que pour
    // "Pire Action" (un seul moment raté).
    const pireJoueurAdj = this.worstAwardAdj(name, 'pireJoueur', 3) * 6;
    const pireActionAdj = this.worstAwardAdj(name, 'pireAction', 10) * 3;
    // Un but est un but quelle que soit la manière : le total affiché partout (fiche, classement, carte FUT)
    // additionne les buts « en jeu », sur coup franc, sur corner direct et sur penalty. Le détail par type
    // reste disponible séparément (freekickScored, cornersScored, penaltiesScored) pour la note générale,
    // qui elle valorise différemment un but sur coup franc (très dur) et un but sur penalty (plus facile).
    const goals = openPlayGoals + freekickScored + cornersScored + penaltiesScored;
    // Sous-objet dédié au calcul du général : mêmes clés que les stats brutes correspondantes, mais
    // pondérées par l'importance de chaque match (voir commentaire plus haut). cardRating() lit ces
    // valeurs-là, jamais les valeurs brutes ci-dessus.
    const weighted = {
      openPlayGoals: wOpenPlayGoals, freekickScored: wFreekickScored, cornersScored: wCornersScored, penaltiesScored: wPenaltiesScored,
      assists: wAssists, avgRating: wAvgRating, ratingsCount: wRatingsWeight, mvp: wMvp,
      tacklesWon: wTacklesWon, shotsOnTarget: wShotsOnTarget, minutesPlayed: wMinutesPlayed, timesStarter: wTimesStarter,
      penaltiesMissed: wPenaltiesMissed, penaltiesCaused: wPenaltiesCaused, worstVotesTotal: wWorstVotesTotal, beautifulGoalVotesTotal: wBeautifulGoalVotesTotal,
      yellow: wYellow, red: wRed, matchRankAvg: wMatchRankAvg,
      goalsConceded: wGoalsConceded, gkWeight: wGkWeight, saves: wSaves, penaltiesSaved: wPenaltiesSaved,
    };
    return {goals, openPlayGoals, freekickScored, freekickTaken, assists, avgRating, ratingsCount, mvp, matchesPlayed, timesStarter, timesSub, goalsConceded, yellow, red, worstVotesTotal, beautifulGoalVotesTotal, W, D, L, penaltiesScored, penaltiesMissed, penaltiesCaused, cornersScored, cornersTaken, shotsOnTarget, tacklesWon, saves, penaltiesSaved, penaltiesConceded, minutesPlayed, criteria, matchVoteBest, matchVoteWorst, matchRankAvg, ballonDorAdj, pireJoueurAdj, pireActionAdj, position: (player && player.position) || null, weighted};
  },
  // Poids d'un match dans le calcul du général (moyenne pondérée), selon son "importance" (1 à 10, saisie
  // sur la fiche du match). C'est un pur COEFFICIENT dans la moyenne — jamais un bonus ajouté à la note :
  // un match à coefficient 10 compte comme si le joueur avait rejoué 10 fois ce même match "normal" dans la
  // moyenne, pas comme si sa note avait été gonflée. 5/10 = poids normal (1x, comportement identique à avant
  // cette fonctionnalité — c'est aussi la valeur par défaut de tout match sans importance renseignée, donc
  // les anciens matchs ne changent pas de poids). En dessous de 5, le match compte de moins en moins
  // (jusqu'à 0.2x à 1/10, inchangé). Au-dessus de 5, il compte de plus en plus, jusqu'à 10x (comme "10
  // matchs normaux") à 10/10 — avant, le maximum plafonnait à seulement 2x, ce qui ne faisait presque pas
  // bouger le général même sur un match décisif. Seul l'impact sur le général (cardRating) est concerné :
  // les vrais compteurs de buts/passes/etc. et les classements associés ne sont JAMAIS pondérés.
  matchWeight(m){
    const imp = (m && m.importance!=null) ? m.importance : 5;
    if(imp<=5) return imp/5;
    return 1 + (imp-5) * ((10-1)/(10-5));
  },
  IMPORTANCE_BAREME: [
    {min:1, max:2, emoji:'⚪', label:'Entraînement / amical', desc:'impact très faible'},
    {min:3, max:4, emoji:'🔵', label:'Championnat, faible enjeu', desc:'impact faible'},
    {min:5, max:6, emoji:'🟢', label:'Championnat, match normal', desc:'impact normal (référence)'},
    {min:7, max:8, emoji:'🟠', label:'Match important (choc, qualification)', desc:'impact fort'},
    {min:9, max:10, emoji:'🔴', label:'Finale / match décisif', desc:'impact très fort'},
  ],
  importanceInfo(imp){
    imp = (imp==null) ? 5 : imp;
    const tier = this.IMPORTANCE_BAREME.find(t=>imp>=t.min && imp<=t.max) || this.IMPORTANCE_BAREME[2];
    return {emoji:tier.emoji, label:tier.label, desc:tier.desc, value:imp, weight: this.matchWeight({importance:imp})};
  },
  renderImportanceLegend(){
    return `<div class="card tight" style="margin:8px 0;background:var(--surface-2);">
      <p class="muted" style="font-size:11px;margin:0 0 4px;font-weight:700;">🎚️ Barème d'importance (à quel point ce match fait monter/descendre le général)</p>
      ${this.IMPORTANCE_BAREME.map(t=>`<p class="muted" style="font-size:11px;margin:2px 0;">${t.emoji} <b>${t.min===t.max?t.min:t.min+'-'+t.max}</b> — ${esc(t.label)} <span style="opacity:.75;">(${esc(t.desc)})</span></p>`).join("")}
    </div>`;
  },
  renderImportanceField(id, current){
    const val = (current==null) ? 5 : current;
    return `<label class="field">⭐ Importance du match (1 = anecdotique, 10 = décisif)
      <select id="${id}">
        ${Array.from({length:10},(_,i)=>i+1).map(n=>{
          const info = this.importanceInfo(n);
          return `<option value="${n}" ${n===val?'selected':''}>${n} — ${info.emoji} ${esc(info.label)}${n===5?' (défaut)':''}</option>`;
        }).join("")}
      </select>
    </label>
    ${this.renderImportanceLegend()}`;
  },
  // Mécanique commune à tous les classements de fin de saison (Ballon d'Or, Pire Joueur, Pire Action) :
  // seules les topN premières places du classement ont un effet "bonus" sur le général, et cet effet est
  // d'autant plus fort qu'on est proche de la 1ère place (idx 0) — la Ne place du top N a encore un petit
  // effet, jamais nul. `outsideScore` (optionnel, déjà dans le sens du malus, ex: -0.4) donne en plus un léger
  // écart pour tout le monde hors du top N (classé plus loin, ou pas classé du tout) — resté à 0 par défaut,
  // ce qui garde ce mécanisme neutre hors du top N (cas de Pire Joueur / Pire Action, inchangés). `direction`
  // vaut +1 pour un classement "des meilleurs" (bonus) ou -1 pour un classement "des pires" (malus). Moyenne
  // sur toutes les éditions clôturées de ce classement.
  seasonRankAdj(name, key, topN, direction, outsideScore){
    const history = (this.state.info && this.state.info.awardsHistory && this.state.info.awardsHistory[key]) || [];
    if(!history.length) return 0;
    let sum = 0, count = 0;
    history.forEach(h=>{
      const podium = h.podium || [];
      if(!podium.length) return;
      count++;
      const idx = podium.indexOf(name);
      if(idx===-1 || idx>=topN){ sum += direction * (outsideScore||0); return; } // hors du top N
      sum += direction * ((topN - idx) / topN);
    });
    if(!count) return 0;
    return sum/count;
  },
  // Le top 10 du Ballon d'Or fait monter le général (1er = bonus plein, 10e = petit bonus). Ne PAS être dans
  // ce top 10 donne en plus un léger écart vers le bas — plus marqué que la neutralité d'avant, mais volontai-
  // rement modeste (bien moindre que le bonus du top 10, et sans lien avec la distance au top 10 : 11e ou
  // dernier reçoivent le même petit écart) pour ne pas punir lourdement le reste de l'effectif.
  ballonDorAdj(name){
    return this.seasonRankAdj(name, 'ballonDor', 10, 1, -0.4) * 6;
  },
  // Seuls les 3 premiers d'un classement "des pires" (Pire Joueur / Pire Action) font baisser le général —
  // le poids (x6 pour Pire Joueur, x3 pour Pire Action) est appliqué par l'appelant.
  worstAwardAdj(name, key, topN){
    return this.seasonRankAdj(name, key, topN, -1);
  },
  cardRating(stats){
    // Un joueur qui n'a jamais disputé le moindre match part à 30 (pas de général tant qu'il n'y a pas eu au
    // moins un match joué). Le plancher général est maintenant 30 (au lieu de 45) : un joueur qui enchaîne les
    // mauvaises performances doit pouvoir vraiment redescendre, pas juste stagner à 45 quoi qu'il arrive.
    if(!stats.matchesPlayed) return 30;
    // À partir d'ici, tout ce qui vient des matchs (notes, buts, cartons, temps de jeu, etc.) est lu depuis
    // stats.weighted plutôt que depuis les totaux bruts : chaque match y contribue selon son importance
    // (1 à 10, voir matchWeight/IMPORTANCE_BAREME), donc un match "anecdotique" (1-2/10) ne fait presque pas
    // bouger le général, alors qu'une finale (9-10/10) le fait bouger jusqu'à 2x plus qu'un match normal.
    // stats.matchesPlayed lui-même reste NON pondéré : avoir déjà joué au moins un match (même peu important)
    // suffit à sortir du plancher à 30, ça reste une simple question d'existence, pas de score.
    const w = stats.weighted || {};
    // Tant qu'aucune note individuelle n'a été saisie sur un match (ratingsCount===0), on ne pénalise ni ne
    // bonifie le général avec la moyenne des notes : avant, une moyenne par défaut à 0 faisait perdre ~27 points
    // à tout le monde même sans aucune note saisie, ce qui écrasait complètement les autres progrès.
    const avgRatingAdj = (w.ratingsCount>0) ? (w.avgRating-5)*3.0 : 0;
    // Le classement du match (top 10 meilleurs / top 3 pires voté par toute l'équipe) compte maintenant
    // nettement PLUS que les notes individuelles dans le général — ce n'est plus un léger avantage (5.2 vs
    // 4.5) mais un vrai écart voulu (8.0 vs 3.0, soit ~2,7x plus lourd) : le classement voté par l'équipe est
    // ce qui pèse le plus, les notes individuelles continuant de compter mais avec une influence plus modeste.
    // Même échelle (-5..+5) pour les deux, donc c'est bien le poids qui change, pas l'échelle.
    const matchRankAdj = (w.matchRankAvg||0) * 8.0;
    // Le temps de jeu compte maintenant vraiment : un joueur qui joue tout le match (90 min) gagne plus qu'un
    // joueur qui n'en joue qu'une partie, proportionnellement aux minutes réellement jouées (accumulées sur
    // tous ses matchs). Si aucune minute n'a jamais été saisie pour ce joueur (équipe qui ne suit pas ça), on
    // retombe sur l'ancien bonus fixe « titulaire » pour ne pas pénaliser les données déjà saisies.
    const playtimeBonus = (w.minutesPlayed>0)
      ? (w.minutesPlayed/90) * 3.0
      : (w.timesStarter||0)*0.8;
    // Un gardien a un barème à part : il ne marque presque jamais et serait donc condamné à rester scotché
    // au plancher avec le barème des joueurs de champ (pensé pour valoriser les buts/tirs/tacles). Son général
    // valorise plutôt les arrêts, les penaltys stoppés, et le nombre de buts encaissés PAR MATCH (une moyenne,
    // pas un total, pour ne pas punir un gardien qui a simplement joué beaucoup de matchs) — une "feuille
    // blanche" (peu ou pas de buts encaissés en moyenne) donne un vrai bonus.
    if(stats.position==='Gardien'){
      const concededPerMatch = w.gkWeight ? (w.goalsConceded / w.gkWeight) : 0;
      const gkImpact = (w.saves||0)*1.3 + (w.penaltiesSaved||0)*5.0 + (w.tacklesWon||0)*0.5;
      const cleanSheetBonus = Math.max(0, 1 - concededPerMatch) * 5.5;
      // Rendement décroissant sur la pénalité "buts encaissés" (racine carrée plutôt que linéaire) : un match
      // exceptionnellement à sens unique (ex : 10 buts encaissés dans un match très ouvert) ne doit pas à lui
      // seul écraser le général au plancher — un match difficile pèse, mais pas de façon disproportionnée.
      const concededPenalty = Math.sqrt(Math.max(0, concededPerMatch)) * 3.2;
      let rg = 52 + gkImpact + cleanSheetBonus - concededPenalty + w.assists*2.3 + avgRatingAdj + matchRankAdj + w.mvp*6.0
        + playtimeBonus
        - w.worstVotesTotal*1.4
        - (w.yellow||0)*0.8 - (w.red||0)*3.2
        + (w.beautifulGoalVotesTotal||0)*1.15 + (stats.ballonDorAdj||0)
        + (stats.pireJoueurAdj||0) + (stats.pireActionAdj||0);
      return this.compressRating(rg);
    }
    // Chaque façon de marquer pèse différemment sur le général, du plus dur au plus facile :
    // coup franc (le plus dur, vaut exactement 2 buts classiques) > corner direct (dur, mais moins qu'un coup
    // franc) > but « classique » en jeu ouvert (poids de base) > penalty (le plus facile). Un corner monte
    // donc plus qu'un but classique mais moins qu'un coup franc, et un coup franc vaut pile 2 buts classiques.
    const scoringImpact = (w.openPlayGoals||0)*4.8 + (w.freekickScored||0)*9.6 + (w.cornersScored||0)*6.0 + (w.penaltiesScored||0)*3.4;
    // Un joueur avec un mauvais match (carton, penalty raté/provoqué, mauvais votes) doit vraiment perdre du
    // général, pas juste moins en gagner : les cartons (auparavant ignorés par la note) comptent maintenant
    // aussi, un rouge punissant nettement plus qu'un jaune.
    // Être élu MVP d'un match doit faire monter le général de façon très nette — ce poids a été nettement
    // augmenté (plus du double) pour que chaque titre de MVP se voie vraiment. Le MVP n'est PLUS celui qui a
    // la meilleure note individuelle : c'est celui qui est 1er du classement du match voté par l'équipe
    // (voir matchMVP()) — sa note perso peut être plus basse que celle d'un autre joueur, ça ne change rien.
    let r = 52 + scoringImpact + w.assists*2.3 + avgRatingAdj + matchRankAdj + w.mvp*6.0 + w.tacklesWon*0.9 + (w.shotsOnTarget||0)*0.4
      + playtimeBonus
      - w.penaltiesMissed*2.8 - w.worstVotesTotal*1.4 - w.penaltiesCaused*2.6
      - (w.yellow||0)*0.8 - (w.red||0)*3.2
      + (w.beautifulGoalVotesTotal||0)*1.15 + (stats.ballonDorAdj||0)
      + (stats.pireJoueurAdj||0) + (stats.pireActionAdj||0);
    return this.compressRating(r);
  },
  // Comme sur une vraie carte : en dessous du seuil "élite", la note suit la formule brute normalement.
  // Au-dessus, chaque point devient de plus en plus dur à gagner (rendement décroissant), pour que les
  // meilleurs joueurs plafonnent naturellement autour de 93-95 et que 99 reste quasiment hors de portée —
  // ça évite aussi qu'un seul gros match fasse bondir le général d'un coup une fois qu'on est déjà haut.
  compressRating(raw){
    const floor = 30, softCap = 70, ceil = 99;
    // Arrondi au dixième (pas à l'entier) : avec un entier, deux notes très proches (ex: 7,2 et 7,3) peuvent
    // donner exactement le même général arrondi, et on dirait que la moyenne des notes n'a servi à rien alors
    // qu'elle est bien prise en compte en interne. Avec un dixième, le général bouge visiblement dès qu'une
    // note change, même un tout petit peu — plus honnête pour montrer que chaque nouvelle note compte.
    if(raw <= softCap) return Math.max(floor, Math.round(raw*10)/10);
    const excess = raw - softCap;
    const span = ceil - softCap;
    const hardness = 22.75; // plus ce chiffre est grand, plus il faut de performance pour grimper près de 99
    const compressed = span * (1 - Math.exp(-excess/hardness));
    return Math.min(ceil, Math.round((softCap + compressed)*10)/10);
  },
  cardTier(rating){
    if(rating>=85) return "icon";
    if(rating>=75) return "gold";
    if(rating>=65) return "silver";
    return "bronze";
  },
  /* ---------- Valeur marchande (façon marché des transferts) ---------- */
  lastPlayedMatch(){
    const played = this.state.matches.filter(m=>m.played).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    return played[0] || null;
  },
  marketValueFromRating(rating){
    // Le plancher du général est maintenant 30 (au lieu de 45) : la valeur marchande doit suivre, sinon un
    // joueur dont le général baisse entre 30 et 44 verrait sa valeur marchande rester figée comme avant,
    // recréant le même problème que le général qui ne bougeait pas visiblement.
    const r = Math.max(30, Math.min(99, rating));
    const raw = 50000 * Math.pow(1.11, r-45);
    return Math.round(raw/1000)*1000;
  },
  formatMarketValue(v){
    if(v>=1000000) return (v/1000000).toFixed(1).replace(/\.0$/,'') + "M €";
    return Math.round(v/1000) + "K €";
  },
  marketValueTrend(name){
    const stats = this.computePlayerStats(name);
    const rating = this.cardRating(stats);
    const value = this.marketValueFromRating(rating);
    const lm = this.lastPlayedMatch();
    if(!lm) return {value, rating, delta:0, pct:0, dir:'flat'};
    const prevStats = this.computePlayerStats(name, lm.id);
    const prevRating = this.cardRating(prevStats);
    const prevValue = this.marketValueFromRating(prevRating);
    const delta = value - prevValue;
    const pct = prevValue>0 ? (delta/prevValue*100) : 0;
    return {value, rating, prevValue, prevRating, delta, pct, dir: delta>0?'up':delta<0?'down':'flat'};
  },
  playerValueHistory(name){
    const played = this.state.matches.filter(m=>m.played).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const ids = [];
    return played.map(m=>{
      ids.push(m.id);
      const stats = this.computePlayerStats(name, {includeIds:[...ids]});
      const rating = this.cardRating(stats);
      return {date:m.date, opponent:m.opponent, value:this.marketValueFromRating(rating)};
    });
  },
  toggleValueChart(name){
    this.state.expandedValueChart = this.state.expandedValueChart || {};
    this.state.expandedValueChart[name] = !this.state.expandedValueChart[name];
    this.render();
  },
  renderValueHistoryChart(name){
    const points = this.playerValueHistory(name);
    if(points.length<2) return `<p class="muted" style="font-size:11.5px;">Pas encore assez de matchs joués pour tracer une évolution.</p>`;
    const values = points.map(p=>p.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max-min) || 1;
    const W=100, H=40;
    const stepX = points.length>1 ? W/(points.length-1) : 0;
    const coords = points.map((p,i)=>({x:i*stepX, y:H-((p.value-min)/range)*H, ...p}));
    const path = coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
    const last = coords[coords.length-1];
    return `
    <div style="margin-top:6px;">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:70px;background:var(--surface-2);border-radius:8px;">
        <path d="${path}" fill="none" stroke="var(--accent2)" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
        <circle cx="${last.x}" cy="${last.y}" r="1.6" fill="var(--accent2)"></circle>
      </svg>
      <div class="row" style="justify-content:space-between;">
        <span class="muted" style="font-size:10px;">${fmtDate(points[0].date)} · ${this.formatMarketValue(points[0].value)}</span>
        <span class="muted" style="font-size:10px;">${fmtDate(points[points.length-1].date)} · ${this.formatMarketValue(points[points.length-1].value)}</span>
      </div>
    </div>`;
  },
  /* ---------- Identification compte ↔ joueur ("C'est moi") ----------
     Avant, le salaire cherchait un joueur dont le NOM était exactement égal au pseudo du compte
     (this.me). Ça ne marchait que si quelqu'un s'était inscrit avec le nom exact de sa fiche joueur —
     et plein de monde a un pseudo différent (ou proche mais pas identique, ex. deux prénoms), donc ne
     recevait jamais son salaire. Maintenant, un compte revendique explicitement UNE fiche joueur
     (acc.linkedPlayer) via un bouton "C'est moi" dans Recrues, et un joueur ne peut être revendiqué
     que par un seul compte à la fois. */
  playerClaimedBy(playerName){
    return this.state.accounts.find(a=>a.linkedPlayer===playerName) || null;
  },
  // Historique des clubs d'un joueur : pour chaque match joué où il apparaît dans teamA/teamB, quel
  // côté il a vraiment occupé CE match-là (indépendamment de sa fiche permanente player.team, qui peut
  // changer avec le temps ou être temporairement différente pour un match précis — transfert, joueur
  // invité, erreur de placement...). Permet de voir/expliquer "il a joué pour tel club à telle date",
  // et de repérer un changement de club d'un match à l'autre.
  playerClubHistory(playerName){
    const tn = this.teamNames();
    return this.state.matches
      .filter(m=>m.played && ((m.teamA||[]).includes(playerName) || (m.teamB||[]).includes(playerName)))
      .map(m=>{
        const club = (m.teamA||[]).includes(playerName) ? 'A' : 'B';
        return {matchId:m.id, date:m.date, opponent:m.opponent, club, clubLabel: club==='A'?tn.a:tn.b};
      })
      .sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  },
  // Petit badge "c'est [joueur], voici ses stats" affiché sous le nom de l'auteur d'une story/publication,
  // quand ce compte est identifié à une fiche joueur (via "C'est moi" dans Recrues). Vide si le compte
  // n'est identifié à personne (compte supporter pur, ou pas encore identifié).
  renderAuthorStatChip(authorUsername){
    if(!authorUsername) return "";
    const acc = this.state.accounts.find(a=>a.username===authorUsername);
    const linkedName = acc && acc.linkedPlayer;
    if(!linkedName) return "";
    const player = this.state.players.find(p=>p.name===linkedName);
    if(!player) return "";
    const stats = this.computePlayerStats(linkedName);
    return `<button class="chip" style="margin:4px 0 2px;" onclick="App.openPlayerQuickCard('${jsa(linkedName)}')">🃏 ${esc(linkedName)} · ⚽ ${stats.goals} · 🎯 ${stats.assists}</button>`;
  },
  openPlayerQuickCard(name){
    const p = this.state.players.find(x=>x.name===name);
    if(!p){ toast("Fiche joueur introuvable"); return; }
    const stats = this.computePlayerStats(name);
    this.modal(`
      <h3>🃏 ${esc(name)}</h3>
      <div style="display:flex;justify-content:center;margin:8px 0;">${this.renderFutCard(p)}</div>
      <div class="kv" style="border:none;"><span>⚽ Buts</span><b>${stats.goals}</b></div>
      <div class="kv" style="border:none;"><span>🎯 Passes déc.</span><b>${stats.assists}</b></div>
      <div class="kv" style="border:none;"><span>Note moy.</span><b>${stats.avgRating?stats.avgRating.toFixed(1):'–'}</b></div>
    `);
  },
  claimPlayer(playerName){
    this.ensureMe(async (me)=>{
      const already = this.state.accounts.find(a=>a.linkedPlayer===playerName);
      if(already && already.username!==me){ toast("Déjà revendiqué par "+already.username); return; }
      await this.db.collection("accounts").doc(slugify(me)).update({linkedPlayer: playerName});
      toast("✅ C'est toi maintenant : "+playerName+" — tu touches son salaire chaque mois dans 💰 Paris");
      this.render();
    });
  },
  unclaimPlayer(){
    if(!this.me) return;
    this.db.collection("accounts").doc(slugify(this.me)).update({linkedPlayer:""}).then(()=>{
      toast("Identification retirée");
      this.render();
    });
  },
  /* ---------- Salaire (versé tous les mois, indexé sur la valeur marchande) ---------- */
  playerSalary(name){
    const stats = this.computePlayerStats(name);
    const rating = this.cardRating(stats);
    const value = this.marketValueFromRating(rating);
    return Math.max(500, Math.round(value*0.05/500)*500);
  },
  // Le salaire ne baisse jamais d'un versement à l'autre : si la valeur marchande a reculé, on garde
  // le dernier montant connu (le "dernier prix") ; s'il a progressé, le salaire suit la nouvelle valeur.
  effectiveSalary(name, acc){
    const current = this.playerSalary(name);
    const floor = (acc && acc.lastSalaryAmount) || 0;
    return Math.max(current, floor);
  },
  // "username" est le pseudo du COMPTE connecté ; le joueur pris en compte est celui que ce compte a
  // revendiqué (acc.linkedPlayer), pas le pseudo lui-même.
  pendingSalaryInfo(username){
    const acc = this.state.accounts.find(a=>a.username===username);
    const linkedName = acc && acc.linkedPlayer;
    if(!linkedName) return null;
    const player = this.state.players.find(p=>p.name===linkedName);
    if(!player) return null;
    const lastAt = acc && acc.lastSalaryAt ? new Date(acc.lastSalaryAt) : (acc && acc.createdAt ? new Date(acc.createdAt) : new Date());
    const nextAt = new Date(lastAt); nextAt.setMonth(nextAt.getMonth()+1);
    return {amount: this.effectiveSalary(linkedName, acc), nextAt: isNaN(nextAt) ? null : nextAt.toISOString(), linkedName};
  },
  checkAndPaySalaryIfNeeded(){
    if(!this.me || !this.db) return;
    if(this._salaryCheckedFor === this.me) return;
    this._salaryCheckedFor = this.me;
    const acc = this.state.accounts.find(a=>a.username===this.me);
    if(!acc) return;
    const linkedName = acc.linkedPlayer;
    if(!linkedName) return;
    const player = this.state.players.find(p=>p.name===linkedName);
    if(!player) return;
    const lastAt = acc.lastSalaryAt ? new Date(acc.lastSalaryAt) : new Date(acc.createdAt||Date.now());
    if(isNaN(lastAt)) return;
    const now = new Date();
    const periods = (now.getFullYear()-lastAt.getFullYear())*12 + (now.getMonth()-lastAt.getMonth());
    if(periods<1) return;
    const salary = this.effectiveSalary(linkedName, acc);
    const total = salary*periods;
    const newLastAt = new Date(lastAt); newLastAt.setMonth(newLastAt.getMonth()+periods);
    const newWallet = (acc.wallet||0) + total;
    this.db.collection("accounts").doc(slugify(this.me)).update({wallet:newWallet, lastSalaryAt:newLastAt.toISOString(), lastSalaryAmount:salary}).then(()=>{
      toast("💼 Salaire versé : "+fmtEuro(total)+(periods>1? " ("+periods+" versements)":""));
    });
  },
  /* ---------- Sanctions & amendes (« quand tu fais un mauvais truc, tu perds de l'argent ») ----------
     Deux mécanismes : une amende AUTOMATIQUE à chaque carton jaune/rouge saisi sur un match (appliquée
     au compte qui a revendiqué le joueur, s'il y en a un), et une sanction MANUELLE que le capitaine peut
     déclencher pour n'importe quelle autre raison (retard, comportement...). Le crédit ne descend jamais
     sous 0 pour rester simple à comprendre. */
  CARD_FINE_YELLOW: 1000,
  CARD_FINE_RED: 3000,
  // On relit le portefeuille en direct depuis Firestore juste avant d'écrire (plutôt que de faire
  // confiance à this.state.accounts, alimenté par un onSnapshot qui se resynchronise avec un léger
  // délai) : ça évite qu'une amende écrase une autre appliquée juste avant sur le même compte, avant
  // que l'état local n'ait eu le temps de refléter la première déduction.
  async fineLinkedAccount(playerName, amount, reason){
    if(amount<=0) return;
    const linked = this.playerClaimedBy(playerName);
    if(!linked) return; // personne n'a revendiqué ce joueur : pas de compte à sanctionner
    const id = slugify(linked.username);
    const fresh = await this.db.collection("accounts").doc(id).get();
    const currentWallet = fresh.exists ? (fresh.data().wallet||0) : (linked.wallet||0);
    const newWallet = Math.max(0, currentWallet - amount);
    await this.db.collection("accounts").doc(id).update({wallet:newWallet});
    return {account:linked.username, amount, newWallet, reason};
  },
  // Appelé juste après l'enregistrement d'un résultat de match (voir saveResult) : applique l'amende
  // automatique pour chaque carton jaune/rouge de ce match précis. On additionne d'abord TOUTES les

  // joueur qui prend jaune ET rouge dans le même match n'a donc qu'UNE seule écriture, montant cumulé —
  // plus simple et plus sûr que deux écritures séquentielles sur le même compte.
  async applyCardFines(cardsYellow, cardsRed){

    (cardsRed||[]).forEach(s=>{ const c=s.count||0; if(c>0) totalsByPlayer[s.name] = (totalsByPlayer[s.name]||0) + this.CARD_FINE_RED*c; });
    const fined = [];
    for(const playerName of Object.keys(totalsByPlayer)){
      const r = await this.fineLinkedAccount(playerName, totalsByPlayer[playerName], "cartons");
      if(r) fined.push({...r, name:playerName});
    }
    if(fined.length){
      toast("💸 Amendes cartons : "+fined.map(f=>`${f.name} -${fmtEuro(f.amount)}`).join(", "));

  },

  /* ---------- Paris sportifs ---------- */
  factorial(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; },
  poissonP(lambda, k){
    if(lambda<=0) lambda=0.25;
    return Math.pow(lambda,k)*Math.exp(-lambda)/this.factorial(k);
  },
  // Comme sur un vrai book de paris : la marge de la maison grandit avec la probabilité de l'évènement,
  // donc un pari "trop facile" (joueur qui marque à presque tous les matchs, équipe très dominante...)
  // ne s'effondre jamais vers une cote presque à 1 — il reste juste "peu rémunérateur", jamais gratuit.
  fairOdds(p, baseMargin, min, max){
    baseMargin = baseMargin==null?0.10:baseMargin; min = min||1.15; max = max||25;
    const pc = Math.max(0.01, Math.min(0.95, p));
    const margin = Math.min(0.55, baseMargin + pc*0.22);
    const raw = (1/pc) * (1-margin);
    return Math.max(min, Math.min(max, +raw.toFixed(2)));
  },
  // Les cotes doivent se baser sur l'historique face à CET adversaire précis quand on en a un (au moins un
  // match déjà joué contre lui) — sinon un adversaire qui nous a déjà battus à plate couture afficherait
  // exactement la même cote qu'un adversaire jamais affronté (ou qu'on écrase à chaque fois), ce qui est une
  // vraie faille : les cotes ne s'adaptent alors jamais au véritable niveau de l'adversaire du match. On ne
  // retombe sur l'historique global du club que quand on n'a encore jamais joué cet adversaire précis.
  matchesAgainst(opponent){
    const all = this.pastMatches();
    if(!opponent) return all;
    const norm = s => (s||"").trim().toLowerCase();
    const vs = all.filter(m=>norm(m.opponent)===norm(opponent));
    return vs.length ? vs : all;
  },
  clubForm(opponent){
    const past = this.matchesAgainst(opponent);
    if(!past.length) return {winP:0.42, drawP:0.26, lossP:0.32};
    let w=0,d=0,l=0;
    past.forEach(m=>{ if(!m.score) return; if(m.score.us>m.score.them) w++; else if(m.score.us===m.score.them) d++; else l++; });
    const tot = w+d+l || 1;
    return {winP:w/tot, drawP:d/tot, lossP:l/tot};
  },
  // Moyenne de buts marqués/encaissés par match, face à CET adversaire précis (ou sur l'historique global
  // du club si on ne l'a encore jamais affronté — mêmes valeurs de repli que scoreOdds() avant, maintenant
  // centralisées ici pour que l'affichage ("notre moyenne" / "leur moyenne") et le calcul des probabilités
  // utilisent exactement les mêmes chiffres.
  goalAverages(opponent){
    const past = this.matchesAgainst(opponent);
    const n = past.length;
    const avgUs = n ? past.reduce((s,m)=>s+(m.score?m.score.us:0),0)/n : 1.4;
    const avgThem = n ? past.reduce((s,m)=>s+(m.score?m.score.them:0),0)/n : 1.1;
    return {avgUs, avgThem, n};
  },
  // Probabilité victoire/nul/défaite en simulant tous les scores possibles (loi de Poisson des deux côtés,
  // comme un vrai modèle de pronostic) à partir de la moyenne de buts de chaque équipe — contrairement au
  // simple décompte victoires/nuls/défaites, ça capture directement qu'une équipe qui marque beaucoup plus
  // que l'autre en moyenne a une vraie longueur d'avance, même sur un historique très court (voire un seul
  // match : un match 7-10 doit clairement pencher pour l'adversaire au prochain match, pas juste "1 défaite
  // sur 1" traitée comme n'importe quelle autre défaite).
  poissonOutcomeProbs(avgUs, avgThem){
    let winP=0, drawP=0, lossP=0;
    for(let i=0;i<=9;i++){
      for(let j=0;j<=9;j++){
        const p = this.poissonP(Math.max(0.15,avgUs), i) * this.poissonP(Math.max(0.15,avgThem), j);
        if(i>j) winP+=p; else if(i===j) drawP+=p; else lossP+=p;
      }
    }
    const tot = winP+drawP+lossP || 1;
    return {winP:winP/tot, drawP:drawP/tot, lossP:lossP/tot};
  },
  matchOutcomeOdds(opponent){
    const f = this.clubForm(opponent);
    const ga = this.goalAverages(opponent);
    const poi = this.poissonOutcomeProbs(ga.avgUs, ga.avgThem);
    // Avec peu de matchs joués contre cet adversaire, le simple décompte V/N/D est très bruité (un seul
    // match joué = 100% victoire OU 100% défaite, rien entre les deux) : on fait alors surtout confiance à
    // l'écart de buts réel (poi). Le décompte V/N/D ne prend le dessus que quand on a un vrai historique
    // (poids jusqu'à 0.75 à partir d'environ 5 matchs joués contre cet adversaire).
    const histWeight = Math.min(0.75, ga.n*0.15);
    // Un plancher de probabilité assez haut (15%) pour qu'aucune issue ne devienne un pari-cadeau à
    // cote démesurée, même quand le club a un excellent historique — un "outsider" garde toujours une vraie chance.
    const winP = Math.max(0.15, f.winP*histWeight + poi.winP*(1-histWeight));
    const drawP = Math.max(0.15, f.drawP*histWeight + poi.drawP*(1-histWeight));
    const lossP = Math.max(0.15, f.lossP*histWeight + poi.lossP*(1-histWeight));
    const norm = winP+drawP+lossP;
    return {
      us: this.fairOdds(winP/norm, 0.08, 1.15, 7),
      draw: this.fairOdds(drawP/norm, 0.08, 1.15, 7),
      them: this.fairOdds(lossP/norm, 0.08, 1.15, 7),
    };
  },
  diffOdds(opponent){
    const past = this.matchesAgainst(opponent);
    let under2=0, tot=0;
    past.forEach(m=>{ if(!m.score) return; tot++; if(Math.abs(m.score.us-m.score.them)<2) under2++; });
    const p = tot? under2/tot : 0.55;
    const pC = Math.max(0.18, Math.min(0.82, p));
    return {under2: this.fairOdds(pC, 0.08, 1.15, 6), over2: this.fairOdds(1-pC, 0.08, 1.15, 6)};
  },
  scoreOdds(us, them, opponent){
    const ga = this.goalAverages(opponent);
    const pUs = this.poissonP(Math.max(0.2,ga.avgUs), us);
    const pThem = this.poissonP(Math.max(0.2,ga.avgThem), them);
    const p = Math.max(0.004, pUs*pThem);
    return this.fairOdds(p, 0.15, 3, 40);
  },
  // Les cotes "buteur" s'appuient directement sur le rythme de buts du joueur (buts / match joué) :
  // un buteur déjà très prolifique verra sa cote s'écraser vers le plancher (peu de gain), un joueur qui
  // marque rarement garde une cote élevée — exactement comme sur un vrai book, adapté aux stats réelles.
  scorerOdds(name){
    const s = this.computePlayerStats(name);
    const lambda = Math.max(0.08, s.matchesPlayed>0 ? s.goals/s.matchesPlayed : 0.2);
    const p1 = 1 - Math.exp(-lambda);
    const p2 = 1 - Math.exp(-lambda)*(1+lambda);
    const penRate = Math.max(0.02, s.matchesPlayed>0 ? (s.penaltiesScored/s.matchesPlayed) : 0.03);
    const pPen = 1 - Math.exp(-penRate);
    const fkRate = Math.max(0.015, s.matchesPlayed>0 ? (s.freekickScored/s.matchesPlayed) : 0.02);
    const pFk = 1 - Math.exp(-fkRate);
    return {
      atLeast1: this.fairOdds(p1, 0.08, 1.15, 12),
      atLeast2: this.fairOdds(p2, 0.10, 1.3, 25),
      penalty: this.fairOdds(pPen, 0.12, 1.5, 20),
      freekick: this.fairOdds(pFk, 0.12, 1.8, 25),
    };
  },

  didBetWin(b, finalData){
    const sel = b.selection;
    if(b.type==='winner'){
      const outcome = finalData.us>finalData.them ? 'us' : finalData.us===finalData.them ? 'draw' : 'them';
      return sel===outcome;
    }
    if(b.type==='score') return sel && sel.us===finalData.us && sel.them===finalData.them;
    if(b.type==='diff2'){
      const under2 = Math.abs(finalData.us-finalData.them)<2;
      return sel==='under2' ? under2 : !under2;
    }
    if(b.type==='scorer'){
      // Un pari "marqueur" doit compter tout but, quel que soit le type (jeu ouvert, coup franc,
      // corner direct, penalty) — sinon un joueur qui marque uniquement sur penalty ou coup franc
      // ferait perdre à tort un pari "marque au moins 1/2 but(s)".
      const merged = finalData.allGoals || [];
      const g = merged.find(s=>s.name===sel.player);
      return (g? g.count:0) >= sel.threshold;
    }
    if(b.type==='scorer_penalty'){
      const g = (finalData.penScored||[]).find(s=>s.name===sel.player);
      return !!(g && g.count>0);
    }
    if(b.type==='scorer_freekick'){
      const g = (finalData.freekick||[]).find(s=>s.name===sel.player);
      return !!(g && g.count>0);
    }
    return false;
  },
  async settleBetsForMatch(matchId, finalData){
    const pending = (this.state.bets||[]).filter(b=>b.matchId===matchId && b.status==='pending');
    if(!pending.length) return;
    const walletDelta = {};
    await Promise.all(pending.map(b=>{
      const won = this.didBetWin(b, finalData);
      const payout = won ? Math.round(b.stake*b.odds) : 0;
      if(won) walletDelta[b.bettor] = (walletDelta[b.bettor]||0) + payout;
      return this.db.collection("bets").doc(b.id).update({status: won?"won":"lost", payout, settledAt:new Date().toISOString()});
    }));
    await Promise.all(Object.keys(walletDelta).map(username=>{
      const acc = this.state.accounts.find(a=>a.username===username);
      const current = acc ? (acc.wallet||0) : 0;
      return this.db.collection("accounts").doc(slugify(username)).update({wallet: current + walletDelta[username]});
    }));
  },

  // Les 6 attributs "façon carte FIFA" affichés sur la carte viennent d'abord des notes que les gens
  // votent après chaque match (mêmes critères, exactement) — donc voter a un vrai impact sur la carte.
  // Tant que personne n'a encore noté un critère, on retombe sur une estimation à partir des stats du match
  // (buts, tirs, tacles...) pour que la carte ne reste pas figée à vide pour un nouveau joueur.
  cardSubStats(p, stats){
    // Arrondi au dixième (comme le général) plutôt qu'à l'entier : sinon deux joueurs très proches en
    // dribble/tir/défense se retrouvaient collés au même entier, et impossible de voir qui progresse vraiment
    // d'un match à l'autre dans les classements par catégorie.
    const clamp = v => Math.max(40, Math.min(99, Math.round(v*10)/10));
    const c = stats.criteria || {};
    // Un vote moyen 0-10 est ramené sur l'échelle 40-99 des cartes, puis mélangé (65/35) avec l'estimation
    // "brute" issue des stats — les votes de la communauté priment, les stats évitent une carte figée à 40.
    const blend = (voteVal, fallback) => (voteVal && voteVal>0) ? clamp((40+voteVal*5.9)*0.65 + fallback*0.35) : clamp(fallback);
    if(p.position==='Gardien'){
      const fPlongeon = 50 + Math.min(20, stats.saves*1.4);
      const fRelances = 50;
      const fReflexes = 50 + Math.min(20, stats.penaltiesSaved*5);
      const fPlacement = 48 + Math.min(10, stats.matchesPlayed);
      const fAutorite = 48 + Math.min(10, stats.matchesPlayed);
      const fVitesse = 50;
      return {
        PLO: blend(c.plongeon, fPlongeon),
        REL: blend(c.relances, fRelances),
        "RÉF": blend(c.reflexes, fReflexes),
        PLA: blend(c.placement, fPlacement),
        AUT: blend(c.autorite, fAutorite),
        VIT: blend(c.vitesseGk, fVitesse),
      };
    }
    const gpm = stats.matchesPlayed>0 ? stats.goals/stats.matchesPlayed : 0;
    const fVit = 52 + gpm*12;
    const fTir = 45 + stats.goals*4 + stats.shotsOnTarget*1;
    const fPas = 45 + stats.assists*3;
    const fDri = 50;
    const fDef = 40 + stats.tacklesWon*2;
    const fPhy = 48 + Math.min(10, stats.matchesPlayed);
    return {
      VIT: blend(c.vitesse, fVit),
      TIR: blend(c.tir, fTir),
      PAS: blend(c.passe, fPas),
      DRI: blend(c.dribble, fDri),
      "DÉF": blend(c.defense, fDef),
      PHY: blend(c.physique, fPhy),
    };
  },

  async savePlayerForm(id){
    const name = document.getElementById("pName").value.trim();
    if(!name){ toast("Entre un nom"); return; }
    const position = document.getElementById("pPos").value;
    const team = document.getElementById("pTeam").value;
    const birthDate = document.getElementById("pBirth").value || null;
    const jerseyNumber = document.getElementById("pNum").value ? parseInt(document.getElementById("pNum").value,10) : null;
    const arrivalDate = document.getElementById("pArrival").value || todayISO();
    const isCaptain = document.getElementById("pCaptain").checked;
    const file = document.getElementById("pPhoto").files[0];
    const existing = id ? this.state.players.find(x=>x.id===id) : null;
    let photo = existing ? (existing.photo||"") : "";
    if(file) photo = await resizeImage(file, 300, 0.6);
    // Un seul capitaine par équipe : si on coche cette case, on décoche les autres capitaines de la même équipe.
    if(isCaptain && team){
      const others = this.state.players.filter(x=>x.id!==id && x.team===team && x.isCaptain);
      for(const o of others){ await this.db.collection("players").doc(o.id).update({isCaptain:false}); }
    }
    if(existing){
      await this.db.collection("players").doc(id).set({...existing, name, position, team, birthDate, jerseyNumber, arrivalDate, photo, isCaptain});
      this.closeModal();
      toast("Fiche de "+name+" mise à jour");
    } else {
      const newId = slugify(name)+"-"+Date.now().toString(36).slice(-4);
      await this.db.collection("players").doc(newId).set({name, position, team, birthDate, jerseyNumber, arrivalDate, photo, isCaptain, createdAt:new Date().toISOString()});
      // Post "Nouvelle recrue" automatique dans les Actus, façon compte d'actu transferts — seulement si la
      // recrue est déjà rattachée à une équipe (sinon on attend qu'elle soit affectée). Publié tout de
      // suite (pas en brouillon) avec sa photo si elle en a une ; éditable ensuite pour en ajouter une.
      if(team){
        await this.db.collection("posts").add({
          type:'recruit', playerName:name, team, photo: photo||null,
          authorKind:'media', author: this.mediaName(), postedBy: this.me||null,
          likes:{}, comments:[], createdAt:new Date().toISOString()
        });
      }
      this.closeModal();
      toast(name+" a rejoint l'effectif !");
    }
  },

  async downloadCard(playerId, name){
    const node = document.getElementById("card-"+playerId);
    if(!node || !window.html2canvas){ toast("Rendu de la carte indisponible"); return; }
    try{
      const canvas = await html2canvas(node, {backgroundColor:null, scale:3});
      const blob = await new Promise(res=>canvas.toBlob(res,"image/png"));
      if(!this.downloads){ toast("Téléchargement indisponible ici"); return; }
      await this.downloads.save({filename:`carte-${slugify(name)}.png`, data:blob});
      toast("Carte téléchargée");
    }catch(e){
      if(e && e.code==="declined") return;
      toast("Impossible de télécharger la carte");
    }
  },

  /* ============================= TAB 4 : Stats (Joueurs, Équipe & Adversaires) ============================= */
  // Fusionne toutes les façons de marquer un but dans ce match (jeu ouvert, coup franc, corner direct,
  // penalty) en une seule liste {name, count} — un but reste un but, peu importe comment il a été inscrit.
  matchGoalScorers(m){
    const totals = {};
    [m.scorers, m.freekickScored, m.cornersScored, m.penaltiesScored].forEach(arr=>{
      (arr||[]).forEach(s=>{ totals[s.name] = (totals[s.name]||0) + (s.count||0); });
    });
    return Object.entries(totals).filter(([,c])=>c>0).map(([name,count])=>({name,count}));
  },
  // `teamKey` ('A' ou 'B') dit de quelle équipe on calcule les classements — par défaut celle
  // actuellement affichée dans l'onglet Stats (currentStatsTeam(), qui suit l'équipe du compte connecté
  // si connue, sinon l'équipe A). Avant ce correctif la fonction ne regardait QUE l'équipe A (Mot'eau),
  // donc un supporter de FC Nulos voyait le bilan et les classements de Mot'eau affichés comme si
  // c'était "son équipe", et les joueurs de FC Nulos n'apparaissaient jamais dans aucun classement.
  globalRankings(teamKey){
    const key = teamKey || this.currentStatsTeam();
    const played = this.state.matches.filter(m=>m.played);
    // On garde par défaut tout joueur qui n'est pas explicitement dans l'AUTRE équipe, pour ne jamais
    // faire disparaître un joueur pas encore étiqueté (comportement conservé pour l'équipe A comme avant).
    const ourNames = new Set(this.state.players.filter(p=> key==='B' ? p.team==='B' : p.team!=='B').map(p=>p.name));
    const byPlayer = {};
    this.state.players.filter(p=>ourNames.has(p.name)).forEach(p=> byPlayer[p.name] = {name:p.name, goals:0, assists:0, ratingSum:0, ratingCount:0});
    played.forEach(m=>{
      this.matchGoalScorers(m).forEach(s=>{ if(byPlayer[s.name]) byPlayer[s.name].goals += s.count; else if(ourNames.has(s.name)) byPlayer[s.name]={name:s.name,goals:s.count,assists:0,ratingSum:0,ratingCount:0}; });
      (m.assists||[]).forEach(s=>{ if(byPlayer[s.name]) byPlayer[s.name].assists += s.count; else if(ourNames.has(s.name)) byPlayer[s.name]={name:s.name,goals:0,assists:s.count,ratingSum:0,ratingCount:0}; });
      Object.entries(m.ratings||{}).forEach(([name,raters])=>{
        const vals = Object.values(raters||{});
        if(!vals.length || !ourNames.has(name)) return;
        if(!byPlayer[name]) byPlayer[name]={name,goals:0,assists:0,ratingSum:0,ratingCount:0};
        byPlayer[name].ratingSum += avg(vals); byPlayer[name].ratingCount += 1;
      });
    });
    const list = Object.values(byPlayer);
    const byAvg = list.filter(p=>p.ratingCount>0).map(p=>({...p, avg:p.ratingSum/p.ratingCount})).sort((a,b)=>b.avg-a.avg);
    const byGoals = list.slice().sort((a,b)=>b.goals-a.goals).filter(p=>p.goals>0);
    const byAssists = list.slice().sort((a,b)=>b.assists-a.assists).filter(p=>p.assists>0);
    // m.score.us/them est toujours du point de vue de l'équipe A : pour l'équipe B il faut inverser,
    // sinon FC Nulos hérite du bilan de Mot'eau (voir aussi computeTeamSplitStats, même correctif).
    let W=0,N=0,D=0, gf=0, ga=0;
    played.forEach(m=>{
      if(!m.score) return;
      const forTeam = key==='B' ? (m.score.them||0) : (m.score.us||0);
      const against = key==='B' ? (m.score.us||0) : (m.score.them||0);
      gf+=forTeam; ga+=against;
      if(forTeam>against) W++; else if(forTeam===against) N++; else D++;
    });
    return {byAvg, byGoals, byAssists, W, N, D, gf, ga, played: played.length, teamKey:key};
  },
  // Les 6 classements par catégorie ("Général", "Buteur", "Passeur", "Tireur", "Dribbleur", "Défenseur")
  // demandés pour voir en un coup d'œil qui est le/la meilleur(e) dans chaque domaine, et combien de
  // joueurs sont classés. "Tireur"/"Dribbleur"/"Défenseur" reprennent directement les attributs TIR/DRI/DÉF
  // déjà affichés sur la carte FUT de chaque joueur (cardSubStats) — donc noter un joueur sur ces critères
  // après un match a un effet direct ici aussi. Un gardien n'a pas ces attributs (son jeu de carte est
  // différent : PLO/REL/RÉF/PLA/AUT), donc il est exclu de ces 3 classements-là, mais reste dans les 3 autres.
  // `opts` (optionnel) se transmet tel quel à computePlayerStats — utilisé pour recalculer un classement
  // "avant le dernier match" et ainsi détecter si quelqu'un est monté ou descendu.
  CLASSEMENT_CATEGORIES: [
    {key:'general', label:'⭐ Général', forGK:true, fmt:v=>v.toFixed(1)},
    {key:'buteur', label:'⚽ Buteur', forGK:true, fmt:v=>String(Math.round(v))},
    {key:'passeur', label:'🎯 Passeur', forGK:true, fmt:v=>String(Math.round(v))},
    {key:'tireur', label:'🥅 Tireur', forGK:false, fmt:v=>v.toFixed(1)},
    {key:'dribbleur', label:'🌀 Dribbleur', forGK:false, fmt:v=>v.toFixed(1)},
    {key:'defenseur', label:'🛡️ Défenseur', forGK:false, fmt:v=>v.toFixed(1)},
    {key:'polyvalent', label:'🌟 Complet', forGK:false, fmt:v=>String(Math.round(v))+" pts", composite:true, golf:true},
  ],
  // Classement "dense" façon compétition sportive : deux joueurs à égalité parfaite (même valeur, ex : 0
  // passe chacun) doivent partager EXACTEMENT le même rang, et le rang suivant reprend juste après (1, 1, 1,
  // 2, 2, 3...) plutôt que de sauter des places au hasard. Avant ce correctif, le rang était juste "position
  // dans le tableau trié" (1, 2, 3, 4...) : deux joueurs avec 0 passe chacun pouvaient donc se retrouver l'un
  // 5e et l'autre 20e, juste à cause de l'ordre interne — aucune vraie égalité n'était possible. `ascending`
  // à true trie du plus petit au plus grand (utilisé pour "Complet", où moins de points = mieux classé) ;
  // sinon on trie du plus grand au plus petit (tous les autres classements).
  assignDenseRanks(rows, ascending){
    rows.sort((a,b)=> ascending ? a.value-b.value : b.value-a.value);
    let rank = 0, prevValue;
    rows.forEach(r=>{
      if(rank===0 || r.value !== prevValue){ rank++; prevValue = r.value; }
      r.rank = rank;
    });
    return rows;
  },
  // `teamKey` ('A' ou 'B') : quelle équipe classer — par défaut currentStatsTeam(). Voir la même
  // remarque que dans globalRankings() : avant ce correctif seule l'équipe A était jamais classée.
  computeCategoryRanking(category, opts, teamKey){
    const key = teamKey || this.currentStatsTeam();
    const def = this.CLASSEMENT_CATEGORIES.find(c=>c.key===category);
    if(!def) return [];
    if(def.composite){
      // "Complet" : classement "à la golf" — pour chaque catégorie (buteur, passeur, tireur, dribbleur,
      // défenseur), un joueur prend autant de points que sa PLACE dans ce classement (20e du classement
      // Défenseur = 20 points, 3e du classement Dribbleur = 3 points de plus, etc.). Son score "Complet" est
      // la somme de ses points sur les 5 catégories, et c'est celui qui a le MOINS de points au total qui est
      // devant (comme au golf) — donc être bon un peu partout fait vraiment mieux descendre le score que
      // d'être élite dans un seul domaine et mauvais dans les autres. Comme le Général, il ne prend PAS en
      // compte les votes/MVP/cartons, juste ces 5 classements combinés.
      const componentKeys = ['buteur','passeur','tireur','dribbleur','defenseur'];
      const scoreByName = {};
      componentKeys.forEach(k=>{
        const list = this.computeCategoryRanking(k, opts, key);
        list.forEach(r=>{
          if(!scoreByName[r.name]) scoreByName[r.name] = {sum:0, count:0};
          scoreByName[r.name].sum += r.rank; scoreByName[r.name].count++;
        });
      });
      const rows = Object.entries(scoreByName)
        .filter(([,o])=>o.count===componentKeys.length) // seuls les joueurs présents dans les 5 (donc pas les gardiens)
        .map(([name,o])=>({name, value:o.sum}));
      return this.assignDenseRanks(rows, true); // ascending : moins de points = mieux classé, comme au golf
    }
    const rows = [];
    this.state.players.filter(p=> key==='ALL' ? true : key==='B' ? p.team==='B' : p.team!=='B').forEach(p=>{
      if(p.position==='Gardien' && !def.forGK) return;
      const stats = this.computePlayerStats(p.name, opts);
      if(!stats.matchesPlayed) return; // pas encore joué = pas classé, pour ne pas polluer avec des valeurs par défaut
      let value;
      if(category==='general') value = this.cardRating(stats);
      else if(category==='buteur') value = stats.goals;
      else if(category==='passeur') value = stats.assists;
      else {
        const sub = this.cardSubStats(p, stats);
        if(category==='tireur') value = sub.TIR;
        else if(category==='dribbleur') value = sub.DRI;
        else if(category==='defenseur') value = sub["DÉF"];
      }
      if(value==null) return;
      rows.push({name:p.name, position:p.position, value});
    });
    return this.assignDenseRanks(rows, false); // descending : plus la valeur est grande, mieux classé
  },
  // Ajoute prevRank/trend en comparant au classement calculé juste avant le dernier match joué — c'est ce
  // qui permet d'afficher "monté" / "descendu" / "nouveau" à chaque nouveau match.
  computeCategoryRankingWithTrend(category, teamKey){
    const key = teamKey || this.currentStatsTeam();
    const current = this.computeCategoryRanking(category, undefined, key);
    const lastMatch = this.lastPlayedMatch();
    const prevRows = lastMatch ? this.computeCategoryRanking(category, lastMatch.id, key) : [];
    const prevRankByName = {};
    prevRows.forEach(r=>{ prevRankByName[r.name] = r.rank; });
    current.forEach(r=>{
      const pr = prevRankByName[r.name];
      r.prevRank = pr!=null ? pr : null;
      r.trend = pr==null ? 'new' : pr>r.rank ? 'up' : pr<r.rank ? 'down' : 'same';
    });
    return current;
  },
  setClassementCat(key){ this.state.classementCat = key; this.render(); },
  renderClassementsSection(){
    const cats = this.CLASSEMENT_CATEGORIES;
    const active = cats.find(c=>c.key===this.state.classementCat) ? this.state.classementCat : 'general';
    const cat = cats.find(c=>c.key===active);
    const tn = this.teamNames();
    const key = this.currentClassementsTeam();
    const rows = this.computeCategoryRankingWithTrend(active, key);
    const trendTag = (r)=>{
      if(r.trend==='new') return `<span class="muted" style="font-size:11px;">🆕 nouveau</span>`;
      if(r.trend==='same') return `<span class="muted" style="font-size:11px;">▬ pareil</span>`;
      if(r.trend==='up') return `<span style="font-size:11px;color:#2e7d32;">▲ ${r.prevRank}e ➜ ${r.rank}e</span>`;
      return `<span style="font-size:11px;color:#c62828;">▼ ${r.prevRank}e ➜ ${r.rank}e</span>`;
    };
    // En mode "Tout le monde mélangé", on accole le petit logo du club de chacun devant son nom pour
    // repérer d'un coup d'œil qui joue pour qui dans ce classement commun aux deux équipes.
    const clubTagFor = (name)=>{
      if(key!=='ALL') return "";
      const p = this.state.players.find(x=>x.name===name);
      const team = p ? p.team : null;
      return team ? `${this.teamLogoTag(team,13)} ` : "";
    };
    const headerLabel = key==='ALL' ? `🔀 Tout le monde mélangé` : `${this.teamLogoTag(key,15)} ${esc(key==='A'?tn.a:tn.b)}`;
    return `
    <div class="card">
      <h2>🏆 Classements — ${headerLabel}</h2>
      <p class="muted" style="font-size:12px;margin-top:-6px;">${rows.length} joueur${rows.length>1?'s':''} classé${rows.length>1?'s':''} dans "${esc(cat.label.replace(/^\S+\s/,''))}"${key==='ALL'?`, les deux équipes confondues`:``}. Choisis une catégorie ci-dessous — après chaque nouveau match, regarde si tu montes ▲ ou descends ▼ !${cat.golf?` <b>Comme au golf : moins de points = mieux classé</b> (tes points = la somme de tes places dans Buteur, Passeur, Tireur, Dribbleur et Défenseur).`:``}</p>
      <div class="wrap" style="margin-bottom:6px;">
        <span class="chip ${key==='A'?'active':''}" onclick="App.setClassementsTeamView('A')">${this.teamLogoTag('A',13)} ${esc(tn.a)}</span>
        <span class="chip ${key==='B'?'active':''}" onclick="App.setClassementsTeamView('B')">${this.teamLogoTag('B',13)} ${esc(tn.b)}</span>
        <span class="chip ${key==='ALL'?'active':''}" onclick="App.setClassementsTeamView('ALL')">🔀 Tout le monde</span>
      </div>
      <div class="wrap" style="margin-bottom:10px;">
        ${cats.map(c=>`<span class="chip ${active===c.key?'active':''}" onclick="App.setClassementCat('${c.key}')">${c.label}</span>`).join("")}
      </div>
      ${rows.length===0 ? `<p class="muted" style="font-size:12.5px;">Personne n'a encore assez joué pour ce classement.</p>` :
        rows.map(r=>`
        <div class="presence-row" style="cursor:pointer;" onclick="App.selectStatsPlayer('${jsa(r.name)}')">
          <span class="nm">${this.rankMedal(r.rank-1)} ${clubTagFor(r.name)}${esc(r.name)}</span>
          <span style="text-align:right;">
            <b>${cat.fmt(r.value)}</b><br>${trendTag(r)}
          </span>
        </div>`).join("")}
    </div>`;
  },
  computeOpponents(){
    const played = this.state.matches.filter(m=>m.played && m.opponent);
    const byOpp = {};
    played.forEach(m=>{
      const key = m.opponent;
      if(!byOpp[key]) byOpp[key] = {name:key, W:0,D:0,L:0, gf:0, ga:0, played:0};
      const o = byOpp[key];
      o.played++; o.gf += m.score?m.score.us:0; o.ga += m.score?m.score.them:0;
      if(!m.score) return;
      if(m.score.us>m.score.them) o.W++; else if(m.score.us===m.score.them) o.D++; else o.L++;
    });
    return Object.values(byOpp).sort((a,b)=>b.played-a.played);
  },

    const players = this.state.players.filter(p=> !search || norm(p.name).includes(norm(search)));

        </div>
        ${players.length===0 ? `<p class="muted" style="font-size:12.5px;">Aucun joueur trouvé.</p>` :

  renderTeamRostersSection(){

    const info = this.state.info || this.defaultInfo();
    const col = (key, label, emoji) => {
      const roster = this.state.players.filter(p=>p.team===key);
      if(!roster.length) return `<div class="tc-card"><span class="muted" style="font-size:11px;">${emoji} ${esc(label.toUpperCase())}</span><p class="muted" style="font-size:12px;margin-top:8px;">Aucun joueur assigné.</p></div>`;
      const bestXI = this.activeBestXIVariant(key) || {formation:"4-3-3", assignments:{}};

      const rowFor = p => `<div class="kv" style="border:none;"><span>${p.photo?`<img class="avatar" style="width:22px;height:22px;vertical-align:middle;margin-right:6px;" src="${p.photo}">`:''}${esc(p.name)}</span><span class="muted" style="font-size:11.5px;">${esc(p.position||"?")}</span></div>`;

        <hr class="sep" style="margin:8px 0;">
        <p class="muted" style="font-size:11.5px;margin-bottom:2px;">🟢 Titulaires (Meilleur 11)</p>

        <p class="muted" style="font-size:11.5px;margin:8px 0 2px;">🔁 Remplaçants</p>
        ${subs.length ? subs.map(rowFor).join("") : `<p class="muted" style="font-size:11.5px;">—</p>`}

    };
    return `
    <div class="card">
      <h2>👥 Effectifs par équipe</h2>
      <p class="muted" style="font-size:12px;margin-top:-6px;">Titulaires = joueurs placés dans le Meilleur 11 de leur équipe (à configurer plus bas). Remplaçants = le reste de l'effectif.</p>
      <div class="team-compare">
        ${col('A', tn.a, this.teamLogoTag('A',14))}
        ${col('B', tn.b, this.teamLogoTag('B',14))}
      </div>
